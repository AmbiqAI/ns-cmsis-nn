name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recover_tag:
        description: >
          Existing release tag (e.g. v7.29.2) to re-run asset publication
          for. Idempotent recovery only: never creates, moves, or
          re-publishes a tag/release -- it just re-runs the
          staticlib/bundle/pack/CI-image jobs against an ALREADY-EXISTING
          GitHub Release and re-uploads any missing/updated assets to it.
          Leave empty for a normal push-triggered release.
        required: false
        type: string
        default: ''

permissions:
  contents: write        # tag, releases, uploads
  pull-requests: write   # update/open release PRs
  packages: write        # publish versioned CI images
  pages: write           # publish Pages
  id-token: write        # OIDC for Pages deploy
  actions: read          # coverage-gate baseline fetch inside the called
                         # tester workflow (#370); absent, the whole release
                         # run startup-fails the way the first nightly did

# A release run publishes the tag and the non-draft GitHub Release FIRST and
# then spends 15-20 min producing assets, so being cancelled halfway leaves a
# permanently broken public release -- and `gh release upload --clobber`
# deletes an existing asset before re-uploading it, so a cancellation during
# a recovery run can leave a release strictly worse than before
# (AmbiqAI/ns-cmsis-nn#274, section 3).
#
# `cancel-in-progress` is a property of the INCOMING run: it decides whether
# the run being queued cancels whatever is already running in its group. So
# leaving `cancel-in-progress: true` and merely renaming the release group
# would NOT have helped -- the killer is whatever lands next. Both halves
# below are needed.
#
# Two properties have to hold at once:
#
#   1. An ordinary merge must never cancel a release or a recovery run.
#      Ordinary pushes stay in a `rolling` group that release traffic never
#      joins. Demonstrated live: Release run 32090494932 was cancelled by the
#      push 5 s behind it (32090500563), and run 31342565693 was superseded
#      11 s in by a recovery dispatch and torn down over the next five
#      minutes.
#
#   2. Two runs must never `--clobber` the same tag concurrently. Today that
#      holds only by accident -- every run shares one group with
#      cancel-in-progress, so a second run kills the first. The four #228
#      recovery dispatches (31333176320, 31335858426, 31337539282,
#      31342573497) each cancelled a push run seconds earlier, which is that
#      accident doing real work. Giving each release run a run-unique group
#      would have destroyed it and let two recovery dispatches race
#      delete-then-upload on one tag -- with no rollback, and with
#      release-verify below actively telling operators to run recovery.
#      Instead release traffic SHARES one `release` group with
#      cancel-in-progress FALSE, so a second release/recovery run queues
#      behind the first instead of either cancelling it or racing it.
#
# `contains`, not `startsWith`: release PRs are not always squash-merged.
# c8a2336 (7.21.0) and 0d0e9db (7.20.0) landed as merge commits whose SUBJECT
# is "Merge pull request #NNN from AmbiqAI/release-please--branches--main..."
# with `chore(main): release <version>` further down the message body, and the
# repo still permits that merge method. `startsWith` returns false there, the
# release lands in the rolling group, and the next merge kills it -- the exact
# bug this block fixes, silently restored. `contains` matches both shapes, and
# it fails safe: a false positive only makes one ordinary CI run
# uncancellable.
#
# `github.event.head_commit` is null on workflow_dispatch. The
# `github.event_name == 'push'` guard is evaluated first, and even if the
# right-hand side were still evaluated, a null property yields '' and
# contains('', ...) is false -- so a dispatch run always reaches the
# `release` branch with cancel-in-progress false.
concurrency:
  # Both values are double-quoted because the expressions embed
  # `chore(main): release` -- a bare `: ` inside a plain YAML scalar is
  # parsed as a mapping and the file fails to load.
  group: "${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore(main): release')) && 'rolling' || 'release' }}"
  cancel-in-progress: "${{ github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore(main): release') }}"

jobs:
  release-please:
    runs-on: ubuntu-24.04
    # Owns the shared release concurrency group; unbounded, a wedged run holds it for the 6-hour default.
    timeout-minutes: 30
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      recovery_mode: ${{ steps.recover.outputs.tag != '' }}
      # Gate for downstream asset-publishing jobs: true for a genuine new
      # release-please release AND for an explicit existing-tag asset
      # recovery run (AmbiqAI/ns-cmsis-nn#228). `release_created` above
      # keeps its original, narrower meaning (a NEW tag/release was just
      # cut) for anything that cares about that distinction specifically.
      assets_enabled: ${{ steps.rp.outputs.release_created == 'true' || steps.recover.outputs.tag != '' }}
      tag_name: ${{ steps.ver.outputs.TAG || steps.rp.outputs.tag_name }}
      version: ${{ steps.ver.outputs.VERSION }}
      # The exact, verified commit the release tag points at (AmbiqAI/ns-cmsis-nn#228).
      # ALL downstream asset-building/testing jobs must check out THIS commit,
      # never github.sha/github.ref of whatever ref triggered this workflow
      # run -- for a recovery dispatch that's an arbitrary branch selection
      # with no required relationship to the tag being recovered.
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      # 0) Detect explicit existing-tag asset-recovery mode. This never
      # creates or moves a tag -- it only unlocks the downstream
      # asset-publishing jobs for a tag/release that must already exist.
      - name: Detect recovery mode
        id: recover
        env:
          RECOVER_TAG: ${{ github.event.inputs.recover_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RECOVER_TAG:-}"
          if [[ -n "$tag" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::recover_tag '${tag}' does not match the expected vX.Y.Z tag format." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # 1) Create/Update Release PR; on merge, tag + create release. Skipped
      # entirely in recovery mode so this run can never create or move a tag.
      - uses: googleapis/release-please-action@v5
        id: rp
        if: ${{ steps.recover.outputs.tag == '' }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # 2) Recovery mode: verify the requested tag already has a published
      # GitHub Release before unlocking any asset-publishing job. Fails
      # loudly rather than silently falling through if the tag is unknown,
      # so this can never be mistaken for a way to publish a brand-new tag.
      - name: Verify recovery tag already has a published release
        if: ${{ steps.recover.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVER_TAG: ${{ steps.recover.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${{ github.repository }}/releases/tags/${RECOVER_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag '${RECOVER_TAG}' has no existing GitHub Release. Recovery mode only re-runs asset publication for an ALREADY-PUBLISHED release; it never creates or moves tags. Publish '${RECOVER_TAG}' through the normal release-please flow first." >&2
            exit 1
          fi
          echo "Recovery mode confirmed: '${RECOVER_TAG}' has a published release; re-running asset publication without touching the tag."

      # 3) Only do the rest for a NEW release or a confirmed recovery tag.
      # This first checkout is a bootstrap only: it exists to get
      # scripts/ci/resolve_release_commit.sh onto disk so the next step can
      # run it. It intentionally does NOT pin a ref -- it uses whatever ref
      # triggered this workflow run, which for a recovery dispatch of an OLD
      # tag (e.g. v7.29.1) predates this recovery tooling and would not even
      # contain the script. Nothing that reads release source/assets runs
      # against this checkout; every one of those steps runs after the
      # re-checkout below, pinned to the resolved, trusted commit.
      - name: Checkout code (bootstrap)
        if: ${{ steps.rp.outputs.release_created == 'true' || steps.recover.outputs.tag != '' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch tags
        if: ${{ steps.rp.outputs.release_created == 'true' || steps.recover.outputs.tag != '' }}
        run: git fetch --tags --force

      # 3a) Resolve the release tag to its exact, immutable target commit
      # SHA exactly once (AmbiqAI/ns-cmsis-nn#228). Uses the GitHub REST "Get
      # a commit" endpoint, which transparently peels annotated tags. This is
      # the single trusted commit that every downstream build/test job pins
      # its checkout to -- it is never re-derived independently downstream.
      - name: Resolve trusted release commit
        if: ${{ steps.rp.outputs.release_created == 'true' || steps.recover.outputs.tag != '' }}
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.recover.outputs.tag || steps.rp.outputs.tag_name }}
        run: |
          set -euo pipefail
          bash scripts/ci/resolve_release_commit.sh \
            "${{ github.repository }}" "${RELEASE_TAG}" "$GITHUB_OUTPUT"

      # 3b) Re-checkout at the resolved trusted commit. actions/checkout can
      # be invoked more than once per job; this second call re-syncs the
      # working tree so every step from here on -- Compute version, Clean
      # output dir, and (via job outputs) publish-staticlibs, publish-pack,
      # and the CI image/test workflows -- builds from the exact commit the
      # tag points at, never the workflow-dispatch/push ref.
      - name: Checkout code (pinned to resolved commit)
        if: ${{ steps.rp.outputs.release_created == 'true' || steps.recover.outputs.tag != '' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.commit_sha }}
          fetch-depth: 0

      - name: Wait for release API to be ready
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag='${{ steps.rp.outputs.tag_name }}'
          for i in {1..10}; do
            if gh api repos/${{ github.repository }}/releases/tags/"$tag" >/dev/null 2>&1; then
              echo "Release $tag is available."
              exit 0
            fi
            echo "Waiting for release $tag (try $i/10)..."
            sleep 3
          done
          echo "Release $tag not visible to API yet." >&2
          exit 1

      - name: Clean output dir
        if: ${{ steps.rp.outputs.release_created == 'true' || steps.recover.outputs.tag != '' }}
        run: |
          rm -f ./output/*.pack

      - name: Compute version
        if: ${{ steps.rp.outputs.release_created == 'true' || steps.recover.outputs.tag != '' }}
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.recover.outputs.tag || steps.rp.outputs.tag_name }}'
          version='${{ steps.rp.outputs.version }}'
          if [[ -z "$version" ]]; then
            version="$(printf '%s\n' "$tag" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          fi
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"


  resolve-release-capabilities:
    # Decides which OPTIONAL release assets this run can actually produce,
    # without ever printing secret values. See AmbiqAI/ns-cmsis-nn#228 and
    # #275: Armclang needs an Arm Compiler for Embedded licence, so its
    # static-library/bundle publication is best-effort and must be skipped
    # (not fail the release) when ARM_UBL_LICENSE_IDENTIFIER is unset. GCC
    # and ATfE static libs, the source tag, and the CMSIS-Pack remain
    # required and are never gated by this job. See docs/guides/releases.md
    # for the full required-vs-optional asset matrix.
    #
    # ARM_UBL_LICENSE_IDENTIFIER is Arm's User-Based Licensing activation
    # code -- the scheme AmbiqAI/helia-rt already builds armclang with on
    # hosted runners, redeemed by `armlm activate --code <identifier>`. It
    # replaces ARMLMD_LICENSE_FILE, the legacy FlexLM licence-file variable
    # this job used to read. That FlexLM secret has never been configured on
    # this repository, so this gate has always resolved to "unavailable" and
    # armclang assets have never shipped in any release (#275). The UBL
    # identifier IS configured, so this gate now resolves to "available" and
    # publish-staticlibs-armclang below genuinely builds and uploads.
    #
    # Only runs when assets are actually going to be published (a new
    # release-please release or a confirmed recover_tag run), so ordinary
    # pushes to main that don't cut a release don't pay for this job or
    # emit a spurious "no license configured" warning.
    if: ${{ needs.release-please.outputs.assets_enabled == 'true' }}
    needs: release-please
    runs-on: ubuntu-24.04
    # One `[[ -n ... ]]` test; green in ~2 s. Bounded because the concurrency
    # change above removes the accidental watchdog whereby a later merge
    # killed a wedged run -- without a bound, detection latency on a wedged
    # job is now the 6-hour GitHub default (AmbiqAI/ns-cmsis-nn#274).
    timeout-minutes: 5
    outputs:
      armclang_available: ${{ steps.check.outputs.armclang_available }}
    steps:
      - name: Check Armclang license availability
        id: check
        env:
          ARM_UBL_LICENSE_IDENTIFIER: ${{ secrets.ARM_UBL_LICENSE_IDENTIFIER }}
        run: |
          set -euo pipefail
          # Presence only. The identifier's value is never echoed, written to
          # a step output, or interpolated into any annotation below.
          if [[ -n "${ARM_UBL_LICENSE_IDENTIFIER:-}" ]]; then
            echo "armclang_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "armclang_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Optional asset skipped::ARM_UBL_LICENSE_IDENTIFIER is not configured on this repository, so Armclang static-library assets will be skipped for this release. Source tag, GCC/ATfE static libs, and the CMSIS-Pack are unaffected. See docs/guides/releases.md."
          fi

  publish-staticlibs:
    # Cross-compile cmsis-nn as static libraries for cortex-m0 / m4 / m55
    # across the supported release toolchains. Uploads workflow artefacts for
    # downstream release jobs; publish-staticlib-bundles owns GitHub Release
    # uploads so the release page does not grow loose .a/.sha256 pairs.
    #
    # Every leg of this job is REQUIRED: a failure here fails the release.
    # armclang is NOT a leg -- it lives in publish-staticlibs-armclang below,
    # which is optional and tolerated. See that job's header for why it was
    # split out (AmbiqAI/ns-cmsis-nn#275).
    if: ${{ needs.release-please.outputs.assets_enabled == 'true' }}
    needs: release-please
    runs-on: ubuntu-latest
    # Green legs run 18-47 s; 30 min is ~40x headroom over the slowest.
    # Bounded for the same reason as resolve-release-capabilities above.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target_cpu: [cortex-m0, cortex-m4, cortex-m55]
        toolchain: [gcc, atfe]
    steps:
      # Pinned to the exact commit release-please resolved the release tag
      # to -- never the ref that triggered this workflow run
      # (AmbiqAI/ns-cmsis-nn#228). Required for recovery dispatches, where
      # that triggering ref has no required relationship to the tag being
      # recovered.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.commit_sha }}

      - name: Install GNU Arm Embedded toolchain
        if: ${{ matrix.toolchain == 'gcc' }}
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: 13.2.Rel1

      - name: Fetch external toolchain
        if: ${{ matrix.toolchain != 'gcc' }}
        id: fetch_toolchain
        run: |
          bash scripts/fetch_toolchain.sh \
            --manifest "ci/toolchains/${{ matrix.toolchain }}.json" \
            --platform linux-x86_64 \
            --outdir "${RUNNER_TEMP}/toolchains"

      - name: Build static library
        env:
          TARGET_CPU: ${{ matrix.target_cpu }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          TOOLCHAIN_ROOT: ${{ steps.fetch_toolchain.outputs.toolchain_root }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          # Published archives are supersets: F32 is enabled for every
          # qualified CPU/toolchain combination in this matrix, and F16 is
          # enabled only where currently qualified (cortex-m55, matching
          # the ARMV8_1_M_MVEF Kconfig restriction). Flags are always
          # passed explicitly — never relying on CMake option() defaults —
          # so the archive's actual contents can never silently drift from
          # what this workflow intended to publish.
          f16_flag=()
          if [[ "$TARGET_CPU" == "cortex-m55" ]]; then
            f16_flag=(--enable-f16)
          fi
          bash scripts/build_staticlib.sh \
            --target-cpu "$TARGET_CPU" \
            --version    "$VERSION" \
            --toolchain  "$TOOLCHAIN" \
            --toolchain-root "$TOOLCHAIN_ROOT" \
            --outdir     "./output/$TOOLCHAIN/$TARGET_CPU" \
            --enable-f32 \
            "${f16_flag[@]}"

      - name: Smoke-verify static library
        # GCC and ATfE get a bare-metal link smoke test. armclang currently gets
        # compile-plus-archive-symbol verification because Arm's linker option
        # dialect differs from the GNU/LLD path used by the other toolchains.
        env:
          TARGET_CPU: ${{ matrix.target_cpu }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          TOOLCHAIN_ROOT: ${{ steps.fetch_toolchain.outputs.toolchain_root }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [[ "$TOOLCHAIN" == "gcc" ]]; then
            lib="./output/${TOOLCHAIN}/${TARGET_CPU}/libns-cmsis-nn-${TARGET_CPU}-${VERSION}.a"
          else
            lib="./output/${TOOLCHAIN}/${TARGET_CPU}/libns-cmsis-nn-${TOOLCHAIN}-${TARGET_CPU}-${VERSION}.a"
          fi
          bash scripts/smoke/smoke_staticlib.sh \
            --target-cpu "$TARGET_CPU" \
            --toolchain  "$TOOLCHAIN" \
            --toolchain-root "$TOOLCHAIN_ROOT" \
            --library    "$lib" \
            --outdir     "./output/${TOOLCHAIN}/${TARGET_CPU}/smoke"

      - name: Build SDK tarball
        env:
          TARGET_CPU: ${{ matrix.target_cpu }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          TOOLCHAIN_VERSION: ${{ steps.fetch_toolchain.outputs.toolchain_version }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [[ "$TOOLCHAIN" == "gcc" ]]; then
            lib="./output/${TOOLCHAIN}/${TARGET_CPU}/libns-cmsis-nn-${TARGET_CPU}-${VERSION}.a"
            toolchain_version="13.2.Rel1"
          else
            lib="./output/${TOOLCHAIN}/${TARGET_CPU}/libns-cmsis-nn-${TOOLCHAIN}-${TARGET_CPU}-${VERSION}.a"
            toolchain_version="$TOOLCHAIN_VERSION"
          fi
          # Feature metadata is authoritatively sourced from the
          # "<lib>.buildconfig.json" sidecar build_staticlib.sh just wrote;
          # re-passing the same flags here makes build_sdk_tarball.sh
          # cross-check them and fail loudly on any drift between what
          # this workflow requested and what was actually compiled.
          f16_flag=()
          if [[ "$TARGET_CPU" == "cortex-m55" ]]; then
            f16_flag=(--enable-f16)
          fi
          bash scripts/build_sdk_tarball.sh \
            --target-cpu         "$TARGET_CPU" \
            --version            "$VERSION"    \
            --staticlib          "$lib"        \
            --toolchain          "$TOOLCHAIN"  \
            --toolchain-version  "$toolchain_version" \
            --outdir             "./output/${TOOLCHAIN}/${TARGET_CPU}" \
            --enable-f32 \
            "${f16_flag[@]}"

      - name: Upload artefacts (cross-job)
        # Pack-prebuilt job (M3 #167 follow-up) downloads these.
        uses: actions/upload-artifact@v4
        with:
          name: ns-cmsis-nn-staticlib-${{ matrix.toolchain }}-${{ matrix.target_cpu }}
          path: |
            ./output/${{ matrix.toolchain }}/${{ matrix.target_cpu }}/libns-cmsis-nn-*.a
            ./output/${{ matrix.toolchain }}/${{ matrix.target_cpu }}/libns-cmsis-nn-*.a.sha256
            ./output/${{ matrix.toolchain }}/${{ matrix.target_cpu }}/ns-cmsis-nn-*.tar.gz
            ./output/${{ matrix.toolchain }}/${{ matrix.target_cpu }}/ns-cmsis-nn-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish-staticlibs-armclang:
    # armclang, split out of the publish-staticlibs matrix (AmbiqAI/ns-cmsis-nn#275).
    #
    # Two reasons, one licensing and one plain economics:
    #
    #   * ONE licence activation per release. Arm's User-Based Licensing
    #     entitlement is redeemed per machine by `armlm activate`, and a
    #     GitHub matrix leg is its own runner VM, so three armclang legs meant
    #     three activations fired within seconds of each other on every
    #     release. Activation state cannot be shared between runner VMs (it is
    #     written to the machine's local licence store), so consolidating the
    #     three CPUs into a single runner is the only way to activate once.
    #   * ONE toolchain download per release. Each leg pulled the ~1 GB
    #     standalone Arm Compiler archive from artifacts.tools.arm.com
    #     (ci/toolchains/armclang.json); three legs pulled it three times.
    #
    # The three CPUs build sequentially here. Green armclang builds run
    # 18-47 s each, so the serial cost is ~2 min against a toolchain fetch
    # that dominates the job either way -- and the job as a whole is now
    # cheaper in wall-clock than the three legs it replaces.
    #
    # This job is OPTIONAL. `continue-on-error: true` is the job-level form of
    # the per-leg `continue-on-error: ${{ matrix.toolchain == 'armclang' }}`
    # that #277 added, and it carries the same intent: a broken or unlicensed
    # armclang must never fail the release or `needs:`-cascade into skipping
    # the pack, bundles and test suites. Note the asymmetry is deliberate --
    # publish-staticlibs (gcc/atfe) stays fully required, because v7.26.0 went
    # empty when the ATFE legs failed and that must keep failing the release.
    #
    # It is deliberately NOT gated on the licence at the job level. When no
    # identifier is configured every step self-skips and the job succeeds as a
    # no-op rather than skipping. (It can still be skipped if a `needs:` job
    # fails outright; that is survivable because publish-staticlib-bundles
    # guards on `!cancelled()` and release-verify on `always()`, so neither
    # waits on this job's own conclusion.)
    #
    # armclang's 8 assets stay OPTIONAL until the repository variable
    # ARMCLANG_REQUIRED is set to "true". No release from v7.24.1 onward has
    # published a single armclang asset, so requiring them before a run has
    # proven the path works would turn every release red with no way out:
    # release-verify would fail, auto-file a broken-release issue, and the
    # recovery that issue prescribes would re-run this same job and fail
    # again. Flip the variable once a release has actually produced the 8.
    if: ${{ needs.release-please.outputs.assets_enabled == 'true' }}
    needs: [release-please, resolve-release-capabilities]
    runs-on: ubuntu-latest
    # This job runs a third-party action and an apt install as root with a
    # licensing secret in scope, so it takes the narrowest token in the file
    # rather than the workflow-level contents/packages/pages/id-token: write.
    # It only reads the repo: artefact upload authenticates with
    # ACTIONS_RUNTIME_TOKEN, and release assets are published by
    # publish-staticlib-bundles, not here.
    permissions:
      contents: read
    outputs:
      # `built` is a job OUTPUT, deliberately not needs.<job>.result: a
      # continue-on-error job that FAILED still reports result == 'success',
      # so release-verify would announce a broken armclang build as a healthy
      # one. Outputs are not laundered that way. "true" = archives produced,
      # "skipped" = no licence so the step self-skipped, absent = the job
      # actually broke.
      built: ${{ steps.build_armclang.outputs.built }}
    # Runs in the CI container specifically so `armlm` executes as root. The
    # Arm User-Based Licensing entitlement is bound to CI user "root";
    # activating as the default hosted-runner user ("runner") is refused with
    # "The activation code has already been used by another user". The image
    # has no USER directive, so it runs as root. This mirrors the dryrun
    # workflow and AmbiqAI/helia-rt, whose working armclang activations all
    # run in a container (AmbiqAI/ns-cmsis-nn#279).
    # Digest-pinned, not `:latest`. publish-ci-image republishes `:latest` on
    # every release and a weekly cron rebuilds it from main, so `:latest`
    # would mean this secret-handling job runs an image nobody reviewed --
    # and release N's assets would be built inside release N-1's image. The
    # `:${{ tag_name }}` pin used by release-unit-tests and
    # release-helia-core-tester is not available here: those jobs can wait on
    # publish-ci-image, but adding that edge would let a failed image build
    # SKIP this job, and a skipped job is exactly the state the comment above
    # depends on never happening. Refresh with:
    #   docker buildx imagetools inspect ghcr.io/ambiqai/ns-cmsis-nn-ci:latest
    container:
      image: ghcr.io/ambiqai/ns-cmsis-nn-ci@sha256:0d18641d43015eba02d8e05821b59c95ddfcdf0d9ff7a070edd532bad3e09eeb
    defaults:
      run:
        # Inside a container GitHub defaults to `sh -e`, which lacks
        # `set -o pipefail` and `[[ ]]`. Every run: block in this job is
        # bash, so pin it rather than degrade the scripts to POSIX sh.
        shell: bash
    continue-on-error: true
    # Toolchain fetch (~1 GB) plus three ~40 s builds. Bounded for the same
    # reason as resolve-release-capabilities above.
    timeout-minutes: 45
    env:
      ARMCLANG_AVAILABLE: ${{ needs.resolve-release-capabilities.outputs.armclang_available }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      # Pinned to the exact commit release-please resolved the release tag
      # to -- never the ref that triggered this workflow run
      # (AmbiqAI/ns-cmsis-nn#228), matching publish-staticlibs above.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.commit_sha }}
          # Default true writes GITHUB_TOKEN into .git/config. Nothing here
          # pushes, and this job runs third-party code as root, so keep the
          # token out of the container filesystem entirely.
          persist-credentials: false

      - name: Confirm the runtime user is root
        if: ${{ needs.resolve-release-capabilities.outputs.armclang_available == 'true' }}
        # The Arm UBL entitlement is bound to CI user "root". If this prints
        # anything else, activation will be refused -- fail here with a clear
        # message rather than at `armlm activate` with a misleading one.
        run: |
          set -euo pipefail
          echo "whoami: $(whoami)  (uid=$(id -u))"
          if [[ "$(id -u)" -ne 0 ]]; then
            echo "::error title=Not running as root::armlm must run as root for this entitlement; got $(whoami)." >&2
            exit 1
          fi

      # llvm-nm, llvm-size and llvm-strip, which scripts/smoke/smoke_staticlib.sh
      # and scripts/build_staticlib.sh resolve off PATH for this toolchain. The
      # archiver is NOT from here -- cmake/toolchain/armclang.cmake takes armar
      # from the Arm Compiler root, because CMake's ARMClang archive rule speaks
      # armar's dialect and llvm-ar rejects it.
      - name: Install LLVM binutils
        if: ${{ needs.resolve-release-capabilities.outputs.armclang_available == 'true' }}
        # No sudo: this job runs as root inside the CI container.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends llvm

      - name: Fetch external toolchain
        if: ${{ needs.resolve-release-capabilities.outputs.armclang_available == 'true' }}
        id: fetch_toolchain
        run: |
          bash scripts/fetch_toolchain.sh \
            --manifest "ci/toolchains/armclang.json" \
            --platform linux-x86_64 \
            --outdir "${RUNNER_TEMP}/toolchains"

      # `armlm` is the Arm License Manager, and it ships inside the Arm
      # Compiler install root rather than being installed separately -- the CI
      # image puts this same bin/ on PATH (.devcontainer/Dockerfile), and
      # AmbiqAI/helia-rt invokes it as "$(TARGET_TOOLCHAIN_ROOT)armlm". The
      # activation action below calls a bare `armlm`, so the freshly fetched
      # toolchain has to be on PATH first. Nothing here shadows the
      # apt-installed llvm-ar/llvm-ranlib that cmake/toolchain/armclang.cmake
      # resolves via find_program: Arm Compiler names its own archiver
      # `armar`, not `llvm-ar`.
      - name: Prepare Arm license manager
        if: ${{ needs.resolve-release-capabilities.outputs.armclang_available == 'true' }}
        env:
          TOOLCHAIN_ROOT: ${{ steps.fetch_toolchain.outputs.toolchain_root }}
        run: |
          set -euo pipefail
          if [[ ! -x "${TOOLCHAIN_ROOT}/bin/armlm" ]]; then
            echo "::error title=Arm license manager missing::No executable armlm under ${TOOLCHAIN_ROOT}/bin -- the Arm Compiler archive named in ci/toolchains/armclang.json cannot activate a user-based licence." >&2
            exit 1
          fi
          echo "${TOOLCHAIN_ROOT}/bin" >> "$GITHUB_PATH"

      # Arm User-Based Licensing, activated exactly once per release run. The
      # official action runs `armlm activate --code <identifier>` -- the same
      # call AmbiqAI/helia-rt makes with this same secret from its Cortex-M
      # makefiles, and the same action helia-rt's cortex_m_arm_compiler.yml
      # uses. helia-rt has no matching `armlm deactivate` and none is added
      # here: an always()-guarded deactivate would add a new failure path on
      # runs where activation never happened, for no benefit.
      #
      # The identifier goes straight from `secrets` into the action's `code`
      # input. GitHub masks it in logs and no step in this workflow echoes it.
      - name: Activate Arm tool license
        if: ${{ needs.resolve-release-capabilities.outputs.armclang_available == 'true' }}
        # SHA-pinned, unlike every other action in this repo, because this is
        # the only third-party action that receives a repository secret other
        # than GITHUB_TOKEN -- it interpolates the activation code into a
        # generated shell command. `v1` is a moving alias (it has tracked
        # v1.0 -> v1.3), so a retag would silently replace the code handling
        # that secret. Same reasoning as the sha256 pin on the Arm Compiler
        # download in ci/toolchains/armclang.json.
        uses: ARM-software/cmsis-actions/armlm@8a50b77681a484568e08f31fb7c2285c4735f682  # v1.3
        with:
          code: ${{ secrets.ARM_UBL_LICENSE_IDENTIFIER }}

      - name: Build, smoke-verify and package static libraries
        id: build_armclang
        env:
          TOOLCHAIN_ROOT: ${{ steps.fetch_toolchain.outputs.toolchain_root }}
          TOOLCHAIN_VERSION: ${{ steps.fetch_toolchain.outputs.toolchain_version }}
        run: |
          set -euo pipefail
          # Optional-asset gate: no licence means this job is a no-op SUCCESS
          # rather than a failure. Fails safe if the capability output ever
          # arrives empty ("" != "true").
          if [[ "${ARMCLANG_AVAILABLE}" != "true" ]]; then
            echo "::notice title=Optional asset skipped::No Arm Compiler licence configured; skipping all armclang static libraries for this release."
            echo "built=skipped" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          for TARGET_CPU in cortex-m0 cortex-m4 cortex-m55; do
            echo "::group::armclang / ${TARGET_CPU}"
            outdir="./output/armclang/${TARGET_CPU}"
            # Published archives are supersets: F32 is enabled for every
            # qualified CPU/toolchain combination, and F16 only where
            # currently qualified (cortex-m55, matching the ARMV8_1_M_MVEF
            # Kconfig restriction). Flags are always passed explicitly --
            # never relying on CMake option() defaults -- so the archive's
            # actual contents can never silently drift from what this
            # workflow intended to publish.
            f16_flag=()
            if [[ "${TARGET_CPU}" == "cortex-m55" ]]; then
              f16_flag=(--enable-f16)
            fi
            bash scripts/build_staticlib.sh \
              --target-cpu "$TARGET_CPU" \
              --version    "$VERSION" \
              --toolchain  armclang \
              --toolchain-root "$TOOLCHAIN_ROOT" \
              --outdir     "$outdir" \
              --enable-f32 \
              "${f16_flag[@]}"

            lib="${outdir}/libns-cmsis-nn-armclang-${TARGET_CPU}-${VERSION}.a"

            # armclang gets compile-plus-archive-symbol verification rather
            # than the bare-metal link GCC and ATfE get, because Arm's linker
            # option dialect differs from the GNU/LLD path.
            bash scripts/smoke/smoke_staticlib.sh \
              --target-cpu "$TARGET_CPU" \
              --toolchain  armclang \
              --toolchain-root "$TOOLCHAIN_ROOT" \
              --library    "$lib" \
              --outdir     "${outdir}/smoke"

            # Feature metadata is authoritatively sourced from the
            # "<lib>.buildconfig.json" sidecar build_staticlib.sh just wrote;
            # re-passing the same flags here makes build_sdk_tarball.sh
            # cross-check them and fail loudly on any drift between what this
            # workflow requested and what was actually compiled.
            bash scripts/build_sdk_tarball.sh \
              --target-cpu         "$TARGET_CPU" \
              --version            "$VERSION"    \
              --staticlib          "$lib"        \
              --toolchain          armclang      \
              --toolchain-version  "$TOOLCHAIN_VERSION" \
              --outdir             "$outdir" \
              --enable-f32 \
              "${f16_flag[@]}"
            echo "::endgroup::"
          done
          # Reached only when all three CPUs built, smoke-verified and
          # packaged. If any of that failed, `set -e` aborted above and this
          # output stays unset -- which is precisely how release-verify tells
          # a real failure apart from a deliberate skip.
          echo "built=true" >> "${GITHUB_OUTPUT}"

      # One upload per CPU, with names and paths byte-identical to what the
      # old matrix legs produced, so publish-staticlib-bundles and
      # release-verify need no knowledge of this restructure. `uses:` steps
      # cannot be looped, hence the repetition.
      - name: Upload cortex-m0 artefacts (cross-job)
        if: ${{ needs.resolve-release-capabilities.outputs.armclang_available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ns-cmsis-nn-staticlib-armclang-cortex-m0
          path: |
            ./output/armclang/cortex-m0/libns-cmsis-nn-*.a
            ./output/armclang/cortex-m0/libns-cmsis-nn-*.a.sha256
            ./output/armclang/cortex-m0/ns-cmsis-nn-*.tar.gz
            ./output/armclang/cortex-m0/ns-cmsis-nn-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload cortex-m4 artefacts (cross-job)
        if: ${{ needs.resolve-release-capabilities.outputs.armclang_available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ns-cmsis-nn-staticlib-armclang-cortex-m4
          path: |
            ./output/armclang/cortex-m4/libns-cmsis-nn-*.a
            ./output/armclang/cortex-m4/libns-cmsis-nn-*.a.sha256
            ./output/armclang/cortex-m4/ns-cmsis-nn-*.tar.gz
            ./output/armclang/cortex-m4/ns-cmsis-nn-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload cortex-m55 artefacts (cross-job)
        if: ${{ needs.resolve-release-capabilities.outputs.armclang_available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ns-cmsis-nn-staticlib-armclang-cortex-m55
          path: |
            ./output/armclang/cortex-m55/libns-cmsis-nn-*.a
            ./output/armclang/cortex-m55/libns-cmsis-nn-*.a.sha256
            ./output/armclang/cortex-m55/ns-cmsis-nn-*.tar.gz
            ./output/armclang/cortex-m55/ns-cmsis-nn-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish-staticlib-bundles:
    # `!cancelled()` plus an EXPLICIT success test on publish-staticlibs,
    # rather than the implicit `needs:` gate. publish-staticlibs-armclang is
    # optional and tolerated, so this job must still run when that job failed
    # -- but the required gcc/atfe job must keep holding the release, which
    # the implicit gate stops doing as soon as any `always()`-family condition
    # is present (AmbiqAI/ns-cmsis-nn#275, #277).
    #
    # `!cancelled()` and NOT `always()`: this job runs
    # `gh release upload --clobber`, which deletes an asset before replacing
    # it, and the concurrency block above exists precisely so a cancellation
    # can never interrupt that. `always()` would opt this job back into
    # running during a cancellation (AmbiqAI/ns-cmsis-nn#274).
    if: ${{ !cancelled() && needs.release-please.outputs.assets_enabled == 'true' && needs.publish-staticlibs.result == 'success' }}
    needs: [release-please, publish-staticlibs, publish-staticlibs-armclang]
    runs-on: ubuntu-24.04
    # Green in ~9 s (download, zip, upload). Bounded for the same reason as
    # resolve-release-capabilities above.
    timeout-minutes: 10
    steps:
      - name: Download staticlib artefacts
        uses: actions/download-artifact@v4
        with:
          path: ./_artifacts
          pattern: ns-cmsis-nn-staticlib-*

      - name: Build per-toolchain staticlib bundles
        # gcc/atfe bundles are REQUIRED: a missing per-cpu archive fails the
        # job. The armclang bundle is OPTIONAL (AmbiqAI/ns-cmsis-nn#228: no
        # Arm Compiler license on hosted runners) -- if any cortex-m*
        # armclang archive is absent (either because the license was
        # unavailable or a real build failure occurred upstream), the
        # armclang bundle is skipped with a warning instead of failing the
        # whole release.
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ./release-assets
          for toolchain in gcc atfe armclang; do
            bundle="ns-cmsis-nn-staticlibs-${toolchain}-${VERSION}"
            root="./_bundle/${bundle}"
            rm -rf "$root"
            mkdir -p "$root"
            printf '{\n  "schema_version": 1,\n  "package": "ns-cmsis-nn-staticlibs",\n  "version": "%s",\n  "toolchain": "%s",\n  "libraries": [\n' "$VERSION" "$toolchain" > "$root/manifest.json"
            first=1
            skip_bundle=0
            for cpu in cortex-m0 cortex-m4 cortex-m55; do
              src_dir="./_artifacts/ns-cmsis-nn-staticlib-${toolchain}-${cpu}"
              if [[ "$toolchain" == "gcc" ]]; then
                src="${src_dir}/libns-cmsis-nn-${cpu}-${VERSION}.a"
              else
                src="${src_dir}/libns-cmsis-nn-${toolchain}-${cpu}-${VERSION}.a"
              fi
              if [[ ! -f "$src" ]]; then
                if [[ "$toolchain" == "armclang" ]]; then
                  echo "::warning title=Optional asset skipped::missing optional armclang staticlib for ${cpu} (${src}); skipping the armclang bundle. See docs/guides/releases.md." >&2
                  skip_bundle=1
                  break
                fi
                echo "missing required staticlib: $src" >&2
                exit 1
              fi
              mkdir -p "$root/$cpu"
              cp "$src" "$root/$cpu/libns-cmsis-nn.a"
              ( cd "$root/$cpu" && sha256sum libns-cmsis-nn.a > libns-cmsis-nn.a.sha256 )
              sha="$(awk '{print $1}' "$root/$cpu/libns-cmsis-nn.a.sha256")"
              size="$(stat -c %s "$root/$cpu/libns-cmsis-nn.a")"
              if (( first == 0 )); then printf ',\n' >> "$root/manifest.json"; fi
              first=0
              printf '    { "target_cpu": "%s", "path": "%s/libns-cmsis-nn.a", "sha256": "%s", "size_bytes": %s }' "$cpu" "$cpu" "$sha" "$size" >> "$root/manifest.json"
            done
            if (( skip_bundle == 1 )); then
              rm -rf "$root"
              continue
            fi
            printf '\n  ]\n}\n' >> "$root/manifest.json"
            ( cd ./_bundle && zip -qr "../release-assets/${bundle}.zip" "$bundle" )
            ( cd ./release-assets && sha256sum "${bundle}.zip" > "${bundle}.zip.sha256" )
          done
          find ./_artifacts -name 'ns-cmsis-nn-*.tar.gz' -exec cp {} ./release-assets/ \;
          find ./_artifacts -name 'ns-cmsis-nn-*.tar.gz.sha256' -exec cp {} ./release-assets/ \;
          ls -lh ./release-assets

      - name: Upload SDK tarballs and staticlib bundles to GitHub Release
        # This job has no checkout step, so `gh` has no git remote to infer
        # the target repository from -- `gh release upload` would otherwise
        # fail with "fatal: not a git repository" (AmbiqAI/ns-cmsis-nn#228).
        # Pass --repo explicitly so this works regardless of checkout state.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" ./release-assets/* --clobber --repo "${{ github.repository }}"

  publish-pack:
    # Build the CMSIS-Pack and publish the Sphinx docs site to Pages. Runs after
    # publish-staticlibs because the pack's Cvariant="Prebuilt" component
    # vendors the per-arch libns-cmsis-nn.a archives — packchk fails if a
    # declared <file> is missing, so we cannot run gen-pack until those
    # artefacts exist. Pages publishing rides along with this job because
    # gen-pack-action's Doxygen step also produces ./Documentation/xml for
    # the Sphinx/Breathe/Exhale API reference.
    #
    # REQUIRED asset. Only downloads gcc staticlib artefacts (see the
    # download-artifact "pattern" below), so it is unaffected by an
    # optional armclang license gap (AmbiqAI/ns-cmsis-nn#228).
    if: ${{ needs.release-please.outputs.assets_enabled == 'true' }}
    needs: [release-please, publish-staticlibs]
    runs-on: ubuntu-24.04
    # Generous job bound only. The precise bound lives on the gen-pack step below,
    # because this job ALSO runs the full Sphinx/Breathe/Exhale docs build, whose
    # healthy duration is 13-15 min and has been observed as high as 30.6 min. A
    # tight job-level bound would kill healthy releases (2 of 60 August doc builds
    # exceeded 20 min) and would fire long AFTER the pack was already uploaded.
    timeout-minutes: 60
    steps:
      # Immutable historical source checkout, pinned to the exact commit
      # release-please resolved the release tag to -- never the ref that
      # triggered this workflow run (AmbiqAI/ns-cmsis-nn#228). This is the
      # ONLY tree gen-pack ever packages: docs, PDSC, and everything
      # gen-pack-action reads below come entirely from here at the job's
      # default working directory.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.commit_sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Wait for release API to be ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -e
          for i in {1..10}; do
            if gh api "repos/${{ github.repository }}/releases/tags/$TAG" >/dev/null 2>&1; then
              echo "Release $TAG is available."
              exit 0
            fi
            echo "Waiting for release $TAG (try $i/10)..."
            sleep 3
          done
          echo "Release $TAG not visible to API yet." >&2
          exit 1

      # Recovery-tooling checkout: fetches the CURRENT, merged
      # scripts/ci/ensure_local_tag_annotation.sh helper into a DEDICATED
      # `_tooling/` subdirectory, unpinned (whatever ref triggered this
      # workflow run). A historical recovery tag (e.g. v7.29.2) predates
      # this helper script entirely, so it cannot be obtained from the
      # pinned historical checkout above -- AmbiqAI/ns-cmsis-nn#228, live
      # recovery run 31335858426, job 93301568122 ("No such file or
      # directory", exit 127). Using a separate `path:` (rather than
      # re-checking out over the main working directory) means this
      # checkout can NEVER contaminate the packaged historical source
      # above: `_tooling/` contributes only the helper script, nothing
      # under `_tooling/` is ever read by gen-pack-action or uploaded as a
      # release asset.
      - name: Checkout current recovery tooling
        uses: actions/checkout@v6
        with:
          path: _tooling

      # gen_pack.sh runs with PACK_CHANGELOG_MODE=tag (see its header
      # comment), which requires the release tag to be an ANNOTATED git tag
      # object with a non-empty message. Release Please creates LIGHTWEIGHT
      # tags, so a from-scratch v7.29.1/v7.29.2 recovery build fails with
      # "Tag has no annotation message." (AmbiqAI/ns-cmsis-nn#228). This
      # step runs the CURRENT helper (from `_tooling/`, see above) against
      # the historical source checkout's working directory/git repo
      # (explicit `${{ github.workspace }}` third argument -- the pinned
      # historical checkout above) as a LOCAL-ONLY compatibility shim: it
      # never runs `git push`, so the remote tag is never touched/moved --
      # see scripts/ci/ensure_local_tag_annotation.sh for the full
      # contract, including the defensive same-commit check and
      # XML-escaping of any sourced GitHub Release body text.
      # Already-annotated tags are left unaltered. Only the historical
      # checkout's local refs are mutated; `_tooling/` itself is never
      # touched and never becomes part of the packaged pack/docs sources.
      - name: Ensure tag has a local annotation for gen-pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          bash _tooling/scripts/ci/ensure_local_tag_annotation.sh \
            "${TAG}" "${{ github.repository }}" "${{ github.workspace }}"

      - name: Clean output dir
        run: rm -f ./output/*.pack

      - name: Download per-arch staticlib artefacts
        uses: actions/download-artifact@v4
        with:
          path: ./_artifacts
          pattern: ns-cmsis-nn-staticlib-gcc-*

      - name: Stage prebuilt archives at lib/<cpu>/libns-cmsis-nn.a
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ./lib
          for cpu in cortex-m0 cortex-m4 cortex-m55; do
            src="./_artifacts/ns-cmsis-nn-staticlib-gcc-${cpu}/libns-cmsis-nn-${cpu}-${VERSION}.a"
            if [[ ! -f "$src" ]]; then
              echo "missing artefact: $src" >&2
              exit 1
            fi
            mkdir -p "./lib/${cpu}"
            cp "$src" "./lib/${cpu}/libns-cmsis-nn.a"
          done
          ls -lR ./lib

      - name: PDSC contract pre-flight
        # Cheap fail-fast: if the manifest's identity/version markers drift,
        # don't bother spending several minutes on Doxygen + gen-pack just to
        # ship a broken pack. See M3 #170.
        run: python3 scripts/check_pdsc.py

      - name: Generate pack and docs
        # Pinned (#405) so an upstream push to gen-pack-action's default
        # branch can no longer change the release path with no change in
        # this repo. This SHA's own action.yml pins no gen-pack library
        # version itself -- it just runs our gen-pack-script (gen_pack.sh),
        # which bootstraps gen-pack library 0.11.3 (REQUIRED_GEN_PACK_LIB,
        # gen_pack.sh:12) via its GEN_PACK_LIB_PATH curl fallback (#404),
        # since neither this workflow nor pack-dryrun.yml sets
        # GEN_PACK_LIB_PATH. Re-verify the bootstrapped version when this
        # pin is next bumped; keep this line identical to pack-dryrun.yml's
        # (guarded on every PR by scripts/check_gen_pack_action_pin.sh, run
        # from release-contract.yml).
        uses: Open-CMSIS-Pack/gen-pack-action@9cab2ab138e909e93a3f051ab9a4675b52843a25  # main @ 2026-07-28T08:33:48Z; bootstraps gen-pack 0.11.3
        # The observed hang (issue #271) is inside this action's own `apt-get
        # update`, which stalls when the runner's package mirrors misbehave.
        # Green gen-pack takes 28-43 s, so 10 minutes is ~14-21x headroom and
        # cannot fire on a viable run -- while still failing fast instead of
        # burning the job's full budget in silence.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signal to gen_pack.sh that lib/<cpu>/libns-cmsis-nn.a is staged
          # so it adds `lib` to PACK_DIRS for the Cvariant="Prebuilt" component.
          NS_CMSIS_NN_PREBUILT_LIBS_STAGED: "1"
        with:
          doxygen-version: 1.9.6
          packchk-version: 1.4.1
          gen-doc-script: ./Documentation/Doxygen/gen_doc.sh
          doc-path: ./Documentation/html
          gen-pack-script: ./gen_pack.sh --no-preprocess
          gen-pack-output: ./output
          gh-pages-branch: ""
          gh-pages-deploy: ""

      - name: Upload pack to GitHub Release
        # Defensive/consistent with the no-checkout job above
        # (AmbiqAI/ns-cmsis-nn#228): this job does have a checkout, but
        # --repo removes the implicit dependency on git remote inference
        # entirely, so this keeps working even if the checkout step is ever
        # reordered or removed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:     ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          gh release upload "$TAG" \
            "./output/Ambiq.NS-CMSIS-NN.${VERSION}.pack" \
            --clobber --repo "${{ github.repository }}"

      - name: Setup Python for docs
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build Sphinx site from generated Doxygen XML
        run: bash scripts/docs/build_sphinx_docs.sh --skip-doxygen

      # Publish docs to GitHub Pages (from ./site).
      #
      # Gated out of existing-tag recovery. These three steps carried no `if:`,
      # so `-f recover_tag=vX.Y.Z` -- which checks out that tag's HISTORICAL
      # commit -- would rebuild that tag's OLD documentation and deploy it over
      # the live site. Recovering v7.28.0 would have silently reverted the
      # published docs by three releases, undoing e.g. the quickstart version
      # pinning from #270. Recovery restores customer RELEASE ASSETS only; the
      # docs site is not one, and the same reasoning already excludes
      # publish-ci-image and both test suites (AmbiqAI/ns-cmsis-nn#228).
      # The pack build above is unaffected: it is still produced and uploaded
      # from the historical tree, which is the whole point of recovery.
      - name: Setup Pages
        if: ${{ needs.release-please.outputs.recovery_mode != 'true' }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ needs.release-please.outputs.recovery_mode != 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        if: ${{ needs.release-please.outputs.recovery_mode != 'true' }}
        id: deploy
        uses: actions/deploy-pages@v5

  publish-ci-image:
    # Historical recovery restores customer release assets only. The CI image
    # is build infrastructure rather than an immutable release asset.
    if: ${{ needs.release-please.outputs.assets_enabled == 'true' && needs.release-please.outputs.recovery_mode != 'true' }}
    needs: release-please
    uses: ./.github/workflows/build_publish_docker.yml
    with:
      image_tag: ${{ needs.release-please.outputs.tag_name }}
      # Only move the :latest alias for a genuine new release. An
      # existing-tag asset recovery run (recovery_mode == 'true') must not
      # be able to move :latest to an older tag (AmbiqAI/ns-cmsis-nn#228).
      publish_latest: ${{ needs.release-please.outputs.recovery_mode != 'true' }}
      # Build the image from the exact commit the release tag resolved to,
      # never the ref that triggered this workflow run.
      source_ref: ${{ needs.release-please.outputs.commit_sha }}
    secrets: inherit

  release-unit-tests:
    if: ${{ needs.release-please.outputs.assets_enabled == 'true' && needs.release-please.outputs.recovery_mode != 'true' }}
    needs:
      - release-please
      - publish-ci-image
    uses: ./.github/workflows/legacy-tester.yml
    with:
      container_image: ghcr.io/ambiqai/ns-cmsis-nn-ci:${{ needs.release-please.outputs.tag_name }}
      source_ref: ${{ needs.release-please.outputs.commit_sha }}
    secrets: inherit

  release-helia-core-tester:
    if: ${{ needs.release-please.outputs.assets_enabled == 'true' && needs.release-please.outputs.recovery_mode != 'true' }}
    needs:
      - release-please
      - publish-ci-image
    uses: ./.github/workflows/helia-core-tester.yml
    with:
      container_image: ghcr.io/ambiqai/ns-cmsis-nn-ci:${{ needs.release-please.outputs.tag_name }}
      source_ref: ${{ needs.release-please.outputs.commit_sha }}
    secrets: inherit

  release-verify:
    # THE release gate (AmbiqAI/ns-cmsis-nn#274, section 2) -- and the one
    # acceptance criterion #228 was closed without.
    #
    # release-please creates the tag AND the non-draft GitHub Release before
    # any asset job runs, so every downstream failure lands *after*
    # publication, and nothing in this repo ever noticed. FIVE releases are
    # public with zero assets right now -- v7.26.0, v7.27.0, v7.28.0, v7.29.0
    # and v7.29.1 -- and 7 of the last 10 release-cutting runs failed, so this
    # is the norm since April rather than a recent regression. v7.29.1's gap
    # went unnoticed for 11 days, until v7.29.2 repeated it.
    #
    # Two DIFFERENT mechanisms produced those five, and this job has to catch
    # both:
    #
    #   1. `needs:` cascade. An asset job fails (unlicensed armclang for
    #      v7.28.0-v7.29.1; failing ATFE legs for v7.26.0), which skips
    #      everything downstream. Caught by `always()` below: the case this
    #      job exists for is exactly the one where an upstream job FAILED or
    #      was SKIPPED, which is when a default `success()` gate would skip
    #      the verifier too and reproduce the original silence.
    #
    #   2. Green-washing by re-run. v7.27.0's run 27986308217 failed on
    #      2026-06-22; someone hit "Re-run all jobs" on 2026-06-30. On that
    #      attempt release-please found nothing left to release, all seven
    #      downstream jobs skipped, and the attempt -- which is what the UI
    #      shows -- concluded SUCCESS. Red became green and the release
    #      stayed empty. `assets_enabled` is false on such a re-run, so
    #      gating this job on it alone would leave the guard blind at the
    #      exact spot history says the damage happened. The head-commit test
    #      below keeps the verifier running: TAG/VERSION come back empty and
    #      the no-tag branch in the script fails the run, so the red
    #      survives. Re-runs replay the original event payload, so
    #      head_commit is populated. `contains` not `startsWith`, for the
    #      merge-commit reason documented on the concurrency block above.
    #
    # As a bonus, that same test turns "release-please itself failed on a
    # release commit" from a silent skip into a red run.
    #
    # It deliberately checks the PUBLISHED RELEASE rather than job results:
    # job success is not evidence that an upload landed, and a
    # `gh release upload --clobber` that deletes an asset and then fails to
    # replace it is green-adjacent but customer-visible.
    if: "${{ always() && (needs.release-please.outputs.assets_enabled == 'true' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore(main): release'))) }}"
    needs:
      - release-please
      - publish-staticlibs
      - publish-staticlibs-armclang
      - publish-staticlib-bundles
      - publish-pack
    # ubuntu-latest, not a pinned image: ubuntu-22.04 starts brownouts on
    # 2026-09-17 (runner-images#14254), so the ubuntu-22.04 pins that used to
    # sit alongside this job moved to ubuntu-24.04
    # (AmbiqAI/ns-cmsis-nn#274, section 6). This job runs only `gh` and bash,
    # so it has no reason to pin at all.
    runs-on: ubuntu-latest
    # Job-level `permissions:` REPLACES the workflow-level set, so both
    # entries are required: contents:read for `gh release view`, issues:write
    # for the notifier below (issues:write is not in the workflow block).
    permissions:
      contents: read
      issues: write
    # Plain `runs-on` job, so a job-level bound is permitted here -- it is NOT
    # permitted on the reusable-workflow callers above (#274, section 5).
    # Two `gh` calls; 10 min is pure hang insurance.
    timeout-minutes: 10
    steps:
      - name: Verify required release assets are published
        # No checkout in this job, so `gh release view` has no git remote to
        # infer the repository from and MUST be given --repo explicitly
        # (AmbiqAI/ns-cmsis-nn#228; enforced by scripts/check_gh_repo_flags.sh).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          # Whether armclang is optional is CONDITIONAL on the licence, not
          # absolute: docs/guides/releases.md marks it optional precisely
          # because it "Requires a commercial Arm Compiler for Embedded
          # license". With that secret configured, armclang assets are
          # expected to ship, and a `continue-on-error` armclang job that
          # failed must NOT be waved through as an expected gap. Comparing
          # the secret to '' yields only a boolean and never exposes its
          # value; this file already reads `secrets` from step `env` blocks
          # elsewhere, so this needs no extra `needs:` edge.
          #
          # Whether armclang's 8 assets are REQUIRED, taking the bar from 17
          # to 25. This is an explicit operator switch, NOT an inference from
          # whether a licence is configured. ARM_UBL_LICENSE_IDENTIFIER has
          # been configured on this repo the whole time armclang was failing
          # to build, so secret-presence would promote assets the pipeline has
          # never once produced -- and a required-but-unproducible asset makes
          # every release unrecoverably red (AmbiqAI/ns-cmsis-nn#279). A
          # variable also gives an operator a kill switch during an Arm
          # licensing outage. Unset, or anything other than "true", keeps the
          # assets optional and the bar at 17.
          ARMCLANG_REQUIRED: ${{ vars.ARMCLANG_REQUIRED == 'true' }}
          # Distinguishes "no licence, so nothing could be built" from
          # "licence present, assets simply not promoted" in the notice below.
          # Read straight from secrets: release-verify has no `needs:` edge to
          # resolve-release-capabilities, so that job's output is out of scope.
          # This explains an absence; it never decides required vs optional.
          ARMCLANG_LICENCE_CONFIGURED: ${{ secrets.ARM_UBL_LICENSE_IDENTIFIER != '' }}
          R_STATICLIBS: ${{ needs.publish-staticlibs.result }}
          # NOT .result: this job is continue-on-error, and GitHub reports
          # such a job as `success` even when it failed, so .result would
          # announce a broken armclang build as a healthy one. The job's
          # `built` output is not laundered that way.
          R_STATICLIBS_ARMCLANG: ${{ needs.publish-staticlibs-armclang.outputs.built || 'failed' }}
          R_BUNDLES: ${{ needs.publish-staticlib-bundles.result }}
          R_PACK: ${{ needs.publish-pack.result }}
        shell: bash
        run: |
          set -euo pipefail

          upstream="publish-staticlibs=${R_STATICLIBS}, publish-staticlibs-armclang=${R_STATICLIBS_ARMCLANG}, publish-staticlib-bundles=${R_BUNDLES}, publish-pack=${R_PACK}"
          echo "Upstream asset jobs: ${upstream}"
          echo "Armclang assets required: ${ARMCLANG_REQUIRED}"

          if [[ -z "${TAG}" || -z "${VERSION}" ]]; then
            echo "::error title=Release verification failed::release-please produced no tag/version for this run, so its assets cannot be verified. If this is a re-run of a failed release, the original failure is NOT resolved -- re-running does not publish assets, it only hides the red (this is what left v7.27.0 empty behind a green run). Upstream asset jobs: ${upstream}." >&2
            exit 1
          fi

          # REQUIRED set, transcribed from the "Required vs optional assets"
          # table in docs/guides/releases.md and cross-checked against the 17
          # assets the #228 recovery actually published for v7.29.2:
          #   1 pack
          # + 12 SDK tarballs      (gcc|atfe x m0|m4|m55, each with a .sha256)
          # + 4  staticlib bundles (gcc|atfe .zip, each with a .sha256)
          # With ARMCLANG_REQUIRED=true armclang's 8 (6 tarballs+sidecars,
          # 1 bundle zip + sidecar) join that list, for 25 required.
          # Names come from scripts/build_sdk_tarball.sh's PKG_NAME
          # ("ns-cmsis-nn-<cpu>-<toolchain>-<version>") and from the bundle
          # name built in publish-staticlib-bundles above. armclang's 8 join
          # either list depending on ARMCLANG_REQUIRED, per the env comment.
          required=( "Ambiq.NS-CMSIS-NN.${VERSION}.pack" )
          optional=()
          for tc in gcc atfe armclang; do
            names=( "ns-cmsis-nn-staticlibs-${tc}-${VERSION}.zip" )
            names+=( "ns-cmsis-nn-staticlibs-${tc}-${VERSION}.zip.sha256" )
            for cpu in cortex-m0 cortex-m4 cortex-m55; do
              names+=( "ns-cmsis-nn-${cpu}-${tc}-${VERSION}.tar.gz" )
              names+=( "ns-cmsis-nn-${cpu}-${tc}-${VERSION}.tar.gz.sha256" )
            done
            if [[ "${tc}" == "armclang" && "${ARMCLANG_REQUIRED}" != "true" ]]; then
              optional+=( "${names[@]}" )
            else
              required+=( "${names[@]}" )
            fi
          done

          # Retried: without this, a single transient 502 from the releases
          # API turns a perfectly good release red, and one false alarm would
          # discredit the only new signal this pipeline has. A release with
          # genuinely zero assets is NOT an error here -- it returns success
          # with empty output and falls straight through to the real check.
          published=""
          for attempt in 1 2 3 4 5; do
            if published="$(gh release view "${TAG}" --repo "${REPO}" --json assets --jq '.assets[].name')"; then
              break
            fi
            if (( attempt == 5 )); then
              echo "::error title=Release verification failed::could not read the asset list for release '${TAG}' after 5 attempts. Upstream asset jobs: ${upstream}." >&2
              exit 1
            fi
            echo "Release asset lookup failed (attempt ${attempt}/5); retrying in $(( attempt * 5 ))s..." >&2
            sleep "$(( attempt * 5 ))"
          done
          echo "Assets currently published on ${TAG}:"
          printf '%s\n' "${published}" | sed 's/^/  /'

          missing=()
          for asset in "${required[@]}"; do
            grep -Fxq -- "${asset}" <<< "${published}" || missing+=( "${asset}" )
          done
          missing_optional=()
          for asset in "${optional[@]:-}"; do
            [[ -n "${asset}" ]] || continue
            grep -Fxq -- "${asset}" <<< "${published}" || missing_optional+=( "${asset}" )
          done

          {
            echo "### Release asset verification -- ${TAG}"
            echo
            echo "armclang assets required: \`${ARMCLANG_REQUIRED}\` (set repository variable ARMCLANG_REQUIRED=true to promote them; armclang assets are $( [[ "${ARMCLANG_REQUIRED}" == "true" ]] && echo REQUIRED || echo optional ))"
            echo
            echo "| class | found | expected |"
            echo "| --- | --- | --- |"
            echo "| required | $(( ${#required[@]} - ${#missing[@]} )) | ${#required[@]} |"
            echo "| optional | $(( ${#optional[@]} - ${#missing_optional[@]} )) | ${#optional[@]} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if (( ${#missing_optional[@]} > 0 )); then
            # Says WHY they are absent rather than asserting a cause, and
            # distinguishes a deliberate skip from a real failure. A build
            # that actually broke is a WARNING, not a notice: it is the one
            # case here that needs a human, and reporting it as routine is
            # how armclang stayed silently broken from v7.24.1 (#275).
            if [[ "${R_STATICLIBS_ARMCLANG}" == "failed" ]]; then
              echo "::warning title=Armclang build FAILED::${#missing_optional[@]} armclang asset(s) are missing from ${TAG} because publish-staticlibs-armclang did not complete -- this is a real failure, not a skip. The release still shipped its ${#required[@]} required assets. Check that job's log before assuming armclang is merely unlicensed."
            elif [[ "${ARMCLANG_LICENCE_CONFIGURED}" != "true" ]]; then
              echo "::notice title=Optional assets absent::${#missing_optional[@]} optional armclang asset(s) are not published for ${TAG}: no ARM_UBL_LICENSE_IDENTIFIER secret is configured, so armclang could not be built. This is not a release failure. See docs/guides/releases.md."
            else
              echo "::notice title=Optional assets absent::${#missing_optional[@]} optional armclang asset(s) are not published for ${TAG}: repository variable ARMCLANG_REQUIRED is not \`true\`, so armclang assets are not promoted to required. This is not a release failure. See docs/guides/releases.md."
            fi
          fi

          if (( ${#missing[@]} > 0 )); then
            {
              echo
              echo "**FAILED -- missing required assets:**"
              # shellcheck disable=SC2016  # backticks are Markdown code spans
              printf -- '- `%s`\n' "${missing[@]}"
            } >> "${GITHUB_STEP_SUMMARY}"
            printf '%s\n' "${missing[@]}" > "${RUNNER_TEMP}/missing-assets.txt"
            # ARMCLANG_REQUIRED promoted armclang's assets, but the licence
            # they need is gone -- e.g. rotated or expired after the switch
            # was flipped on. Recovery re-runs the same jobs against the same
            # absent licence and fails identically, so the operator must be
            # told to turn the switch off. Without this the run only says
            # "missing 8 of 25" and prescribes a recovery that cannot work.
            if [[ "${ARMCLANG_REQUIRED}" == "true" && "${ARMCLANG_LICENCE_CONFIGURED}" != "true" ]]; then
              echo "::error title=ARMCLANG_REQUIRED is set but no Arm licence is configured::armclang assets are required by repository variable ARMCLANG_REQUIRED, but ARM_UBL_LICENSE_IDENTIFIER is not configured, so they can never be produced. Recovery will fail identically until you either restore the licence secret or set ARMCLANG_REQUIRED=false." >&2
            fi
            echo "Missing required assets:" >&2
            printf '  %s\n' "${missing[@]}" >&2
            echo "::error title=Release ${TAG} is missing ${#missing[@]} of ${#required[@]} required assets::MISSING: ${missing[*]} -- the tag and the non-draft GitHub Release are ALREADY PUBLIC, so this release is broken as shipped. Upstream asset jobs: ${upstream}. Re-run asset publication for this tag with 'gh workflow run release.yml --ref main -f recover_tag=${TAG}' (docs/guides/releases.md). Do NOT simply re-run this workflow: a re-run publishes nothing and only turns the run green." >&2
            exit 1
          fi

          echo "OK: all ${#required[@]} required assets are published on ${TAG}."

      - name: Open a tracking issue for the broken release
        # The only alerting this repo has ever had is GitHub's default failure
        # e-mail to the triggering actor, which is how v7.29.1 stayed broken
        # for 11 days (AmbiqAI/ns-cmsis-nn#274, section 2). A failed release
        # is public and customer-visible, so it gets a durable artefact.
        #
        # continue-on-error so this notifier can never mask, or be mistaken
        # for, the real verification failure above -- the job is already red
        # by the time it runs. No --label: `gh issue create` hard-fails on a
        # label that does not exist in the repo, and that must not be the
        # thing that breaks here.
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          title="Release ${TAG:-<no tag resolved>} did not publish its required assets"

          # Dedupe on the exact title so a re-run does not pile up duplicates.
          found=""
          while IFS= read -r existing_title; do
            if [[ "${existing_title}" == "${title}" ]]; then found="yes"; break; fi
          done < <(gh issue list --repo "${REPO}" --state open --limit 100 --json title --jq '.[].title' 2>/dev/null)
          if [[ -n "${found}" ]]; then
            echo "An open issue with this title already exists; not filing another."
            exit 0
          fi

          body="${RUNNER_TEMP}/issue-body.md"
          {
            echo "\`release-verify\` failed for **${TAG:-<no tag resolved>}**. The tag and the"
            echo "non-draft GitHub Release are already public, so this release is broken as"
            echo "shipped."
            echo
            echo "Missing required assets:"
            echo
            if [[ -s "${RUNNER_TEMP}/missing-assets.txt" ]]; then
              # shellcheck disable=SC2016  # backticks are Markdown code spans
              sed 's/^/- `/; s/$/`/' "${RUNNER_TEMP}/missing-assets.txt"
            else
              echo "- (the asset list could not be resolved -- see the run log)"
            fi
            echo
            echo "Failing run: ${RUN_URL}"
            echo
            echo "To repair, re-run asset publication against the existing tag. This never"
            echo "creates or moves a tag:"
            echo
            echo '```bash'
            echo "gh workflow run release.yml --ref main -f recover_tag=${TAG}"
            echo '```'
            echo
            echo "Do **not** simply re-run the failed workflow. On a re-run, release-please"
            echo "finds nothing left to release, every asset job skips, and the attempt"
            echo "concludes green while the release stays empty -- that is what left v7.27.0"
            echo "empty behind a green run (27986308217)."
            echo
            echo "See docs/guides/releases.md for the required-vs-optional asset matrix."
          } > "${body}"

          gh issue create --repo "${REPO}" --title "${title}" --body-file "${body}"
