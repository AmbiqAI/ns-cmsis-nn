# SPDX-License-Identifier: LicenseRef-Ambiq-Apollo-SDK
#
# Supported-toolchain strict link gate.
#
# The README claims three toolchain families. This workflow is what
# makes each claim testable on every pull request, rather than only at
# release time or on a manual dispatch:
#
#   Arm GNU Toolchain (GCC)   13.2.Rel1 / 14.2.Rel1 / 15.3.Rel1
#   LLVM Embedded (ATfE)      pinned by ci/toolchains/atfe.json
#   Arm Compiler 6 (armclang) pinned by ci/toolchains/armclang.json
#
# Why the GCC range (AmbiqAI/ns-cmsis-nn#305):
#
#   The functional PR gate (ci.yml -> helia-core-tester.yml) runs
#   entirely inside the CI container, which pins arm-gnu 14.3.1.
#   Those ranges do not agree about MVE _Generic intrinsic dispatch: an
#   untyped literal argument (e.g. `vaddq(idx, 1U)`) resolves cleanly on
#   14.x/15.x but on 12.x/13.x silently compiles to a call to
#   `__ARM_undef`, which only surfaces as an `undefined reference` at
#   LINK time. Nothing on the PR path linked MVE-float objects with an
#   old-range GCC, so the class reached main.
#
# We support GCC 13 through 15. This workflow builds and STRICT-links
# the archive on one pinned release per major:
#
#   13.2.Rel1  floor of the supported range, for the integer, float32 and
#              float16 kernels alike
#   14.2.Rel1  what release.yml ships, and the first Arm GNU release whose
#              bundled assembler encodes the MVE Q-register form of
#              VCVTB/VCVTT.F16<->F32 correctly (binutils 2.43.1,
#              AmbiqAI/ns-cmsis-nn#427)
#   15.3.Rel1  newest supported
#
# There is one floor, not two. Every cortex-m55 cell builds float16,
# including the floor's: on an assembler that mis-encodes the conversions
# the kernels reach them through the scalar-form helper in
# Include/Internal/arm_nn_vcvt_f16.h, which every gas from 2.39 up encodes
# identically. Which form is used is decided by the configure probe
# measuring the assembler, not by a compiler version, and the
# gcc-f16-probe job asserts the selection rather than assuming it.
#
# 14.3.Rel1 is no longer gated here. The selection rule is one release per
# major and 14.2.Rel1 has to be in the list because it is what release.yml
# ships; the container's own 14.3.1 is exercised by helia-core-tester.yml
# on every pull request anyway.
#
# GCC 12 was evaluated and deliberately dropped as the floor. Its
# arm_mve.h mis-dispatches the FLOAT overloads of polymorphic intrinsic
# names generally -- not just bare untyped literals (the tree contains
# exactly one of those, #305's). arm_softmax_f32 does not include the
# activation header at all and still fails, on its own vpselq / vmaxnmq
# / vsubq / vmulq calls over float32x4_t. Supporting 12 would mean
# giving ~859 polymorphic call sites across the float sources explicit
# _f32/_f16 suffixes: a wide mechanical sweep, and its own effort.
#
# Why ATfE and armclang are here now:
#
#   They were previously deferred to staticlib-dryrun.yml, which is
#   workflow_dispatch-only, so in practice nothing verified them between
#   releases. A toolchain family we advertise but never build on the PR
#   path is a claim, not a guarantee. armclang is the sharper case: until
#   this change its smoke check never invoked a linker at all
#   (AmbiqAI/ns-cmsis-nn#291), so no armclang asset we have ever shipped
#   had its symbols resolved by anything.
#
# Two CPUs per toolchain, chosen for coverage per cell rather than breadth:
#
#   cortex-m55  MVE + DSP + float -- the widest single cell, and the
#               only one where the #305 class can appear at all
#   cortex-m4   the DSP-only/no-MVE path, which compiles different code
#
# cortex-m0 is deliberately omitted: it shares the no-MVE path with m4
# and every leg is already covered by staticlib-dryrun.yml. Adding it
# would be more jobs for a strictly narrower cell.
#
# This is a BUILD-and-LINK gate only. The numerics suite stays on the
# container's single 14.3.1 toolchain and is deliberately NOT multiplied
# across toolchains or GCC versions -- running it once per toolchain
# would cost ~8 min of PR latency per added leg to re-test compilers
# against identical kernel logic. Please do not "helpfully" extend this
# matrix into helia-core-tester.yml.
#
# One narrow execution leg is the exception:
# unity-f16-exec-gcc-floor.yml runs the f16 suites on the oldest gated
# release, because that defect class is introduced by the assembler and
# so cannot be seen without executing on a second compiler
# (AmbiqAI/ns-cmsis-nn#427). It reads the matrix below and fails unless
# its own pin is the oldest release in it, so moving the floor moves the
# leg.
#
# cortex-m0 and the full three-CPU sweep stay in staticlib-dryrun.yml
# (workflow_dispatch), which also packages and uploads SDK tarballs.

name: Toolchain matrix strict link

on:
  workflow_call:
    secrets:
      ARM_UBL_LICENSE_IDENTIFIER:
        # Optional on purpose. Dependabot and fork pull requests cannot
        # supply it; the armclang job warns and skips rather than failing.
        required: false
        description: >-
          Arm User-Based Licensing activation code, used only to activate
          armclang for the strict-link cell.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Not a published artefact; the version string only names the .a.
  VERSION: 0.0.0-prgate
  # Oldest gated release, and the only floor: integer, float32 and float16
  # all build here. It is also the release whose assembler mis-encodes the
  # MVE half<->single conversions, which is what gcc-f16-probe measures.
  # unity-f16-exec-gcc-floor.yml fails unless
  # ci/toolchains/arm-gnu-floor.json names this same release, and unless it
  # is the oldest entry in the matrix below.
  GCC_FLOOR: '13.2.Rel1'

jobs:
  gcc:
    name: gcc ${{ matrix.gcc_release }} / ${{ matrix.target_cpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every cell reports independently: when a version-specific defect
      # appears we want to see its exact range, not just the first failure.
      fail-fast: false
      matrix:
        gcc_release: ['13.2.Rel1', '14.2.Rel1', '15.3.Rel1']
        target_cpu: [cortex-m55, cortex-m4]
    env:
      TARGET_CPU: ${{ matrix.target_cpu }}
      GCC_RELEASE: ${{ matrix.gcc_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install GNU Arm Embedded toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          # One pinned release per supported major. 13.2.Rel1 must stay:
          # it is the floor, so it is the cell where a defect would
          # actually reach a customer on that range, and it is what
          # ci/toolchains/arm-gnu-floor.json pins for the execution leg.
          # 14.2.Rel1 must stay: it is what release.yml ships. Do not raise
          # either without moving release.yml and
          # ci/toolchains/arm-gnu-floor.json in the same change.
          release: ${{ matrix.gcc_release }}

      - name: Report toolchain version
        run: arm-none-eabi-gcc --version

      - name: Build static library
        run: |
          set -euo pipefail
          # F16 only on cortex-m55, matching release.yml and the
          # ARMV8_1_M_MVEF Zephyr Kconfig restriction. Every gated release
          # builds it: where the assembler mis-encodes the vector
          # half<->single conversions the configure probe selects the
          # scalar-form ones instead, which every assembler encodes
          # identically (AmbiqAI/ns-cmsis-nn#427).
          f16_flag=()
          if [[ "$TARGET_CPU" == "cortex-m55" ]]; then
            f16_flag=(--enable-f16)
          fi
          echo "gcc ${GCC_RELEASE} / ${TARGET_CPU}: f16 ${f16_flag[*]:-off}"
          bash scripts/build_staticlib.sh \
            --target-cpu "$TARGET_CPU" \
            --version    "$VERSION" \
            --toolchain  gcc \
            --outdir     "./output/gcc/$TARGET_CPU" \
            --enable-f32 \
            "${f16_flag[@]}"

      - name: Strict smoke link
        # smoke_staticlib.sh is strict by default: no --gc-sections and
        # no --unresolved-symbols=ignore-all, so every object in the
        # archive must resolve. Archiving alone (`ar`) can never catch
        # this class -- it does not resolve symbols.
        run: |
          bash scripts/smoke/smoke_staticlib.sh \
            --target-cpu "$TARGET_CPU" \
            --toolchain  gcc \
            --library    "./output/gcc/${TARGET_CPU}/libns-cmsis-nn-${TARGET_CPU}-${VERSION}.a" \
            --outdir     "./output/gcc/${TARGET_CPU}/smoke"

  gcc-f16-probe:
    # On the floor's assembler the float16 build only works because the
    # configure probe measures that assembler and switches the kernels to the
    # scalar-form conversions. Without this cell, a regression that turned the
    # probe back into a no-op would show up as a green matrix and a static
    # library full of UNDEFINED instruction words (AmbiqAI/ns-cmsis-nn#427).
    #
    # Four combinations, because what is being asserted is that the ASSEMBLER
    # decides and the compiler version does not: the floor driver with its own
    # assembler, the floor driver with a borrowed 2.43 one, a 2.43 driver with
    # the floor's assembler, and a witness that will not assemble at all.
    name: gcc floor / the assembler decides the conversion form
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_CPU: cortex-m55
      # CMake hard-wraps the diagnostic, so the greps below key on tokens it
      # cannot split rather than on a sentence.
      SELECTION_MARKER: ARM_NN_GAS_VCVT_F16_BROKEN=1
      SHIFT_MARKER: ARM_NN_GAS_VQSHRN_BROKEN=1
      VERIFIED_MARKER: ARM_NN_GAS_F16_VERIFIED=1
      ISSUE_MARKER: AmbiqAI/ns-cmsis-nn#427
      # Borrowed for its assembler and its objdump, never shipped and only
      # once the driver. Pinned by url and sha256 like every other toolchain
      # this repository downloads.
      FIXED_GAS_MANIFEST: ci/toolchains/arm-gnu-fixed-gas.json
      MATRIX: .github/workflows/toolchain-matrix-strict-link.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install GNU Arm Embedded toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: ${{ env.GCC_FLOOR }}

      - name: Assert the floor is the oldest gated release
        # This cell only proves anything on the oldest release in the matrix:
        # that is the one whose assembler is old enough to get the encodings
        # wrong, and the one ci/toolchains/arm-gnu-floor.json pins for the
        # execution leg. Parsed as YAML rather than matched as text, so a
        # reflow of the matrix cannot quietly defeat it.
        run: |
          set -euo pipefail
          arm-none-eabi-gcc --version | head -1
          python3 -m venv "${RUNNER_TEMP}/yaml-venv"
          "${RUNNER_TEMP}/yaml-venv/bin/pip" install -q --disable-pip-version-check pyyaml==6.0.3
          "${RUNNER_TEMP}/yaml-venv/bin/python3" - "${MATRIX}" "${GCC_FLOOR}" <<'PY'
          import re
          import sys

          import yaml

          path, declared = sys.argv[1], sys.argv[2]
          matrix = yaml.safe_load(open(path, encoding="utf-8"))
          releases = matrix["jobs"]["gcc"]["strategy"]["matrix"]["gcc_release"]
          oldest = min(releases, key=lambda r: [int(n) for n in re.findall(r"\d+", r)])
          if declared != oldest:
              sys.exit(
                  f"env.GCC_FLOOR is {declared}, but the oldest gated release is "
                  f"{oldest} (matrix: {releases}). This cell would be measuring an "
                  "assembler that is not the floor."
              )
          print(f"floor {declared} is the oldest of {releases}")
          PY

      - name: Configure with float16 on, and require the scalar form to be selected
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/select.log"
          if ! cmake -S . -B "${RUNNER_TEMP}/build-select" \
              -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/arm-none-eabi-gcc.cmake \
              -DNS_CMSIS_NN_TARGET_CPU="${TARGET_CPU}" \
              -DARM_NN_ENABLE_F16=ON > "${log}" 2>&1; then
            cat "${log}"
            echo "::error title=f16 configure failed::${GCC_FLOOR} should configure with float16 on, selecting the scalar-form conversions. See ${ISSUE_MARKER}." >&2
            exit 1
          fi
          cat "${log}"
          # Both mis-encoded families, because the probe measures both in one
          # assemble and losing either would be a silent narrowing of it.
          for marker in "${SELECTION_MARKER}" "${SHIFT_MARKER}"; do
            if ! grep -qF -- "${marker}" "${log}"; then
              echo "::error title=Probe did not report ${marker}::The configure succeeded but never reported ${marker}, so this assembler is not being measured for that instruction family. See ${ISSUE_MARKER}." >&2
              exit 1
            fi
            # The message is only a message. What decides the build is the
            # compile definition on the target, so read it off the generated
            # command line rather than trusting the log.
            if ! grep -rqF -- "-D${marker}" \
                   "${RUNNER_TEMP}/build-select"/CMakeFiles/*/flags.make; then
              echo "::error title=Verdict did not reach the compile line::${marker} was reported but is not in the target's flags.make, so the kernels compile without it. See ${ISSUE_MARKER}." >&2
              exit 1
            fi
          done
          if grep -qF -- "${VERIFIED_MARKER}" "${log}"; then
            echo "::error title=Floor assembler reported as correct::The probe stamped ${VERIFIED_MARKER} on an assembler known to mis-encode the conversions. See ${ISSUE_MARKER}." >&2
            exit 1
          fi
          echo "configure selects the scalar-form conversions"

      - name: Build float16 on the floor
        run: |
          set -euo pipefail
          bash scripts/build_staticlib.sh \
            --target-cpu "${TARGET_CPU}" \
            --version    "${VERSION}" \
            --toolchain  gcc \
            --outdir     "./output/floor" \
            --enable-f32 --enable-f16

      - name: Fetch the toolchain whose assembler encodes these correctly
        id: fetch_fixed
        # Deliberately not put on PATH. Only its `as' and its objdump are
        # borrowed; the driver stays the floor one except in the step that
        # says otherwise.
        run: |
          bash scripts/fetch_toolchain.sh \
            --manifest "${FIXED_GAS_MANIFEST}" \
            --platform linux-x86_64 \
            --outdir "${RUNNER_TEMP}/toolchains"

      - name: Require the floor's float16 objects to carry no vector conversion
        # Only an objdump from 2.43 or newer renders these words as they were
        # encoded; the matching-era one mis-renders them the same way its
        # assembler mis-encoded them, so a stale objdump would show a clean
        # archive either way.
        env:
          FIXED_ROOT: ${{ steps.fetch_fixed.outputs.toolchain_root }}
        run: |
          set -euo pipefail
          bash scripts/ci/scan_f16_conversion_objects.sh \
            --root "${FIXED_ROOT}" \
            --archive "./output/floor/libns-cmsis-nn-${TARGET_CPU}-${VERSION}.a" \
            --workdir "${RUNNER_TEMP}/floor-objs" \
            --expect-qform none

      - name: Build float16 with the floor driver and a 2.43 assembler
        # docs/guides/toolchains.md tells a project pinned to a GCC 13.x
        # compiler to keep the driver and point -B at a binutils 2.43
        # assembler. A recipe that is documented and never executed rots, and
        # this one is the only path to the vector conversions on that driver,
        # so build it here rather than asserting it in prose.
        env:
          FIXED_ROOT: ${{ steps.fetch_fixed.outputs.toolchain_root }}
        run: |
          set -euo pipefail
          # The directory holding the UNPREFIXED `as', which is what -B looks
          # for. In an Arm GNU install that is <root>/arm-none-eabi/bin/, with
          # the trailing slash; the guide quotes the same form.
          as_dir="${FIXED_ROOT}/arm-none-eabi/bin/"
          if [[ ! -x "${as_dir}as" ]]; then
            echo "::error title=No unprefixed assembler::Expected ${as_dir}as in the borrowed tarball; the layout the -B recipe documents has moved. See ${ISSUE_MARKER}." >&2
            exit 1
          fi
          echo "driver:      $(arm-none-eabi-gcc --version | head -1)"
          echo "borrowed as: $("${as_dir}as" --version | head -1)"
          log="${RUNNER_TEMP}/brecipe.log"
          # CFLAGS on a fresh build directory, exactly as the guide says: a
          # bare -DCMAKE_C_FLAGS would replace what the toolchain file sets.
          CFLAGS="-B${as_dir}" bash scripts/build_staticlib.sh \
            --target-cpu "${TARGET_CPU}" \
            --version    "${VERSION}" \
            --toolchain  gcc \
            --outdir     "./output/brecipe" \
            --enable-f32 --enable-f16 2>&1 | tee "${log}"
          if ! grep -qF 'MVE half<->single conversions encode correctly' "${log}"; then
            echo "::error title=Borrowed assembler was not accepted::The -B recipe configured without the probe reporting a correct encoding, so this cell no longer proves the documented escape route works. See ${ISSUE_MARKER}." >&2
            exit 1
          fi
          bash scripts/ci/scan_f16_conversion_objects.sh \
            --root "${FIXED_ROOT}" \
            --archive "./output/brecipe/libns-cmsis-nn-${TARGET_CPU}-${VERSION}.a" \
            --workdir "${RUNNER_TEMP}/brecipe-objs" \
            --expect-qform present

      - name: Build float16 with a 2.43 driver and the floor's assembler
        # The case a compiler-version guard gets wrong. Nothing about the
        # driver here is old, so a check on __GNUC__ would take the vector
        # form and mis-encode it; the probe has to reach the same verdict as
        # the first configure above.
        env:
          FIXED_ROOT: ${{ steps.fetch_fixed.outputs.toolchain_root }}
        run: |
          set -euo pipefail
          floor_as="$(arm-none-eabi-gcc -print-prog-name=as)"
          if [[ "${floor_as}" != /* || ! -x "${floor_as}" ]]; then
            echo "::error title=Cannot locate the floor assembler::arm-none-eabi-gcc -print-prog-name=as gave '${floor_as}'. See ${ISSUE_MARKER}." >&2
            exit 1
          fi
          as_dir="$(dirname "${floor_as}")/"
          echo "driver:      $("${FIXED_ROOT}/bin/arm-none-eabi-gcc" --version | head -1)"
          echo "borrowed as: $("${as_dir}as" --version | head -1)"
          log="${RUNNER_TEMP}/olds.log"
          PATH="${FIXED_ROOT}/bin:${PATH}" CFLAGS="-B${as_dir}" \
            bash scripts/build_staticlib.sh \
              --target-cpu "${TARGET_CPU}" \
              --version    "${VERSION}" \
              --toolchain  gcc \
              --outdir     "./output/olds" \
              --enable-f32 --enable-f16 2>&1 | tee "${log}"
          if ! grep -qF -- "${SELECTION_MARKER}" "${log}"; then
            echo "::error title=New driver over an old assembler was not caught::The probe did not report ${SELECTION_MARKER} for a 2.43-era driver paired with the floor's assembler, which is the case a compiler-version guard gets wrong. See ${ISSUE_MARKER}." >&2
            exit 1
          fi
          bash scripts/ci/scan_f16_conversion_objects.sh \
            --root "${FIXED_ROOT}" \
            --archive "./output/olds/libns-cmsis-nn-${TARGET_CPU}-${VERSION}.a" \
            --workdir "${RUNNER_TEMP}/olds-objs" \
            --expect-qform none

      - name: Require an unassemblable witness to stop the build, and the skip to be a warning
        # ARM_NN_SKIP_GAS_F16_PROBE is the documented way out when the probe
        # cannot assemble its witness with a project's flags. It is only worth
        # documenting if the default really is a refusal and the option really
        # does downgrade it, so exercise both. -Wa,-march=armv7-m is a flag the
        # driver and the C compiler accept and the assembler then uses to
        # reject every MVE mnemonic, which is the shape of the problem without
        # needing a broken toolchain to reproduce it.
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/unassemblable.log"
          if CFLAGS="-Wa,-march=armv7-m" cmake -S . -B "${RUNNER_TEMP}/build-noas" \
              -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/arm-none-eabi-gcc.cmake \
              -DNS_CMSIS_NN_TARGET_CPU="${TARGET_CPU}" \
              -DARM_NN_ENABLE_F16=ON > "${log}" 2>&1; then
            cat "${log}"
            echo "::error title=Unassemblable witness did not fail the configure::The probe could not have assembled its witness here, and configured anyway, so an unmeasured assembler now passes silently. See ${ISSUE_MARKER}." >&2
            exit 1
          fi
          grep -F 'could not assemble its witness' "${log}" >/dev/null || {
            cat "${log}"
            echo "::error title=Configure failed for the wrong reason::The configure failed but not on the probe's witness, so this step is asserting something else. See ${ISSUE_MARKER}." >&2
            exit 1
          }
          log="${RUNNER_TEMP}/skipped.log"
          CFLAGS="-Wa,-march=armv7-m" cmake -S . -B "${RUNNER_TEMP}/build-skip" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/arm-none-eabi-gcc.cmake \
            -DNS_CMSIS_NN_TARGET_CPU="${TARGET_CPU}" \
            -DARM_NN_ENABLE_F16=ON \
            -DARM_NN_SKIP_GAS_F16_PROBE=ON > "${log}" 2>&1
          cat "${log}"
          grep -F 'CMake Warning' "${log}" >/dev/null || {
            echo "::error title=Skip was silent::ARM_NN_SKIP_GAS_F16_PROBE=ON configured without a warning, so an unmeasured assembler leaves no trace in the log. See ${ISSUE_MARKER}." >&2
            exit 1
          }
          for marker in "${SELECTION_MARKER}" "${SHIFT_MARKER}" "${VERIFIED_MARKER}"; do
            if grep -rqF -- "-D${marker}" \
                 "${RUNNER_TEMP}/build-skip"/CMakeFiles/*/flags.make; then
              echo "::error title=Skipped probe still stamped a verdict::${marker} reached the compile line from a configure that never measured the assembler. See ${ISSUE_MARKER}." >&2
              exit 1
            fi
          done
          echo "the skip leaves the assembler unmeasured and says so"

  atfe:
    # The `env` context is not available in a job-level `name`, so the
    # version is reported by the assert step rather than the job title.
    name: atfe / ${{ matrix.target_cpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target_cpu: [cortex-m55, cortex-m4]
    env:
      TARGET_CPU: ${{ matrix.target_cpu }}
      # Declared here so a manifest bump shows up as a diff in this file
      # too, the same way the GCC releases above are visible. The assert
      # step below fails if the two ever disagree.
      ATFE_VERSION: '19.1.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch ATfE toolchain
        id: fetch_toolchain
        run: |
          bash scripts/fetch_toolchain.sh \
            --manifest "ci/toolchains/atfe.json" \
            --platform linux-x86_64 \
            --outdir "${RUNNER_TEMP}/toolchains"

      - name: Assert pinned ATfE version
        env:
          GOT: ${{ steps.fetch_toolchain.outputs.toolchain_version }}
        run: |
          set -euo pipefail
          if [[ "$GOT" != "$ATFE_VERSION" ]]; then
            echo "::error title=ATfE pin drift::ci/toolchains/atfe.json is $GOT but this workflow pins $ATFE_VERSION. Update both together." >&2
            exit 1
          fi
          echo "ATfE $GOT (pinned)"

      - name: Build static library
        env:
          TOOLCHAIN_ROOT: ${{ steps.fetch_toolchain.outputs.toolchain_root }}
        run: |
          f16_flag=()
          if [[ "$TARGET_CPU" == "cortex-m55" ]]; then
            f16_flag=(--enable-f16)
          fi
          bash scripts/build_staticlib.sh \
            --target-cpu "$TARGET_CPU" \
            --version    "$VERSION" \
            --toolchain  atfe \
            --toolchain-root "$TOOLCHAIN_ROOT" \
            --outdir     "./output/atfe/$TARGET_CPU" \
            --enable-f32 \
            "${f16_flag[@]}"

      - name: Strict smoke link
        env:
          TOOLCHAIN_ROOT: ${{ steps.fetch_toolchain.outputs.toolchain_root }}
        run: |
          bash scripts/smoke/smoke_staticlib.sh \
            --target-cpu "$TARGET_CPU" \
            --toolchain  atfe \
            --toolchain-root "$TOOLCHAIN_ROOT" \
            --library    "./output/atfe/${TARGET_CPU}/libns-cmsis-nn-atfe-${TARGET_CPU}-${VERSION}.a" \
            --outdir     "./output/atfe/${TARGET_CPU}/smoke"

  armclang:
    name: armclang / cortex-m55 + cortex-m4
    runs-on: ubuntu-latest
    # One job looping over the CPUs rather than a matrix, so Arm's
    # User-Based Licensing is activated EXACTLY ONCE per run and the
    # ~1 GB Arm Compiler archive is fetched exactly once
    # (AmbiqAI/ns-cmsis-nn#275). A matrix would multiply both by the
    # number of CPUs for no added coverage. Activation state stays inside
    # this job: nothing licence-derived is cached, uploaded, or written
    # to a step output.
    #
    # Runs in the CI container specifically so `armlm` executes as root.
    # The Arm User-Based Licensing entitlement is bound to CI user "root";
    # activating as the default hosted-runner user ("runner") is refused with
    # "The activation code has already been used by another user". The image
    # has no USER directive, so it runs as root.
    # Digest-pinned for the same reason as release.yml's armclang job: this
    # job handles the Arm licensing secret, so the image it runs must be one
    # that was actually reviewed, not whatever `:latest` points at today.
    container:
      image: ghcr.io/ambiqai/ns-cmsis-nn-ci@sha256:0d18641d43015eba02d8e05821b59c95ddfcdf0d9ff7a070edd532bad3e09eeb
    defaults:
      run:
        # Inside a container GitHub defaults to `sh -e`, which lacks
        # `set -o pipefail` and `[[ ]]`. Every run: block in this job is
        # bash, so pin it rather than degrade the scripts to POSIX sh.
        shell: bash
    timeout-minutes: 30
    env:
      # See ATFE_VERSION above for why this is duplicated from the manifest.
      ARMCLANG_VERSION: '6.23.32'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # MUST stay the first substantive step, and every step below is gated
      # on its output.
      #
      # This repository is PUBLIC. A `pull_request` raised by Dependabot is
      # handed only the Dependabot secret store, and a fork PR is handed no
      # repository secrets at all -- in both cases
      # ARM_UBL_LICENSE_IDENTIFIER arrives empty however ci.yml passes it.
      # Failing here would turn every dependency bump and every outside
      # contribution red for a reason the author cannot act on and did not
      # cause. So: warn, skip, and let the job pass, exactly as
      # release.yml's resolve-release-capabilities does for the optional
      # armclang release assets.
      #
      # Same-repo pull requests DO receive the secret, so the cell still
      # runs -- with full coverage -- on the PRs that change this library.
      # Gating first also avoids the ~1 GB toolchain fetch and the apt
      # install on runs that could never use them.
      #
      # Presence only. The identifier's value is never echoed, written to a
      # step output, or interpolated into an annotation.
      - name: Check armclang license availability
        id: license
        env:
          ARM_UBL_LICENSE_IDENTIFIER: ${{ secrets.ARM_UBL_LICENSE_IDENTIFIER }}
        run: |
          set -euo pipefail
          if [[ -n "${ARM_UBL_LICENSE_IDENTIFIER:-}" ]]; then
            echo "armclang_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "armclang_available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=armclang cell skipped::ARM_UBL_LICENSE_IDENTIFIER is not available on this trigger (Dependabot and fork pull requests do not receive repository secrets), so the armclang strict-link cell was skipped. The gcc and atfe cells are unaffected and still gate this PR. armclang coverage runs on same-repo pull requests and in staticlib-dryrun.yml / release.yml."
          fi

      - name: Confirm the runtime user is root
        # The Arm UBL entitlement is bound to CI user "root". If this prints
        # anything else, activation will be refused -- fail here with a clear
        # message rather than at `armlm activate` with a misleading one.
        if: ${{ steps.license.outputs.armclang_available == 'true' }}
        run: |
          set -euo pipefail
          echo "whoami: $(whoami)  (uid=$(id -u))"
          if [[ "$(id -u)" -ne 0 ]]; then
            echo "::error title=Not running as root::armlm must run as root for this entitlement; got $(whoami)." >&2
            exit 1
          fi

      - name: Install LLVM archive tools
        # llvm-nm / llvm-size / llvm-ar. Arm Compiler ships armar, which
        # cannot extract to a chosen directory, so the smoke script's
        # whole-archive emulation uses llvm-ar instead.
        if: ${{ steps.license.outputs.armclang_available == 'true' }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends llvm

      - name: Fetch armclang toolchain
        id: fetch_toolchain
        if: ${{ steps.license.outputs.armclang_available == 'true' }}
        run: |
          bash scripts/fetch_toolchain.sh \
            --manifest "ci/toolchains/armclang.json" \
            --platform linux-x86_64 \
            --outdir "${RUNNER_TEMP}/toolchains"

      - name: Assert pinned armclang version
        if: ${{ steps.license.outputs.armclang_available == 'true' }}
        env:
          GOT: ${{ steps.fetch_toolchain.outputs.toolchain_version }}
        run: |
          set -euo pipefail
          if [[ "$GOT" != "$ARMCLANG_VERSION" ]]; then
            echo "::error title=armclang pin drift::ci/toolchains/armclang.json is $GOT but this workflow pins $ARMCLANG_VERSION. Update both together." >&2
            exit 1
          fi
          echo "armclang $GOT (pinned)"

      - name: Locate the Arm license manager
        # Licence PRESENCE was settled in the gating step above; this only
        # checks the toolchain actually shipped an armlm to activate with.
        if: ${{ steps.license.outputs.armclang_available == 'true' }}
        env:
          TOOLCHAIN_ROOT: ${{ steps.fetch_toolchain.outputs.toolchain_root }}
        run: |
          set -euo pipefail
          if [[ ! -x "${TOOLCHAIN_ROOT}/bin/armlm" ]]; then
            echo "::error title=Arm license manager missing::No executable armlm under ${TOOLCHAIN_ROOT}/bin." >&2
            exit 1
          fi
          echo "${TOOLCHAIN_ROOT}/bin" >> "$GITHUB_PATH"

      - name: Activate Arm tool license
        # SHA-pinned, unlike every other action in this repo, because this is
        # the only third-party action that receives a repository secret other
        # than GITHUB_TOKEN -- it interpolates the activation code into a
        # generated shell command. `v1` is a moving alias (it has tracked
        # v1.0 -> v1.3), so a retag would silently replace the code handling
        # that secret. Same reasoning as the sha256 pin on the Arm Compiler
        # download in ci/toolchains/armclang.json.
        if: ${{ steps.license.outputs.armclang_available == 'true' }}
        uses: ARM-software/cmsis-actions/armlm@8a50b77681a484568e08f31fb7c2285c4735f682  # v1.3
        with:
          code: ${{ secrets.ARM_UBL_LICENSE_IDENTIFIER }}

      - name: Build and strict smoke link
        if: ${{ steps.license.outputs.armclang_available == 'true' }}
        env:
          TOOLCHAIN_ROOT: ${{ steps.fetch_toolchain.outputs.toolchain_root }}
        run: |
          set -euo pipefail
          rc=0
          for TARGET_CPU in cortex-m55 cortex-m4; do
            echo "::group::armclang / ${TARGET_CPU}"
            outdir="./output/armclang/${TARGET_CPU}"
            f16_flag=()
            if [[ "${TARGET_CPU}" == "cortex-m55" ]]; then
              f16_flag=(--enable-f16)
            fi
            # Each CPU reports independently, matching the fail-fast:false
            # behaviour of the gcc and atfe matrices above: a cortex-m55
            # failure must not hide the state of cortex-m4.
            # `set -e` is explicitly re-enabled inside the subshell: bash
            # suppresses errexit for the whole command that forms an `if`
            # condition, so without it a failed build would fall through
            # to the smoke step and be reported as a confusing missing
            # archive rather than as the build failure it is.
            if ! (
              set -e
              bash scripts/build_staticlib.sh \
                --target-cpu "$TARGET_CPU" \
                --version    "$VERSION" \
                --toolchain  armclang \
                --toolchain-root "$TOOLCHAIN_ROOT" \
                --outdir     "$outdir" \
                --enable-f32 \
                "${f16_flag[@]}"

              # A real bare-metal armlink link, not the archive-symbol
              # check this used to do (AmbiqAI/ns-cmsis-nn#291).
              bash scripts/smoke/smoke_staticlib.sh \
                --target-cpu "$TARGET_CPU" \
                --toolchain  armclang \
                --toolchain-root "$TOOLCHAIN_ROOT" \
                --library    "${outdir}/libns-cmsis-nn-armclang-${TARGET_CPU}-${VERSION}.a" \
                --outdir     "${outdir}/smoke"
            ); then
              echo "::error title=armclang strict link failed::${TARGET_CPU}" >&2
              rc=1
            fi
            echo "::endgroup::"
          done
          exit "$rc"

      - name: Deactivate Arm tool license
        # Always -- so a failed link does not leave the activation dangling
        # -- but only if we actually activated one.
        if: ${{ always() && steps.license.outputs.armclang_available == 'true' }}
        run: armlm deactivate || true
