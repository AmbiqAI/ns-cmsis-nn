name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  helia-core-tester:
    uses: ./.github/workflows/helia-core-tester.yml

  # helia-core-tester runs the functional suite on the container's single
  # arm-gnu 14.3.1 and stays that way -- do not multiply it across GCC
  # versions or toolchains. This leg instead builds and strict-links the
  # archive across every toolchain family the README claims: the whole
  # supported GCC range (13-15), ATfE, and armclang. Link-time _Generic
  # dispatch failures cannot reach a release (AmbiqAI/ns-cmsis-nn#305),
  # and armclang assets are linked for real rather than only archived
  # (AmbiqAI/ns-cmsis-nn#291).
  toolchain-strict-link:
    uses: ./.github/workflows/toolchain-matrix-strict-link.yml
    secrets: inherit
