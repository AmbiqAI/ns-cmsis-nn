#
# Release automation contract checks (AmbiqAI/ns-cmsis-nn#228). Pure bash,
# no network access, no Apollo toolchain / NSX board -- these validate the
# extracted release-pipeline scripts (scripts/ci/resolve_image_tags.sh and
# scripts/ci/resolve_release_commit.sh) directly, so pipeline precedence /
# checkout-pinning regressions are caught on every PR instead of only being
# discoverable during a live release or recovery run.

name: Release Pipeline Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ci/**'
      - 'scripts/check_release_image_tags.sh'
      - 'scripts/check_release_commit_resolution.sh'
      - 'scripts/check_ensure_local_tag_annotation.sh'
      - 'scripts/check_docker_checkout_order.sh'
      - 'scripts/check_publish_pack_tooling_checkout.sh'
      - 'scripts/check_gh_repo_flags.sh'
      - 'scripts/check_vcpkg_bundle_companion_files.sh'
      - '.devcontainer/Dockerfile'
      - '.github/workflows/release.yml'
      - '.github/workflows/build_publish_docker.yml'
      - '.github/workflows/legacy-tester.yml'
      - '.github/workflows/helia-core-tester.yml'
      - '.github/workflows/release-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/**'
      - 'scripts/check_release_image_tags.sh'
      - 'scripts/check_release_commit_resolution.sh'
      - 'scripts/check_ensure_local_tag_annotation.sh'
      - 'scripts/check_docker_checkout_order.sh'
      - 'scripts/check_publish_pack_tooling_checkout.sh'
      - 'scripts/check_gh_repo_flags.sh'
      - 'scripts/check_vcpkg_bundle_companion_files.sh'
      - '.devcontainer/Dockerfile'
      - '.github/workflows/release.yml'
      - '.github/workflows/build_publish_docker.yml'
      - '.github/workflows/legacy-tester.yml'
      - '.github/workflows/helia-core-tester.yml'
      - '.github/workflows/release-contract.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-tag-precedence:
    name: Docker image-tag/workflow_call precedence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run image-tag resolution contract
        run: scripts/check_release_image_tags.sh

  release-commit-resolution:
    name: Release tag -> commit resolution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run commit-resolution contract
        run: scripts/check_release_commit_resolution.sh

  tag-annotation-compat:
    name: Lightweight-tag gen-pack annotation compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run local tag-annotation compatibility contract
        run: scripts/check_ensure_local_tag_annotation.sh

  docker-checkout-order:
    name: Docker build tooling/source-ref checkout ordering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run checkout-order contract
        run: scripts/check_docker_checkout_order.sh

  publish-pack-tooling-checkout:
    name: publish-pack tooling/historical checkout separation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run publish-pack tooling-checkout contract
        run: scripts/check_publish_pack_tooling_checkout.sh

  gh-repo-flags:
    name: gh release calls target --repo explicitly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run gh --repo flag contract
        run: scripts/check_gh_repo_flags.sh

  vcpkg-bundle-companion-files:
    name: vcpkg-artifacts standalone-bundle companion files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run vcpkg standalone-bundle companion-files contract
        run: scripts/check_vcpkg_bundle_companion_files.sh
