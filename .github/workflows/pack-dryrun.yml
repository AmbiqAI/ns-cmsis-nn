#
# Pack dry-run.
#
# Mirrors the pack-generation half of release.yml WITHOUT requiring an
# actual release-please tag. Lets us exercise gen_pack.sh + Doxygen +
# packchk end-to-end on demand and verify:
#
#   - PDSC contract still holds (scripts/check_pdsc.py).
#   - gen_pack.sh produces exactly one Ambiq.NS-CMSIS-NN.<version>.pack
#     in ./output.
#   - The resulting .pack passes packchk (the gen-pack-action does this
#     internally; we additionally assert the artefact name).
#   - The Cvariant="Prebuilt" component's per-arch libns-cmsis-nn.a
#     files exist (#181) — they're staged from the build-staticlibs job.
#
# Changelog mode mirrors release.yml (#395). release.yml sets no
# PACK_CHANGELOG_MODE at all, which is load-bearing: gen_pack.sh defaults
# itself to 'tag' (schema-safe pdsc <release> bodies) while
# Documentation/Doxygen/gen_doc.sh defaults itself to 'full' (the Doxygen
# history page, which is HTML and is never schema-checked). So this
# workflow must not set the variable either. It runs
# gen-pack against a LOCAL-ONLY annotated tag created by
# scripts/ci/ensure_local_tag_annotation.sh, the same helper release.yml
# uses; that tag is never pushed. Before #395 this workflow forced
# PACK_CHANGELOG_MODE=full on both scripts, a combination the release path
# never uses: full mode embeds raw commit messages in the pdsc <release>
# body, so since dd58c8b8 (a squash whose body carries a
# "Co-authored-by: ... <...>" trailer) every dry-run died in the pdsc
# schema check on the unescaped '<', while the release path stayed green.
# A dry-run that fails where the release cannot is not a rehearsal.
#
# Honest bound on the rehearsal: the synthetic tag has no GitHub Release,
# so ensure_local_tag_annotation.sh always takes its FALLBACK branch and
# writes the one-line 'Release <tag>' annotation. The other branch -- an
# XML-escaped real Release body -- is unit-covered by
# scripts/check_ensure_local_tag_annotation.sh, but its composition with
# gen-pack's own re-interpretation of the annotation text (`echo -e` in
# git_changelog_pdsc) is NOT exercised end to end here. Seeding the
# synthetic annotation from a real Release body would require changing the
# helper's tag-to-release lookup, so it is a stated follow-up, not part of
# this path.
#
# Outputs are uploaded as workflow artefacts (NOT to a GitHub Release).
# This is a verification path, not a publish path.
#
# It used to be workflow_dispatch-only, so it ran when somebody remembered:
# four times ever, across four releases, two of which shipped broken with no
# dry run (AmbiqAI/ns-cmsis-nn#274, section 4). The first time it did run it
# immediately caught a live hazard (#271). Three triggers now cover the three
# ways this path breaks:
#
#   - workflow_call, from ci.yml, so every pull request and every push to
#     main rehearses pack generation before a release depends on it. It is
#     folded into ci.yml rather than given its own pull_request+paths trigger
#     because the required context is `CI Passed`, and a required check that
#     never reports leaves a PR unmergeable -- so this reports on every PR
#     whatever it touched, as the rest of ci.yml does.
#   - schedule, because most of what breaks here comes from outside the
#     repository and no code change announces it: gen-pack-action's
#     bootstrapped gen-pack library, the Doxygen and packchk downloads, and
#     the runner image. A PR gate cannot see any of those move.
#   - workflow_dispatch, for rehearsing a specific ref by hand.
#
# `version` only stamps the staticlib artifact names; the .pack version comes
# from the synthetic local tag created in build-pack. Under schedule there is
# no `inputs` object at all, so every use falls back to the same default the
# other two triggers declare -- without that, staging fails on
# `libns-cmsis-nn-cortex-m0-.a`.

name: Pack dry-run

on:
  workflow_call:
    inputs:
      version:
        description: "Synthetic version stamp used when naming the staticlib artifacts."
        required: false
        type: string
        default: "0.0.0-dryrun"
  workflow_dispatch:
    inputs:
      version:
        description: "Synthetic version stamp used when naming the staticlib artefacts (the .pack version comes from the synthetic local tag created in build-pack)."
        required: false
        type: string
        default: "0.0.0-dryrun"
  schedule:
    # Weekly. Off the nightly hour so a red morning names one workflow.
    - cron: "41 6 * * 1"

permissions:
  contents: read

# Prefixed and cancel-gated like ci.yml's own group. `github.workflow` is the
# CALLER's name for a called workflow, so without the prefix a ci.yml-invoked
# run and a dispatched one could share a group; and an unconditional
# cancel-in-progress would let a push to main tear down the scheduled or
# push-triggered rehearsal that is the whole point of the new triggers.
concurrency:
  group: pack-dryrun-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-staticlibs:
    name: Build staticlib (${{ matrix.target_cpu }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target_cpu: [cortex-m0, cortex-m4, cortex-m55]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GNU Arm Embedded toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: 14.2.Rel1

      - name: Build static library
        env:
          TARGET_CPU: ${{ matrix.target_cpu }}
          VERSION: ${{ inputs.version || '0.0.0-dryrun' }}
        run: |
          bash scripts/build_staticlib.sh \
            --target-cpu "$TARGET_CPU" \
            --version    "$VERSION" \
            --outdir     "./output/$TARGET_CPU"

      - name: Upload staticlib artefact
        uses: actions/upload-artifact@v7
        with:
          name: pack-dryrun-staticlib-${{ matrix.target_cpu }}
          path: ./output/${{ matrix.target_cpu }}/libns-cmsis-nn-*.a
          if-no-files-found: error
          retention-days: 1

  build-pack:
    name: Build pack (no upload)
    needs: build-staticlibs
    runs-on: ubuntu-24.04
    # Generous job bound; the precise one is on the gen-pack step below, matching
    # release.yml so both paths fail at the same point for the same reason.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      # Rehearse release.yml's changelog path (#395). gen_pack.sh defaults to
      # PACK_CHANGELOG_MODE=tag, which needs the newest tag merged into HEAD to
      # be an ANNOTATED tag object with a non-empty message; release-please
      # creates LIGHTWEIGHT tags, so release.yml repairs that locally with
      # scripts/ci/ensure_local_tag_annotation.sh. A dry-run HEAD has no tag at
      # all, so we fabricate the same situation: a lightweight tag at HEAD, then
      # the very same helper. The helper never runs `git push`, and neither does
      # this step, so nothing here is visible outside the runner's checkout.
      #
      # The synthetic version is the highest release-style (vX.Y.Z) tag merged
      # into HEAD with its patch bumped, plus a `-dryrun.<run_number>`
      # qualifier. The bump matters: gen-pack walks tags newest-first and aborts
      # the changelog at the first lightweight one, so the synthetic tag has to
      # sort above every real release tag or the pdsc would come out with an
      # empty <releases> element. The qualifier keeps the name out of the
      # release namespace; if it somehow already exists at another commit we
      # fail rather than move it.
      - name: Create the synthetic dry-run tag and annotate it locally
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          latest="$(git -c versionsort.suffix=- for-each-ref \
            --format '%(refname:strip=2)' --sort='-v:refname' \
            'refs/tags/v*' --merged \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [[ -z "${latest}" ]]; then
            echo "no vX.Y.Z tag merged into HEAD; cannot derive a dry-run version" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          tag="v${major}.${minor}.$((patch + 1))-dryrun.${RUN_NUMBER}"
          head_sha="$(git rev-parse HEAD)"
          echo "highest merged release tag: ${latest}"
          echo "synthetic dry-run tag:      ${tag} -> ${head_sha}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing="$(git rev-list -n1 "${tag}")"
            if [[ "${existing}" != "${head_sha}" ]]; then
              echo "refusing to clobber existing tag '${tag}' at ${existing}" >&2
              exit 1
            fi
            git tag -d "${tag}" >/dev/null
          fi
          git tag "${tag}" "${head_sha}"
          bash scripts/ci/ensure_local_tag_annotation.sh \
            "${tag}" "${GITHUB_REPOSITORY}" "${GITHUB_WORKSPACE}"
          objecttype="$(git for-each-ref --format '%(objecttype)' "refs/tags/${tag}")"
          if [[ "${objecttype}" != "tag" ]]; then
            echo "'${tag}' is not an annotated tag object (type='${objecttype}')" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n1 "${tag}")" != "${head_sha}" ]]; then
            echo "'${tag}' does not point at HEAD" >&2
            exit 1
          fi
          git tag -l -n99 "${tag}"
          git describe --tags --long --match 'v*' --abbrev=7

          # Ordering guard. gen-pack does not take the tag from us: its
          # git_changelog walks the tags itself (gen-pack 0.11.3
          # lib/gittools:241-249) and the FIRST surviving entry becomes the
          # newest pdsc <release>. Reproduce that walk exactly -- prefix 'v'
          # (gen_pack.sh's DEFAULT_ARGS=(-c "v")), for-each-ref over
          # refs/tags/v* sorted '-v:refname' under versionsort.suffix=-,
          # --merged HEAD, and prerelease-shaped tags (matching 'v.*-.*')
          # dropped unless they point at HEAD -- and assert our synthetic tag
          # wins. A stray prerelease-shaped tag sitting at HEAD (say a
          # leftover vX.Y.Z-something) sorts above the synthetic tag and is
          # kept by that filter, so gen-pack would use it instead; the symptom
          # downstream is a changelog abort or an unexpected/empty <releases>
          # element that names nothing. Fail here, naming the offending tag.
          mapfile -t walk < <(git -c 'versionsort.suffix=-' for-each-ref \
            --format '%(refname)' --sort='-v:refname' 'refs/tags/v*' --merged)
          selected=""
          for ref in "${walk[@]}"; do
            if [[ "${ref}" =~ v.*-.*$ ]] \
               && [[ "$(git rev-list -n1 "${ref}")" != "${head_sha}" ]]; then
              continue
            fi
            selected="${ref#refs/tags/}"
            break
          done
          echo "gen-pack tag walk selects: ${selected:-<none>}"
          if [[ "${selected}" != "${tag}" ]]; then
            echo "gen-pack's tag walk would select '${selected:-<none>}', not the synthetic dry-run tag '${tag}'." >&2
            echo "'${selected:-<none>}' sorts above '${tag}' and survives gen-pack's HEAD filter, so it would take over the newest pdsc <release>." >&2
            echo "Delete or rename '${selected:-<none>}' (or fix the synthetic version derivation) and re-run this dry-run." >&2
            exit 1
          fi

          # gen_pack.sh passes -c "v", so gen-pack takes the version from the
          # tag the walk above just selected, with the prefix stripped. The
          # name check below expands the asset contract for exactly that
          # version, so it needs the same string.
          echo "PACK_VERSION=${tag#v}" >> "${GITHUB_ENV}"

      - name: Download per-arch staticlib artefacts
        uses: actions/download-artifact@v8
        with:
          path: ./_artifacts
          pattern: pack-dryrun-staticlib-*

      - name: Stage prebuilt archives at lib/<cpu>/libns-cmsis-nn.a
        env:
          VERSION: ${{ inputs.version || '0.0.0-dryrun' }}
        run: |
          set -euo pipefail
          mkdir -p ./lib
          for cpu in cortex-m0 cortex-m4 cortex-m55; do
            src="./_artifacts/pack-dryrun-staticlib-${cpu}/libns-cmsis-nn-${cpu}-${VERSION}.a"
            if [[ ! -f "$src" ]]; then
              echo "missing artefact: $src" >&2
              exit 1
            fi
            mkdir -p "./lib/${cpu}"
            cp "$src" "./lib/${cpu}/libns-cmsis-nn.a"
          done
          ls -lR ./lib

      - name: PDSC contract pre-flight
        run: python3 scripts/check_pdsc.py

      - name: Generate pack and docs
        # Pinned (#405) so an upstream push to gen-pack-action's default
        # branch can no longer change the release path with no change in
        # this repo. This SHA's own action.yml pins no gen-pack library
        # version itself -- it just runs our gen-pack-script (gen_pack.sh),
        # which bootstraps gen-pack library 0.11.3 (REQUIRED_GEN_PACK_LIB,
        # gen_pack.sh:12) via its GEN_PACK_LIB_PATH curl fallback (#404),
        # since neither this workflow nor release.yml sets GEN_PACK_LIB_PATH.
        # Re-verify the bootstrapped version when this pin is next bumped;
        # keep this line identical to release.yml's (guarded on every PR by
        # scripts/check_gen_pack_action_pin.sh, run from release-contract.yml).
        uses: Open-CMSIS-Pack/gen-pack-action@9cab2ab138e909e93a3f051ab9a4675b52843a25  # main @ 2026-07-28T08:33:48Z; bootstraps gen-pack 0.11.3
        # Bounds the observed hang in the action's own apt-get update (issue #271).
        # Green gen-pack is 28-43 s, so this has ~14-21x headroom.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately NOT setting PACK_CHANGELOG_MODE, exactly like
          # release.yml: gen_pack.sh defaults to 'tag' and gen_doc.sh to
          # 'full', and forcing either value on both breaks one of them (#395).
          NS_CMSIS_NN_PREBUILT_LIBS_STAGED: "1"
        with:
          doxygen-version: 1.9.6
          packchk-version: 1.4.1
          gen-doc-script: ./Documentation/Doxygen/gen_doc.sh
          doc-path: ./Documentation/html
          gen-pack-script: ./gen_pack.sh --no-preprocess
          gen-pack-output: ./output
          gh-pages-branch: ""
          gh-pages-deploy: ""

      - name: Verify pack artefact name
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packs=( ./output/*.pack )
          if (( ${#packs[@]} != 1 )); then
            printf 'expected exactly one pack in ./output, found %d:\n' "${#packs[@]}" >&2
            printf '  %s\n' "${packs[@]}" >&2
            exit 1
          fi
          name="$(basename "${packs[0]}")"

          # Checked against the release asset contract rather than a glob. The
          # pack row of ci/release-assets.json is what release-verify and the
          # nightly audit demand of a real release, so a rename anywhere in the
          # producing chain -- gen_pack.sh, the pdsc vendor or name, gen-pack
          # itself -- has to fail on the pull request instead of surfacing
          # after the tag and Release are public (#376, #274).
          mapfile -t expected < <(
            python3 scripts/ci/release_assets.py "${PACK_VERSION}" --class required \
              | grep -E '\.pack$'
          )
          if (( ${#expected[@]} != 1 )); then
            printf 'ci/release-assets.json expanded to %d required .pack asset(s) for version %s; expected exactly one.\n' \
              "${#expected[@]}" "${PACK_VERSION}" >&2
            exit 1
          fi
          if [[ "${name}" != "${expected[0]}" ]]; then
            echo "gen-pack produced '${name}', but the release asset contract requires '${expected[0]}'." >&2
            echo "A release publishing '${name}' would fail release-verify and every nightly audit after it." >&2
            exit 1
          fi
          echo "OK: ${name} matches the pack row of ci/release-assets.json"

      - name: Upload pack artefact
        uses: actions/upload-artifact@v7
        with:
          name: ns-cmsis-nn-pack-dryrun
          path: ./output/*.pack
          if-no-files-found: error
          retention-days: 14
