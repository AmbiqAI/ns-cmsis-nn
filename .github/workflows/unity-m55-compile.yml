name: Unity m55 Compile

# PR-time compile gate for the legacy Unity suites (AmbiqAI/ns-cmsis-nn#393).
#
# The full legacy leg (legacy-tester.yml) only runs nightly and at release, so
# until now a Unity test translation unit could first see a cross-compiler at
# release time. That is exactly how #390 escaped: a -Werror=unused-function
# diagnostic in test_arm_convolve_packed_f16.c reached the release build
# because no PR job had ever compiled that file for cortex-m55.
#
# This job closes that window by replaying the m55 leg's *build* on every PR:
# same script, same pinned toolchain, same flags, same -Werror set. It stops
# short of the FVP run, which is what makes it cheap enough for the PR gate --
# execution stays with legacy-tester at nightly/release.
#
# Drift policy: the build command below is the m55 line from
# legacy-tester.yml with `-r` (do not run) added. It deliberately does NOT
# re-specify compiler flags, defines, optimization level, or include paths --
# they all come from Tests/UnitTest/build_and_run_tests.sh and
# Tests/UnitTest/CMakeLists.txt, so this gate cannot drift away from the leg
# it is standing in for. If you change the legacy leg's m55 invocation, change
# it here too.
#
# Toolchain provenance: build_and_run_tests.sh pins Arm GNU Toolchain
# 14.2.rel1 (Setup_Environment, GCC_URL) and downloads it into
# Tests/UnitTest/downloads. Nothing here fetches an unpinned compiler.
on:
  # Invoked from ci.yml so it reports under the single required gate
  # (AmbiqAI/ns-cmsis-nn#353); keep no push/pull_request trigger of its own.
  workflow_call:
    inputs:
      container_image:
        description: Optional container image override for the compile job. When unset, the workflow tries the latest release-tagged image and falls back to :latest.
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      container_image:
        description: Optional container image override for the compile job. When unset, the workflow tries the latest release-tagged image and falls back to :latest.
        required: false
        default: ''
        type: string

# No workflow-level `permissions:` block on purpose: this workflow calls
# resolve-ci-image.yml, which needs `packages: read` to query the release-
# tagged CI image, and a caller-level `contents: read` would cap it below
# that. legacy-tester.yml (the leg this stands in for) is shaped the same way.

jobs:
  resolve-container-image:
    uses: ./.github/workflows/resolve-ci-image.yml
    with:
      container_image: ${{ inputs.container_image }}

  compile:
    name: Compile Unity test TUs (cortex-m55)
    runs-on: ubuntu-latest
    # Measured on a runner (AmbiqAI/ns-cmsis-nn#396): 2 min 36 s for the whole
    # job, of which 41 s is the compile, against a warm downloads cache. The
    # rest of this budget exists for a cold cache -- Corstone-300, Arm GNU
    # 14.2.rel1, CMSIS_5 and the pip requirements -- which is the unmeasured
    # part and which legacy-tester.yml fits inside 20 minutes together with
    # the FVP run this job skips.
    timeout-minutes: 15
    needs: resolve-container-image
    container:
      image: ${{ needs.resolve-container-image.outputs.container_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log selected container image
        shell: bash
        run: |
          {
            echo "### Job container image"
            echo "- selected image: \`${{ needs.resolve-container-image.outputs.container_image }}\`"
            echo "- source: \`${{ needs.resolve-container-image.outputs.resolved_from }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Same path and key as legacy-tester.yml so both legs share one cache
      # entry (Corstone-300 FVP, Arm GNU 14.2.rel1, CMSIS_5, ethos-u core
      # platform, the python venv).
      - name: Restore tests-downloads cache
        id: cache-downloads
        uses: actions/cache@v5
        with:
          path: Tests/UnitTest/downloads
          key: ${{ runner.os }}-tests-downloads-${{ hashFiles('Tests/UnitTest/requirements.txt','Tests/UnitTest/build_and_run_tests.sh') }}
          restore-keys: |
            ${{ runner.os }}-tests-downloads-

      - name: Download deps (internal cache-checks)
        run: |
          cd Tests/UnitTest
          ./build_and_run_tests.sh -rb

      - name: Compile every Unity test TU for cortex-m55
        # The container's default shell is dash; be explicit rather than
        # writing to the lowest common denominator.
        shell: bash
        run: |
          cd Tests/UnitTest
          # The harness calls `cmake --build` without -j; the legacy leg can
          # afford that overnight, a PR gate cannot. This is the one knob this
          # job turns, and it changes scheduling only, never a compile flag.
          CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)"
          export CMAKE_BUILD_PARALLEL_LEVEL
          # legacy-tester.yml's cortex-m55 line, plus -r: build, never run.
          # Float16 is qualified for cortex-m55 only, so both float knobs are
          # on here exactly as they are for the m55 cell of the legacy leg.
          ./build_and_run_tests.sh -q -r -c cortex-m55 -D ARM_NN_ENABLE_F32=ON -D ARM_NN_ENABLE_F16=ON

      # A green build is not by itself proof that the file you touched was
      # compiled: a test directory that never made it into CMakeLists.txt
      # compiles nothing and fails nothing. Assert coverage mechanically
      # instead, deriving the expected set from CMakeLists.txt rather than
      # from a number pasted into this file.
      - name: Verify every m55 test suite was compiled
        shell: bash
        run: |
          set -euo pipefail
          cd Tests/UnitTest
          build_dir=build-cortex-m55-gcc
          expected="$(grep -c '^ *add_subdirectory(TestCases/test_arm_' CMakeLists.txt)"
          # The ethos-u toolchain file sets the object suffix to .obj; match
          # both so a toolchain-file change cannot silently zero this count.
          built="$(find "${build_dir}" \
                     \( -name 'unity_test_arm_*.c.obj' -o -name 'unity_test_arm_*.c.o' \) \
                     ! -name '*_runner.c.obj' ! -name '*_runner.c.o' \
                   | wc -l | tr -d ' ')"
          echo "test suites declared in CMakeLists.txt: ${expected}"
          echo "test TUs compiled for cortex-m55:       ${built}"
          if [ "${built}" -ne "${expected}" ]; then
            echo "Compiled TU count does not match the declared suites." >&2
            echo "Either a suite is gated off for cortex-m55 (it should not be:" >&2
            echo "the m55 cell enables both ARM_NN_ENABLE_F32 and _F16), or the" >&2
            echo "object-file layout changed and this check needs updating." >&2
            exit 1
          fi
          {
            echo "### Unity m55 compile gate"
            echo "- compiled ${built} Unity test translation units for cortex-m55 with -Werror"
            echo "- FVP execution stays with the nightly/release legacy-tester leg"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save tests-downloads cache
        if: steps.cache-downloads.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: Tests/UnitTest/downloads
          key: ${{ runner.os }}-tests-downloads-${{ hashFiles('Tests/UnitTest/requirements.txt','Tests/UnitTest/build_and_run_tests.sh') }}
