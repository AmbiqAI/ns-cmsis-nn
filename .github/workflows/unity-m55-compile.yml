name: Unity m55 Compile

# PR-time compile gate for the legacy Unity suites (AmbiqAI/ns-cmsis-nn#393,
# #398).
#
# The full legacy leg (legacy-tester.yml) only runs nightly and at release, so
# until now a Unity test translation unit could first see a cross-compiler at
# release time. That is exactly how #390 escaped: a -Werror=unused-function
# diagnostic in test_arm_convolve_packed_f16.c reached the release build
# because no PR job had ever compiled that file for cortex-m55.
#
# This job closes that window by replaying the legacy leg's *build* on every
# PR: same script, same pinned toolchain, same flags, same -Werror set. It
# stops short of the FVP run, which is what makes it cheap enough for the PR
# gate -- execution stays with legacy-tester at nightly/release.
#
# Cores (#398): cortex-m55, cortex-m4 and cortex-m0, i.e. every cell of
# legacy-tester.yml's own matrix. m55 alone was not enough: twelve Unity test
# files carry `#if defined(ARM_MATH_DSP) && !defined(ARM_MATH_MVEI)` blocks
# (test_arm_convolve_s8.c, test_arm_convolve_s16.c,
# test_arm_depthwise_conv_s8.c, ...) that an m55 build never reaches, because
# m55 defines ARM_MATH_MVEI. Those blocks compile on cortex-m4 and nowhere
# else in this repo's PR gates; cortex-m0 covers the third shape, where
# neither macro is defined.
#
# Names: this file, the ci.yml job id that calls it and the m55 cell's job
# name are all still spelled "m55" on purpose. The cell name is a check-run
# context, and renaming a context silently drops it from the ruleset that
# requires it. The m55 spelling is historical, not a statement of scope.
#
# Drift policy: the build command below is legacy-tester.yml's build step
# verbatim -- including its cortex-m55 vs. everything-else float-flag branch
# -- with `-r` (do not run) added. It deliberately does NOT re-specify
# compiler flags, defines, optimization level, or include paths -- they all
# come from Tests/UnitTest/build_and_run_tests.sh and
# Tests/UnitTest/CMakeLists.txt, so this gate cannot drift away from the leg
# it is standing in for. If you change the legacy leg's invocation, change it
# here too.
#
# Toolchain provenance: build_and_run_tests.sh pins Arm GNU Toolchain
# 14.2.rel1 (Setup_Environment, GCC_URL) and downloads it into
# Tests/UnitTest/downloads. Nothing here fetches an unpinned compiler.
on:
  # Invoked from ci.yml so it reports under the single required gate
  # (AmbiqAI/ns-cmsis-nn#353); keep no push/pull_request trigger of its own.
  workflow_call:
    inputs:
      container_image:
        description: Optional container image override for the compile job. When unset, the workflow tries the latest release-tagged image and falls back to :latest.
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      container_image:
        description: Optional container image override for the compile job. When unset, the workflow tries the latest release-tagged image and falls back to :latest.
        required: false
        default: ''
        type: string

# No workflow-level `permissions:` block on purpose: this workflow calls
# resolve-ci-image.yml, which needs `packages: read` to query the release-
# tagged CI image, and a caller-level `contents: read` would cap it below
# that. legacy-tester.yml (the leg this stands in for) is shaped the same way.

jobs:
  resolve-container-image:
    uses: ./.github/workflows/resolve-ci-image.yml
    with:
      container_image: ${{ inputs.container_image }}

  compile:
    # Explicit `name:`, so GitHub does NOT append the matrix context itself.
    # The cortex-m55 cell therefore keeps the exact check-run name it had
    # before the matrix existed ("Compile Unity test TUs (cortex-m55)"), and
    # the new cells slot in beside it. No new ci.yml job is introduced, so
    # the `needs:` list of `ci-passed` is unchanged: a matrix cell failing
    # fails this called workflow, which fails the `unity-m55-compile` job
    # that is already in that list.
    name: Compile Unity test TUs (${{ matrix.cpu }})
    runs-on: ubuntu-latest
    # Measured on runners, all three cells:
    #   cold cache (run 33594464284, m55 only, #396):  5 min 46 s
    #   warm cache (#396):                             2 min 27 s - 2 min 49 s
    #   #398 measured runs, per cell, job wall time:
    #     COLD_RUN_PLACEHOLDER
    #     WARM_RUN_PLACEHOLDER
    # The m4 and m0 cells are cheaper than m55: they build 132 suites rather
    # than 146 (no ARM_NN_ENABLE_F16) and emit no MVE.
    timeout-minutes: 15
    needs: resolve-container-image
    container:
      image: ${{ needs.resolve-container-image.outputs.container_image }}

    strategy:
      # Every cell reports independently: one core's -Werror break must not
      # hide another's, which is the whole point of adding the second and
      # third core.
      fail-fast: false
      matrix:
        # legacy-tester.yml's `core` matrix, verbatim. Order puts m55 first
        # so the historically required cell starts first on a busy runner
        # pool.
        cpu:
          - cortex-m55
          - cortex-m4
          - cortex-m0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log selected container image
        shell: bash
        run: |
          {
            echo "### Job container image (${{ matrix.cpu }})"
            echo "- selected image: \`${{ needs.resolve-container-image.outputs.container_image }}\`"
            echo "- source: \`${{ needs.resolve-container-image.outputs.resolved_from }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Same path and key as legacy-tester.yml so both legs share one cache
      # entry (Corstone-300 FVP, Arm GNU 14.2.rel1, CMSIS_5, ethos-u core
      # platform, the python venv). The entry is CPU-independent -- it holds
      # downloads, not build output -- so all three cells share one key. The
      # per-CPU build trees (build-<cpu>-gcc) are not cached at all, by this
      # job or by legacy-tester.
      #
      # Restore and save are split on purpose (`cache/restore` here,
      # `cache/save` at the end) rather than using the combined `cache`
      # action. The combined action's post-job save carries
      # `post-if: success()` (v3, v4 and v5 alike), so it never saves after a
      # cancellation or a prior step's failure -- which is too strict here: a
      # cold run that fetched the toolchain and then failed to *compile* would
      # discard the download and make the next run pay for it again. The split
      # is what lets the save condition below say "keep the bytes on a compile
      # failure, but never publish a download that did not finish".
      #
      # The five terms on that condition are belt-and-braces around the same
      # hazard: build_and_run_tests.sh creates each skip-marker directory
      # (downloads/corstone300_download, downloads/arm_gcc_download, ...)
      # *before* the payload lands inside it, so a tree left half-written by
      # an interrupted download reads as "already installed" to every later
      # run -- and this key is shared with legacy-tester.yml, so it would be
      # handed to the nightly/release leg too. A sixth term (#398) keeps the
      # save on the m55 cell alone: three cells racing one key means two of
      # them lose the upload anyway, and a losing racer's warning is noise
      # that looks like a cache fault.
      - name: Restore tests-downloads cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: Tests/UnitTest/downloads
          key: ${{ runner.os }}-tests-downloads-${{ hashFiles('Tests/UnitTest/requirements.txt','Tests/UnitTest/build_and_run_tests.sh') }}
          # Deliberately no restore-keys: build_and_run_tests.sh skips the
          # download when downloads/arm_gcc_download already exists, so a
          # prefix-matched older entry would pin the *previous* toolchain even
          # after GCC_URL changes -- and then save it under the new key. An
          # exact-key miss and a cold fetch is the correct behaviour here.

      - name: Download deps (internal cache-checks)
        id: deps
        run: |
          cd Tests/UnitTest
          ./build_and_run_tests.sh -rb

      # Assert the compiler *before* anything is built with it and before the
      # save step can publish it. build_and_run_tests.sh only checks that
      # downloads/arm_gcc_download exists, so any entry under this key -- one
      # this job wrote, one legacy-tester.yml wrote, or one a cancelled run
      # left behind -- is reused verbatim, however old it is. The expected
      # version is read out of the harness's own GCC_URL at runtime, so
      # nothing here has to be updated when the pin moves; a mismatch fails
      # the job loudly instead of silently gating a release on a compiler
      # nobody chose.
      - name: Assert the pinned Arm GNU toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          script=Tests/UnitTest/build_and_run_tests.sh
          gcc_bin=Tests/UnitTest/downloads/arm_gcc_download/bin/arm-none-eabi-gcc

          # GCC_URL is .../gnu/<version>/binrel/arm-gnu-toolchain-<version>-...
          # where <version> is the full Arm release token (14.2.rel1), not just
          # major.minor, and is spelled once per host architecture; both must
          # agree. Deriving nothing, or two different tokens, fails the job
          # rather than silently weakening the assertion.
          expected="$(grep -oE 'gnu/[0-9]+\.[0-9]+\.[A-Za-z0-9]+' "${script}" \
            | sed 's|^gnu/||' | tr '[:upper:]' '[:lower:]' | sort -u || true)"
          if [ -z "${expected}" ] || [ "$(printf '%s\n' "${expected}" | wc -l)" -ne 1 ]; then
            echo "Cannot derive a single pinned Arm GNU release token from ${script}." >&2
            printf 'derived: %s\n' "${expected}" >&2
            exit 1
          fi

          if [ ! -x "${gcc_bin}" ]; then
            echo "Expected the harness-downloaded compiler at ${gcc_bin}." >&2
            echo "The downloads cache entry is incomplete -- delete it and re-run." >&2
            exit 1
          fi

          version_line="$("${gcc_bin}" --version | head -n 1)"
          echo "pinned by ${script}: ${expected} (from GCC_URL)"
          echo "reported by compiler: ${version_line}"

          # The banner carries the same release token as the URL:
          # `arm-none-eabi-gcc (Arm GNU Toolchain 14.2.Rel1 (Build arm-14.52))
          # 14.2.1 ...`. Arm spells the `rel` segment inconsistently across
          # releases (14.2.Rel1 but 13.2.rel1), so compare case-insensitively
          # -- and compare the whole token, not major.minor, so a rebuild of
          # the same minor cannot pass as the pin.
          actual="$(printf '%s\n' "${version_line}" \
            | tr '[:upper:]' '[:lower:]' \
            | grep -oE 'arm gnu toolchain [0-9]+\.[0-9]+\.[a-z0-9]+' \
            | tail -n 1 | sed 's|^arm gnu toolchain ||' || true)"
          if [ -z "${actual}" ]; then
            echo "Could not parse an Arm GNU Toolchain release token out of:" >&2
            echo "  ${version_line}" >&2
            echo "Refusing to compile with a compiler this job cannot identify." >&2
            exit 1
          fi

          if [ "${actual}" != "${expected}" ]; then
            echo "Arm GNU toolchain mismatch: ${script} pins ${expected}," >&2
            echo "but ${gcc_bin} reports ${actual}." >&2
            echo "The restored Tests/UnitTest/downloads cache entry is stale:" >&2
            echo "the harness skips its download whenever arm_gcc_download" >&2
            echo "already exists, so it never corrects this by itself. Evict" >&2
            echo "the cache entry (its key is shared with legacy-tester.yml)" >&2
            echo "and re-run." >&2
            exit 1
          fi
          echo "Arm GNU toolchain ${actual} matches the harness pin -- ok."

      - name: Compile every Unity test TU for ${{ matrix.cpu }}
        # `shell: bash` is explicit for `-o pipefail` and for predictability.
        # GitHub's default for a bare `run:` is `bash -e {0}`, with `sh -e {0}`
        # only as a fallback -- but `-e` alone is not `-euo pipefail`, and the
        # first push on this branch did land on the fallback and died with
        # dash's `Illegal option -o pipefail`. Naming the shell removes both
        # variables.
        shell: bash
        run: |
          cd Tests/UnitTest
          # The harness calls `cmake --build` without -j; the legacy leg can
          # afford that overnight, a PR gate cannot. This is the one knob this
          # job turns, and it changes scheduling only, never a compile flag.
          CMAKE_BUILD_PARALLEL_LEVEL="$(nproc)"
          export CMAKE_BUILD_PARALLEL_LEVEL
          # legacy-tester.yml's "Build & run tests" step, plus -r: build,
          # never run. The float-flag branch below is that step's own branch,
          # copied rather than reworded: Float16 is qualified for cortex-m55
          # only (ARM_NN_ENABLE_F16 gates 14 suites in
          # Tests/UnitTest/CMakeLists.txt), ARM_NN_ENABLE_F32 is on for every
          # core (16 suites). Everything else -- -Ofast, the -Werror set, the
          # -mcpu/-mfpu/-mfloat-abi triple, ARM_MATH_DSP on m4 -- comes from
          # the harness and its toolchain file.
          if [ "${{ matrix.cpu }}" = "cortex-m55" ]; then
            ./build_and_run_tests.sh -q -r -c ${{ matrix.cpu }} -D ARM_NN_ENABLE_F32=ON -D ARM_NN_ENABLE_F16=ON
          else
            ./build_and_run_tests.sh -q -r -c ${{ matrix.cpu }} -D ARM_NN_ENABLE_F32=ON
          fi

      # THROWAWAY (#398 evidence): print the flags CMake actually generated
      # for a Unity suite in this cell, so the PR can quote them per CPU
      # rather than assert them. Dropped before the PR head.
      - name: Dump generated compile flags (${{ matrix.cpu }})
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          cd Tests/UnitTest
          f="$(find build-${{ matrix.cpu }}-gcc/TestCases/test_arm_convolve_s8 -name flags.make | head -n 1)"
          echo "== ${{ matrix.cpu }}: ${f} =="
          grep -E '^(C_FLAGS|C_DEFINES|C_INCLUDES) *=' "${f}" | cut -c1-2000
          echo "== CMakeCache float options =="
          grep -E '^ARM_NN_ENABLE_(F16|F32):' build-${{ matrix.cpu }}-gcc/CMakeCache.txt

      # A green build is not by itself proof that the file you touched was
      # compiled: a test directory that never made it into CMakeLists.txt
      # compiles nothing and fails nothing. Assert coverage mechanically over
      # three independently derived sets -- what CMakeLists.txt declares for
      # *this cell's options*, what the build actually compiled, and what
      # exists under TestCases/ on disk -- and require all three to agree by
      # name, not merely by count. A suite directory nobody wired into
      # CMakeLists.txt therefore fails here loudly instead of passing
      # silently, which is the failure mode a count-only check would miss.
      #
      # Per-CPU (#398): the compiled set legitimately differs between cells,
      # because the m4 and m0 cells do not set ARM_NN_ENABLE_F16 and so never
      # configure the 14 suites inside `if(ARM_NN_ENABLE_F16)`. That
      # difference is derived, not listed: the step walks CMakeLists.txt's own
      # if()/endif() nesting and resolves each guard against the values CMake
      # recorded in this build's CMakeCache.txt. Add a suite under a new
      # option and both sides move together; no list in this workflow needs
      # touching.
      - name: Verify every ${{ matrix.cpu }} test suite was compiled
        shell: bash
        run: |
          set -euo pipefail
          cd Tests/UnitTest
          cpu='${{ matrix.cpu }}'
          build_dir="build-${cpu}-gcc"
          cache="${build_dir}/CMakeCache.txt"
          work="$(mktemp -d)"

          if [ ! -f "${cache}" ]; then
            echo "Expected ${cache} from the build above." >&2
            exit 1
          fi

          # Probe suites (TestCases/*_probe) are one-off diagnostic harnesses,
          # not part of the shipped suite set, and are not expected to be
          # declared, compiled, or present in all three places at once. Drop
          # them from every set by explicit `*_probe` pattern rather than
          # leaning on the `test_arm_` prefix to keep them out: a probe named
          # test_arm_<something>_probe carries the prefix too, and would
          # otherwise fail this step for existing rather than for being
          # unwired.
          drop_probes() { grep -v -E '_probe$' || true; }

          # CMake truthiness for one cache entry. Absent -> "unknown", which
          # the caller escalates rather than guesses at.
          cmake_bool() {
            local var="$1" val
            val="$(grep -E "^${var}:[A-Za-z_]+=" "${cache}" | head -n 1 | sed 's/^[^=]*=//' || true)"
            if [ -z "${val}" ]; then
              echo unknown
              return 0
            fi
            case "$(printf '%s' "${val}" | tr '[:lower:]' '[:upper:]')" in
              ON|1|TRUE|YES|Y) echo on ;;
              OFF|0|FALSE|NO|N|IGNORE|NOTFOUND|*-NOTFOUND) echo off ;;
              *) echo on ;;
            esac
          }

          # (a) suites declared in Tests/UnitTest/CMakeLists.txt, each with
          # the if() guards it sits inside. Matched on the TestCases/ path
          # rather than on a test_arm_ prefix, so all three sets are built
          # from the same rule and a suite spelled without the conventional
          # prefix is compared rather than skipped. The awk below is a
          # statement scanner, not a line matcher: it accumulates until the
          # parentheses balance, so a multi-line if() condition (the probe
          # guards are four lines) is read as one condition.
          awk '
            function nopen(s,   i, ch, o) {
              o = 0
              for (i = 1; i <= length(s); i++) {
                ch = substr(s, i, 1)
                if (ch == "(") o++
                else if (ch == ")") o--
              }
              return o
            }
            {
              line = $0
              sub(/#.*/, "", line)
              buf = buf " " line
              if (index(buf, "(") == 0) { buf = ""; next }
              if (nopen(buf) > 0) next
              stmt = buf
              buf = ""
              gsub(/[ \t]+/, " ", stmt)
              sub(/^ +/, "", stmt)
              sub(/ +$/, "", stmt)
              if (stmt ~ /^if *\(/) {
                cond = stmt
                sub(/^if *\( */, "", cond)
                sub(/ *\) *$/, "", cond)
                depth++
                guard[depth] = cond
                next
              }
              # else/elseif inverts or replaces the guard in ways this
              # scanner does not model; mark the branch unresolved so the
              # caller fails loudly instead of assuming.
              if (stmt ~ /^else *\(/ || stmt ~ /^elseif *\(/) {
                if (depth > 0) guard[depth] = "UNRESOLVED"
                next
              }
              if (stmt ~ /^endif *\(/) {
                if (depth > 0) { delete guard[depth]; depth-- }
                next
              }
              if (stmt ~ /^add_subdirectory *\( *TestCases\//) {
                name = stmt
                sub(/.*TestCases\//, "", name)
                sub(/[^A-Za-z0-9_].*$/, "", name)
                g = ""
                for (i = 1; i <= depth; i++) g = (g == "" ? guard[i] : g " AND " guard[i])
                if (g == "") g = "-"
                print name "\t" g
              }
            }
          ' CMakeLists.txt > "${work}/guarded_all"
          grep -v -E '_probe[[:space:]]' "${work}/guarded_all" > "${work}/guarded" || true

          : > "${work}/declared"
          : > "${work}/gated_off"
          : > "${work}/unresolved"
          while IFS="$(printf '\t')" read -r name guard; do
            [ -n "${name}" ] || continue
            state=enabled
            if [ "${guard}" != "-" ]; then
              while IFS= read -r term; do
                [ -n "${term}" ] || continue
                if printf '%s' "${term}" | grep -qE '^[A-Za-z_][A-Za-z0-9_]*$'; then
                  case "$(cmake_bool "${term}")" in
                    on) ;;
                    off) state=disabled ;;
                    *) if [ "${state}" = enabled ]; then state=unresolved; fi ;;
                  esac
                else
                  if [ "${state}" = enabled ]; then state=unresolved; fi
                fi
                if [ "${state}" = disabled ]; then break; fi
              done < <(printf '%s\n' "${guard}" | awk -F' AND ' '{ for (i = 1; i <= NF; i++) print $i }')
            fi
            case "${state}" in
              enabled) echo "${name}" >> "${work}/declared" ;;
              disabled) echo "${name}" >> "${work}/gated_off" ;;
              *) printf '%s\t%s\n' "${name}" "${guard}" >> "${work}/unresolved" ;;
            esac
          done < "${work}/guarded"

          if [ -s "${work}/unresolved" ]; then
            echo "Unity ${cpu} coverage check: unresolved add_subdirectory() guard(s)." >&2
            cat "${work}/unresolved" >&2
            echo "" >&2
            echo "This step resolves each if() guard around an" >&2
            echo "add_subdirectory(TestCases/...) line against the values in" >&2
            echo "${cache}. A guard it cannot resolve is a guard whose effect" >&2
            echo "on this cell is unknown, so the suite can be neither" >&2
            echo "required nor excused. Either make the guard a plain cache" >&2
            echo "option (as ARM_NN_ENABLE_F32/F16 are), or teach this step" >&2
            echo "how to evaluate it." >&2
            exit 1
          fi

          sort -u -o "${work}/declared" "${work}/declared"
          sort -u -o "${work}/gated_off" "${work}/gated_off"

          # (b) suites the build actually produced a test object for. The
          # ethos-u toolchain file sets the object suffix to .obj; match both
          # so a toolchain-file change cannot silently zero this set. Matched
          # on `unity_` alone, not `unity_test_arm_`: every suite carries
          # Unity/unity_<dir>.c, so the object is unity_<dir>.c.o{,bj}
          # whatever the directory is called -- same reason as (a).
          find "${build_dir}" \
              \( -name 'unity_*.c.obj' -o -name 'unity_*.c.o' \) \
              ! -name '*_runner.c.obj' ! -name '*_runner.c.o' \
            | sed -e 's|.*/unity_||' -e 's|\.c\.obj$||' -e 's|\.c\.o$||' \
            | drop_probes \
            | sort -u > "${work}/compiled"

          # (c) suite directories present in the checkout, minus the ones this
          # cell's options gate off. Every directory under TestCases/ is a
          # suite except three shared-infrastructure ones (Common: templates
          # and helper headers; TestData: generated vectors; Utils: shared
          # test utilities), which are subtracted by name. Matching '*' rather
          # than 'test_arm_*' is the point: a suite directory added without
          # the conventional prefix and never wired into CMakeLists.txt is
          # exactly the unwired case this set exists to catch, and a prefix
          # match would drop it from the comparison and let it pass silently.
          # The gated-off subtraction keeps that property on the m4/m0 cells:
          # it removes only names this CMakeLists.txt declares under an option
          # this cell left off, so an undeclared directory still has nothing
          # to hide behind.
          find TestCases -mindepth 1 -maxdepth 1 -type d \
              ! -name 'Common' ! -name 'TestData' ! -name 'Utils' \
            | sed 's|.*/||' \
            | drop_probes \
            | sort -u > "${work}/ondisk_all"
          comm -23 "${work}/ondisk_all" "${work}/gated_off" > "${work}/ondisk"

          declared_n="$(wc -l < "${work}/declared" | tr -d ' ')"
          compiled_n="$(wc -l < "${work}/compiled" | tr -d ' ')"
          ondisk_n="$(wc -l < "${work}/ondisk" | tr -d ' ')"
          gated_n="$(wc -l < "${work}/gated_off" | tr -d ' ')"

          echo "cpu: ${cpu}"
          echo "test suites declared in CMakeLists.txt and enabled here: ${declared_n}"
          echo "test TUs compiled for ${cpu}: ${compiled_n}"
          echo "test suite directories on disk (minus option-gated): ${ondisk_n}"
          echo "suites gated off by this cell's CMake options: ${gated_n}"
          if [ "${gated_n}" != "0" ]; then
            echo "  gated off: $(tr '\n' ' ' < "${work}/gated_off")"
          fi

          report_diff() {
            local left_name="$1" left_file="$2" right_name="$3" right_file="$4"
            local only_left only_right
            only_left="$(comm -23 "${left_file}" "${right_file}" | tr '\n' ' ')"
            only_right="$(comm -13 "${left_file}" "${right_file}" | tr '\n' ' ')"
            if [ -n "${only_left// /}" ]; then
              echo "  in ${left_name} but not ${right_name}: ${only_left}" >&2
            fi
            if [ -n "${only_right// /}" ]; then
              echo "  in ${right_name} but not ${left_name}: ${only_right}" >&2
            fi
            return 0
          }

          if ! cmp -s "${work}/declared" "${work}/compiled" \
             || ! cmp -s "${work}/declared" "${work}/ondisk"; then
            echo "Unity ${cpu} coverage mismatch: the three suite sets disagree." >&2
            report_diff "CMakeLists.txt" "${work}/declared" \
                        "compiled objects" "${work}/compiled"
            report_diff "CMakeLists.txt" "${work}/declared" \
                        "TestCases/ on disk" "${work}/ondisk"
            report_diff "compiled objects" "${work}/compiled" \
                        "TestCases/ on disk" "${work}/ondisk"
            echo "" >&2
            echo "A declared suite with no compiled object most likely has its" >&2
            echo "add_subdirectory() inside an option-gated if() block in" >&2
            echo "Tests/UnitTest/CMakeLists.txt whose guard this step resolved" >&2
            echo "as ON against ${cache} while CMake did not configure it --" >&2
            echo "for instance a guard on a variable that is not a cache" >&2
            echo "entry. Failing that, the object-file layout changed and this" >&2
            echo "check needs updating." >&2
            echo "" >&2
            echo "A suite on disk but not in CMakeLists.txt is compiled by no" >&2
            echo "leg at all -- it has no add_subdirectory() line, or the line" >&2
            echo "it has is spelled in a way the awk scanner above does not" >&2
            echo "match. Add it to Tests/UnitTest/CMakeLists.txt." >&2
            echo "" >&2
            echo "The on-disk set is every directory under TestCases/ except" >&2
            echo "Common, TestData, Utils, *_probe and the option-gated names" >&2
            echo "listed above -- no test_arm_ prefix is assumed. So if the" >&2
            echo "name above is not a suite at all but a new shared-helper" >&2
            echo "directory, the fix is to add it to that exclusion list in" >&2
            echo "this step, not to CMakeLists.txt." >&2
            exit 1
          fi
          {
            echo "### Unity compile gate (${cpu})"
            echo "- compiled ${compiled_n} Unity test translation units for ${cpu} with -Werror"
            echo "- agrees with the ${declared_n} suites CMakeLists.txt declares under this cell's options and"
            echo "  ${ondisk_n} suite directories on disk (${gated_n} option-gated)"
            echo "- FVP execution stays with the nightly/release legacy-tester leg"
          } >> "$GITHUB_STEP_SUMMARY"

      # The harness redirects only stdout into build-*/make_stdout.log;
      # compiler diagnostics go to stderr and land in the job log. Keep the
      # logs anyway, so a broken TU's diagnostic survives even if the
      # generator ever routes it to stdout, and so a failed build stays
      # inspectable without re-running the job. The artifact name carries the
      # CPU: upload-artifact@v4 rejects a second upload under a name another
      # matrix cell already used.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ matrix.cpu }}-compile-logs
          path: |
            Tests/UnitTest/build-${{ matrix.cpu }}-gcc/make_stdout.log
            Tests/UnitTest/build-${{ matrix.cpu }}-gcc/cmake_stdout.log
          if-no-files-found: warn
          retention-days: 7

      # A cold-cache run that fetched the toolchain and then failed to compile
      # has still paid for the download; let the save step below keep it.
      - name: Check for downloads to cache
        id: downloads-present
        if: always()
        shell: bash
        run: |
          if [ -d Tests/UnitTest/downloads ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Publish the entry only when this run actually completed the download.
      # `!cancelled()` rather than `success()` so a cold fetch that a later
      # *compile* failure follows is still kept -- the bytes were paid for and
      # the compiler was asserted above and that assertion passed (a cold run that
      # fetched the wrong compiler must not be saved either). `steps.deps.outcome == 'success'` is
      # the load-bearing term: the harness marks each dependency installed by
      # creating its directory before the payload arrives, so a cancelled or
      # failed download leaves a tree that later runs skip re-fetching. That
      # must never reach the key, which legacy-tester.yml reads too.
      #
      # `matrix.cpu == 'cortex-m55'` (#398) elects one writer. The cache entry
      # is CPU-independent, so the other cells restore it and never save:
      # three cells finishing a cold fetch within seconds of each other would
      # race one key, and the two losers log an "already exists" warning that
      # reads like a cache fault. If the m55 cell is the one that fails early,
      # the next run simply pays the cold fetch again -- the same position
      # this job was in before the cache existed.
      - name: Save tests-downloads cache
        if: >-
          !cancelled()
          && matrix.cpu == 'cortex-m55'
          && steps.deps.outcome == 'success'
          && steps.toolchain.outcome == 'success'
          && steps.cache.outputs.cache-hit != 'true'
          && steps.downloads-present.outputs.present == 'true'
        uses: actions/cache/save@v5
        with:
          path: Tests/UnitTest/downloads
          key: ${{ runner.os }}-tests-downloads-${{ hashFiles('Tests/UnitTest/requirements.txt','Tests/UnitTest/build_and_run_tests.sh') }}
