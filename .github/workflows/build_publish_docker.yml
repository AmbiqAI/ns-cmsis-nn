name: Build NS-CMSIS-NN CI Docker Image

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag to publish.
        required: false
        default: latest
        type: string
      publish_latest:
        description: Also publish the latest alias.
        required: false
        default: false
        type: boolean
      source_ref:
        description: >-
          Exact commit SHA (or other ref) to build the image from. Leave
          unset to build from the ref that triggered this run. Callers
          recovering assets for an existing release tag MUST pass the
          verified commit that tag resolves to, not a branch name.
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish.
        required: false
        default: latest
        type: string
      publish_latest:
        description: Also publish the latest alias.
        required: false
        default: true
        type: boolean
      source_ref:
        description: >-
          Exact commit SHA (or other ref) to build the image from. Leave
          unset to build from the ref that triggered this run.
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 16 * * 1' # 8 AM PST every Monday

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/ambiqai/ns-cmsis-nn-ci

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Bootstrap checkout: gets scripts/ci/resolve_image_tags.sh onto disk
      # from whatever ref/commit triggered this workflow run. Deliberately
      # does NOT pin `source_ref` -- a historical release tag (e.g. v7.29.1)
      # can predate this helper script entirely (AmbiqAI/ns-cmsis-nn#228),
      # so resolving tags must run against the CURRENT, merged workflow
      # tooling, never against the immutable historical source being
      # recovered. Nothing that reads release SOURCE (the Dockerfile, the
      # build context) runs against this checkout; the pinned re-checkout
      # below replaces it before "Build Docker Image" runs.
      - name: Checkout Repository (workflow tooling)
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        shell: bash
        # NOTE (AmbiqAI/ns-cmsis-nn#228): do NOT branch on github.event_name
        # or read github.event.inputs.* here. When this workflow is invoked
        # via `uses:` from a workflow_dispatch-triggered caller (e.g.
        # release.yml's `recover_tag` recovery flow), github.event_name is
        # inherited from the OUTER caller and github.event.inputs.* refers to
        # the OUTER caller's own dispatch inputs, not the image_tag /
        # publish_latest this workflow was actually invoked with. The
        # unified `inputs` context is correct for both workflow_call and
        # workflow_dispatch, so resolve_image_tags.sh uses it unconditionally
        # (schedule is the sole exception: it has no `inputs` at all).
        run: |
          set -euo pipefail
          bash scripts/ci/resolve_image_tags.sh \
            "${{ github.event_name }}" \
            "${{ inputs.image_tag }}" \
            "${{ inputs.publish_latest }}" \
            "${{ env.REGISTRY_IMAGE }}" \
            "$GITHUB_OUTPUT"

      # Re-checkout pinned to the immutable source being built. For a normal
      # dispatch/schedule run (source_ref unset) this resolves to the same
      # github.sha as the bootstrap checkout above, so it's a no-op re-sync.
      # For a recovery run it replaces the working tree with the EXACT
      # historical commit the recovered tag points at -- actions/checkout
      # can be invoked more than once per job. Everything that reads release
      # source from here on (the Docker build context and Dockerfile) must
      # come entirely from this checkout, never the tooling one above.
      - name: Checkout Repository (pinned to source_ref)
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Build Docker Image
        shell: bash
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            tag_args+=(-t "$tag")
          done <<< "${{ steps.meta.outputs.docker_tags }}"

          docker build \
            "${tag_args[@]}" \
            ${{ steps.meta.outputs.build_args }} \
            -f .devcontainer/Dockerfile .

      - name: Push Docker Image
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.docker_tags }}"
