name: Build NS-CMSIS-NN CI Docker Image

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag to publish.
        required: false
        default: latest
        type: string
      publish_latest:
        description: Also publish the latest alias.
        required: false
        default: false
        type: boolean
      source_ref:
        description: >-
          Exact commit SHA (or other ref) to build the image from. Leave
          unset to build from the ref that triggered this run. Callers
          recovering assets for an existing release tag MUST pass the
          verified commit that tag resolves to, not a branch name.
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish.
        required: false
        default: latest
        type: string
      publish_latest:
        description: Also publish the latest alias.
        required: false
        default: true
        type: boolean
      source_ref:
        description: >-
          Exact commit SHA (or other ref) to build the image from. Leave
          unset to build from the ref that triggered this run.
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 16 * * 1' # 8 AM PST every Monday

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/ambiqai/ns-cmsis-nn-ci

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Bootstrap/tooling checkout: gets scripts/ci/resolve_image_tags.sh AND
      # the CURRENT, hardened .devcontainer/Dockerfile onto disk from
      # whatever ref/commit triggered this workflow run, into a DEDICATED
      # `_tooling/` subdirectory. Deliberately does NOT pin `source_ref` -- a
      # historical release tag (e.g. v7.29.1/v7.29.2) can predate the helper
      # script entirely, and its own historical Dockerfile can carry
      # bootstrap defects in historical tool-acquisition logic that have
      # since been fixed on main (AmbiqAI/ns-cmsis-nn#228; both confirmed
      # live in recovery run 31335858426, jobs 93301489901/93301568122).
      # Using a separate `path:` (rather than re-checking out over the same
      # directory) is the load-bearing part of this fix: two
      # actions/checkout@ calls to the SAME path silently clobber each
      # other, which is exactly how the historical Dockerfile previously
      # shadowed this current one. Nothing that reads release SOURCE (the
      # Docker build context) ever comes from `_tooling/`; only the pinned
      # `_source/` checkout below does.
      - name: Checkout Repository (workflow tooling)
        uses: actions/checkout@v7
        with:
          path: _tooling

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: meta
        shell: bash
        # NOTE (AmbiqAI/ns-cmsis-nn#228): do NOT branch on github.event_name
        # or read github.event.inputs.* here. When this workflow is invoked
        # via `uses:` from a workflow_dispatch-triggered caller (e.g.
        # release.yml's `recover_tag` recovery flow), github.event_name is
        # inherited from the OUTER caller and github.event.inputs.* refers to
        # the OUTER caller's own dispatch inputs, not the image_tag /
        # publish_latest this workflow was actually invoked with. The
        # unified `inputs` context is correct for both workflow_call and
        # workflow_dispatch, so resolve_image_tags.sh uses it unconditionally
        # (schedule is the sole exception: it has no `inputs` at all).
        run: |
          set -euo pipefail
          bash _tooling/scripts/ci/resolve_image_tags.sh \
            "${{ github.event_name }}" \
            "${{ inputs.image_tag }}" \
            "${{ inputs.publish_latest }}" \
            "${{ env.REGISTRY_IMAGE }}" \
            "$GITHUB_OUTPUT"

      # Immutable historical source checkout: pinned to the exact commit
      # being built/recovered, into its OWN `_source/` subdirectory,
      # completely separate from `_tooling/` above. For a normal
      # push/direct-dispatch/schedule run `source_ref` is unset and resolves
      # to the same github.sha as the tooling checkout, so `_source/` and
      # `_tooling/` end up as identical trees -- this is a structural,
      # no-behavior-change fix for that path. For a recovery run this is the
      # EXACT historical commit the recovered tag points at, and it is the
      # ONLY tree that ever becomes part of the Docker build context (see
      # "Build Docker Image" below): it never contributes a Dockerfile of
      # its own to the build.
      - name: Checkout Repository (pinned to source_ref)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: _source

      - name: Build Docker Image
        shell: bash
        # Dockerfile path and build context are deliberately two DIFFERENT
        # trusted/historical trees (AmbiqAI/ns-cmsis-nn#228): `-f` reads the
        # CURRENT, hardened Dockerfile from `_tooling/`, while the build
        # context (the trailing path argument) is `_source/` -- the pinned,
        # immutable historical checkout -- so `COPY`/build-context files
        # (e.g. ci/tools/manifest.json) always come from the historical
        # release being recovered, never from current main, while the
        # Dockerfile's bootstrap LOGIC always comes from current main, never
        # a historical (possibly broken) copy of the same file.
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            tag_args+=(-t "$tag")
          done <<< "${{ steps.meta.outputs.docker_tags }}"

          docker build \
            "${tag_args[@]}" \
            ${{ steps.meta.outputs.build_args }} \
            -f _tooling/.devcontainer/Dockerfile _source

      - name: Push Docker Image
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.docker_tags }}"
