name: Zephyr Integration

on:
  # Invoked from ci.yml so it reports under the single required gate
  # (AmbiqAI/ns-cmsis-nn#353); keep no push/pull_request trigger of its own.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiring:
    name: Zephyr wiring (CMake mock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run zephyr/CMakeLists.txt wiring test
        run: cmake -S cmake/tests/zephyr_wiring -B build/zephyr_wiring

  kconfig:
    name: Zephyr Kconfig contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Kconfig contract test
        run: python3 scripts/check_zephyr_kconfig.py

  apollo510:
    name: Apollo510 source build (Zephyr SDK and Arm GCC 15)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          path: helia-core
      - uses: actions/checkout@v7
        with:
          repository: zephyrproject-rtos/zephyr
          ref: v4.5.0
          path: workspace/zephyr
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare Apollo510 west workspace
        working-directory: workspace
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler gperf ninja-build
          python -m pip install -r zephyr/scripts/requirements-base.txt
          west init -l zephyr
          west update --narrow -o=--depth=1 cmsis cmsis_6 cmsis-dsp hal_ambiq picolibc
      - name: Cache Arm Zephyr SDK
        id: sdk
        uses: actions/cache@v6
        with:
          path: ~/zephyr-sdk-1.0.1
          key: zephyr-sdk-1.0.1-arm-zephyr-eabi-${{ runner.os }}-${{ runner.arch }}
      - name: Install Arm Zephyr SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        working-directory: workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          west sdk install --version 1.0.1 --gnu-toolchains arm-zephyr-eabi --no-hosttools \
            --personal-access-token "$GH_TOKEN"
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '15.3.Rel1'
      - name: Build and link all kernel groups with Zephyr integer types
        working-directory: workspace
        run: |
          export ZEPHYR_BASE="$PWD/zephyr"
          export ZEPHYR_SDK_INSTALL_DIR="$HOME/zephyr-sdk-1.0.1"
          export GNUARMEMB_TOOLCHAIN_PATH="$(dirname "$(dirname "$(command -v arm-none-eabi-gcc)")")"
          core="$GITHUB_WORKSPACE/helia-core"
          for toolchain in zephyr gnuarmemb; do
            ZEPHYR_TOOLCHAIN_VARIANT="$toolchain" west build -b apollo510_evb "$core/Tests/Zephyr" \
              -d "build-$toolchain" -- "-DEXTRA_ZEPHYR_MODULES=$core"
          done
