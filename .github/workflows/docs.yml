# SPDX-License-Identifier: LicenseRef-Ambiq-Apollo-SDK
#
# Builds the heliaCORE Sphinx site and renders the generated Doxygen XML API.
#
# - On PR: builds the Sphinx site as a sanity check and uploads it as an
#   artifact so reviewers can download a static preview.
# - On push to main: builds and deploys the customer-facing Sphinx site to
#   GitHub Pages so docs updates can go live without forcing a package release.

name: docs

on:
  # Invoked from ci.yml so it reports under the single required gate
  # (AmbiqAI/ns-cmsis-nn#353); keep no push/pull_request trigger of its own.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Also consumed by build_sphinx_docs.sh as the version to install.
      DOXYGEN_VERSION: "1.9.6"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      # Keyed on the version, so a hit that verifies skips the network
      # entirely and a bump misses and re-downloads. The script re-checks the
      # restored archive against its pinned SHA-256 and re-downloads if it
      # does not match, so a bad restored entry is discarded rather than used
      # (though the entry itself stays cached until the key changes).
      - name: Cache Doxygen tarball
        uses: actions/cache@v6
        with:
          path: /tmp/doxygen-${{ env.DOXYGEN_VERSION }}.linux.bin.tar.gz
          key: doxygen-tarball-${{ runner.os }}-${{ env.DOXYGEN_VERSION }}

      - name: Build Sphinx + Doxygen XML site
        run: bash scripts/docs/build_sphinx_docs.sh --install-doxygen

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: heliacore-docs-site
          path: site/
          retention-days: 14

  # The Astro Starlight site that replaces this Sphinx build at the cut-over
  # (AmbiqAI/ns-cmsis-nn#521). Until then it is built for review only: it
  # produces its own artifact and the Pages deploy below still publishes the
  # Sphinx output. ci.yml carries no paths filter, so this reports on every
  # pull request and push the Sphinx build does.
  astro:
    name: Build Astro site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Not the 1.9.6 the Sphinx build pins: helia-ui-doxyref reads the XML
      # schema of this release, and an older dump gives a thinner model with
      # no error. The two sites run different Doxygen versions until the
      # cut-over retires the Sphinx build.
      ASTRO_DOXYGEN_VERSION: "1.17.0"
      ASTRO_DOXYGEN_SHA256: "75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Cache Doxygen tarball
        uses: actions/cache@v6
        with:
          path: /tmp/doxygen-${{ env.ASTRO_DOXYGEN_VERSION }}.linux.bin.tar.gz
          key: doxygen-tarball-${{ runner.os }}-${{ env.ASTRO_DOXYGEN_VERSION }}

      # The sources, and verifying before anything reaches tar, are
      # scripts/docs/build_sphinx_docs.sh's. That script is not called here
      # because it has no install-only mode and this job needs neither Python
      # nor Sphinx.
      - name: Install Doxygen
        run: |
          set -euo pipefail
          archive="/tmp/doxygen-${ASTRO_DOXYGEN_VERSION}.linux.bin.tar.gz"
          tag="Release_${ASTRO_DOXYGEN_VERSION//./_}"
          if ! echo "${ASTRO_DOXYGEN_SHA256}  ${archive}" | sha256sum -c - >/dev/null 2>&1; then
            for url in \
              "https://github.com/doxygen/doxygen/releases/download/${tag}/doxygen-${ASTRO_DOXYGEN_VERSION}.linux.bin.tar.gz" \
              "https://www.doxygen.nl/files/doxygen-${ASTRO_DOXYGEN_VERSION}.linux.bin.tar.gz"; do
              curl -fsSL --retry 3 -o "${archive}" "${url}" && break
            done
            echo "${ASTRO_DOXYGEN_SHA256}  ${archive}" | sha256sum -c -
          fi
          tar -C /tmp -xzf "${archive}"
          echo "/tmp/doxygen-${ASTRO_DOXYGEN_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: astro-site/package-lock.json

      - name: Install site dependencies
        working-directory: astro-site
        run: npm ci

      - name: Build Astro site
        working-directory: astro-site
        run: npm run build

      - name: Upload Astro site artifact
        uses: actions/upload-artifact@v7
        with:
          name: astro-site
          path: astro-site/dist
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Skip release-please merge commits: release.yml deploys the docs for a
    # release itself, and two workflows deploying Pages for the same push
    # can collide (GitHub runs one Pages deployment at a time). `contains`
    # rather than `startsWith` so this matches release.yml's own release
    # detection exactly -- the two workflows must never disagree on what a
    # release push is, whichever merge method produced the commit. The
    # github-pages concurrency group serializes docs deploys with each
    # other; release.yml's deploy does not share it, which is fine while
    # this job skips every push release.yml deploys for.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, 'chore(main): release')
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Sphinx site artifact
        uses: actions/download-artifact@v8
        with:
          name: heliacore-docs-site
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
