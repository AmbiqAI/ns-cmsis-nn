# SPDX-License-Identifier: LicenseRef-Ambiq-Apollo-SDK
name: docs

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      release_publish:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Astro site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_DOXYGEN_VERSION: "1.17.0"
      ASTRO_DOXYGEN_SHA256: "75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Cache Doxygen tarball
        uses: actions/cache@v6
        with:
          path: /tmp/doxygen-${{ env.ASTRO_DOXYGEN_VERSION }}.linux.bin.tar.gz
          key: doxygen-tarball-${{ runner.os }}-${{ env.ASTRO_DOXYGEN_VERSION }}

      - name: Install Doxygen
        run: |
          set -euo pipefail
          archive="/tmp/doxygen-${ASTRO_DOXYGEN_VERSION}.linux.bin.tar.gz"
          tag="Release_${ASTRO_DOXYGEN_VERSION//./_}"
          if ! echo "${ASTRO_DOXYGEN_SHA256}  ${archive}" | sha256sum -c - >/dev/null 2>&1; then
            for url in \
              "https://github.com/doxygen/doxygen/releases/download/${tag}/doxygen-${ASTRO_DOXYGEN_VERSION}.linux.bin.tar.gz" \
              "https://www.doxygen.nl/files/doxygen-${ASTRO_DOXYGEN_VERSION}.linux.bin.tar.gz"; do
              curl -fsSL --retry 3 -o "${archive}" "${url}" && break
            done
            echo "${ASTRO_DOXYGEN_SHA256}  ${archive}" | sha256sum -c -
          fi
          tar -C /tmp -xzf "${archive}"
          echo "/tmp/doxygen-${ASTRO_DOXYGEN_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Setup Python for link validation
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: astro-site/package-lock.json

      - name: Install site dependencies
        working-directory: astro-site
        run: npm ci

      - name: Install browser for validation
        working-directory: astro-site
        run: npx playwright install --with-deps chromium

      - name: Generate API and build site
        working-directory: astro-site
        run: npm run build

      # The committed kernel contract is exported by a header scanner; the Doxygen
      # XML the reference build just generated is the independent reading of the
      # same doc blocks. They must name the same functions, parameters, types and
      # directions, or one of the two parsers has a blind spot. Refs #525.
      - name: Cross-check the kernel contract against the Doxygen XML
        run: python3 scripts/check_kernel_contract.py verify-xml --xml-dir astro-site/.cache/reference/xml

      - name: Validate types and coverage
        working-directory: astro-site
        run: |
          npm run check
          npm run test:coverage

      - name: Test rendered site and redirects
        working-directory: astro-site
        run: npm run test:smoke

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-browser-evidence
          path: astro-site/test-results/
          retention-days: 14

      - name: Upload tested site
        uses: actions/upload-artifact@v7
        with:
          name: heliacore-docs-site
          path: astro-site/dist/
          retention-days: 14

  deploy:
    name: Deploy tested site to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Release recovery restores assets, never the live site. See #521 and #228.
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.release_publish || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'chore(main): release')))
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download tested site
        uses: actions/download-artifact@v8
        with:
          name: heliacore-docs-site
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
