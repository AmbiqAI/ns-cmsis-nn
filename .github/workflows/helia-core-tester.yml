name: Helia Core Tester

on:
  workflow_call:
    inputs:
      container_image:
        description: Optional container image override for the test jobs. When unset, the workflow tries the latest release-tagged image and falls back to :latest.
        required: false
        default: ''
        type: string
      source_ref:
        description: >-
          Exact commit SHA (or other ref) to check out the test source
          (Tests/helia-core-tester) from. Leave unset to use the ref that
          triggered this run. Release callers MUST pass the verified commit
          the release tag resolves to, so tests run against the same source
          the image/assets were built from.
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      container_image:
        description: Optional container image override for the test jobs. When unset, the workflow tries the latest release-tagged image and falls back to :latest.
        required: false
        default: ''
        type: string
      source_ref:
        description: >-
          Exact commit SHA (or other ref) to check out the test source
          (Tests/helia-core-tester) from. Leave unset to use the ref that
          triggered this run.
        required: false
        default: ''
        type: string

jobs:
  resolve-container-image:
    uses: ./.github/workflows/resolve-ci-image.yml
    with:
      container_image: ${{ inputs.container_image }}

  codegen-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: resolve-container-image
    container:
      image: ${{ needs.resolve-container-image.outputs.container_image }}
    strategy:
      fail-fast: false
      matrix:
        cpu:
          - cortex-m0
          - cortex-m4
          - cortex-m55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive

      - name: Log selected container image
        shell: bash
        run: |
          {
            echo "### Job container image"
            echo "- selected image: \`${{ needs.resolve-container-image.outputs.container_image }}\`"
            echo "- source: \`${{ needs.resolve-container-image.outputs.resolved_from }}\`"
            if [[ -n "${{ needs.resolve-container-image.outputs.release_tag }}" ]]; then
              echo "- latest release tag: \`${{ needs.resolve-container-image.outputs.release_tag }}\`"
            else
              echo "- latest release tag: _(unavailable)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark workspace as a safe git directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify pinned helia-core-tester release tag
        id: helia-core-meta
        shell: bash
        run: |
          set -euo pipefail
          submodule_path='Tests/helia-core-tester'
          git -C "${submodule_path}" fetch --force --tags
          helia_sha="$(git rev-parse HEAD:${submodule_path})"
          helia_tag="$(git -C "${submodule_path}" describe --tags --abbrev=0 2>/dev/null || echo 'no-tag')"

          echo "helia_sha=${helia_sha}" >> "$GITHUB_OUTPUT"
          echo "helia_tag=${helia_tag}" >> "$GITHUB_OUTPUT"

          printf 'Pinned helia-core-tester: %s (%s)\n' "${helia_tag}" "${helia_sha}"
          {
            echo "### helia-core-tester version"
            echo "- tag: \`${helia_tag}\`"
            echo "- sha: \`${helia_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache helia-core-tester downloads
        uses: actions/cache@v5
        with:
          path: Tests/helia-core-tester/artifacts/downloads
          key: helia-core-tester-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tests/helia-core-tester/scripts/setup_ci.sh', 'Tests/helia-core-tester/helia_core_tester/scripts/setup_dependencies.py') }}
          restore-keys: |
            helia-core-tester-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup helia-core-tester build dependencies
        run: |
          cd Tests/helia-core-tester
          ./scripts/setup_ci.sh

      - name: Run helia-core-tester full pipeline with coverage and JUnit
        run: |
          cd Tests/helia-core-tester
          uv run helia_core_tester full --cpu ${{ matrix.cpu }} --suite int --coverage --report-formats json --report-formats junit --run-jobs 0 --verbosity 1

      - name: Upload per-CPU reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.cpu }}
          path: Tests/helia-core-tester/artifacts/reports
          if-no-files-found: error

  # Shipped-flags execution legs (AmbiqAI/ns-cmsis-nn#358). The coverage
  # legs above compile the library at -O0 (the tester's --coverage appends
  # -O0 after CMSIS_OPTIMIZATION_LEVEL, and the last -O wins) and, outside
  # the --coverage-mve-float legs, define ARM_MATH_AUTOVECTORIZE, which
  # swaps the shipped MVE inline-asm integer paths for C fallbacks. So
  # without this job no CI leg executes what ships: -Ofast (the tester
  # default) with the real MVE paths. These legs still run the container's
  # single GCC, so cross-toolchain divergence at -Ofast (#340) needs a
  # second executing toolchain and stays open. Coverage legs keep
  # measuring coverage; these legs are the functional gate for shipped
  # code, on the shipping silicon (m4, m55) plus the m55 float MVE paths.
  # m0 shipped-flags execution stays release-tier (the legacy Unity leg
  # called from release.yml builds m0 at that harness's own default
  # -Ofast, Tests/UnitTest/build_and_run_tests.sh).
  shipped-flags-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: resolve-container-image
    container:
      image: ${{ needs.resolve-container-image.outputs.container_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: cortex-m4
            suite: int
            extra_args: ''
            profile_name: m4-int-shipped
          - cpu: cortex-m55
            suite: int
            extra_args: ''
            profile_name: m55-int-shipped
          - cpu: cortex-m55
            suite: float
            extra_args: '--float-precision f32'
            profile_name: m55-f32-shipped
          - cpu: cortex-m55
            suite: float
            extra_args: '--float-precision f16'
            profile_name: m55-f16-shipped

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive

      - name: Log selected container image
        shell: bash
        run: |
          {
            echo "### Job container image"
            echo "- selected image: \`${{ needs.resolve-container-image.outputs.container_image }}\`"
            echo "- source: \`${{ needs.resolve-container-image.outputs.resolved_from }}\`"
            if [[ -n "${{ needs.resolve-container-image.outputs.release_tag }}" ]]; then
              echo "- latest release tag: \`${{ needs.resolve-container-image.outputs.release_tag }}\`"
            else
              echo "- latest release tag: _(unavailable)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark workspace as a safe git directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify pinned helia-core-tester release tag
        id: helia-core-meta
        shell: bash
        run: |
          set -euo pipefail
          submodule_path='Tests/helia-core-tester'
          git -C "${submodule_path}" fetch --force --tags
          helia_sha="$(git rev-parse HEAD:${submodule_path})"
          helia_tag="$(git -C "${submodule_path}" describe --tags --abbrev=0 2>/dev/null || echo 'no-tag')"

          echo "helia_sha=${helia_sha}" >> "$GITHUB_OUTPUT"
          echo "helia_tag=${helia_tag}" >> "$GITHUB_OUTPUT"

          printf 'Pinned helia-core-tester: %s (%s)\n' "${helia_tag}" "${helia_sha}"
          {
            echo "### helia-core-tester version"
            echo "- tag: \`${helia_tag}\`"
            echo "- sha: \`${helia_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache helia-core-tester downloads
        uses: actions/cache@v5
        with:
          path: Tests/helia-core-tester/artifacts/downloads
          key: helia-core-tester-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tests/helia-core-tester/scripts/setup_ci.sh', 'Tests/helia-core-tester/helia_core_tester/scripts/setup_dependencies.py') }}
          restore-keys: |
            helia-core-tester-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup helia-core-tester build dependencies
        run: |
          cd Tests/helia-core-tester
          ./scripts/setup_ci.sh

      # No --coverage: the tester's default -Ofast stands, and the real
      # MVE integer paths compile instead of the AUTOVECTORIZE fallbacks.
      - name: Run helia-core-tester at shipped flags (no coverage)
        run: |
          cd Tests/helia-core-tester
          uv run helia_core_tester full --cpu ${{ matrix.cpu }} --suite ${{ matrix.suite }} ${{ matrix.extra_args }} --report-formats json --report-formats junit --run-jobs 0 --verbosity 1

      - name: Upload shipped-flags reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.profile_name }}
          path: Tests/helia-core-tester/artifacts/reports
          if-no-files-found: error

  codegen-tests-mve-float:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: resolve-container-image
    container:
      image: ${{ needs.resolve-container-image.outputs.container_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - float_precision: f32
            profile_name: m55-f32-mvef
          - float_precision: f16
            profile_name: m55-f16-mvef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive

      - name: Log selected container image
        shell: bash
        run: |
          {
            echo "### Job container image"
            echo "- selected image: \`${{ needs.resolve-container-image.outputs.container_image }}\`"
            echo "- source: \`${{ needs.resolve-container-image.outputs.resolved_from }}\`"
            if [[ -n "${{ needs.resolve-container-image.outputs.release_tag }}" ]]; then
              echo "- latest release tag: \`${{ needs.resolve-container-image.outputs.release_tag }}\`"
            else
              echo "- latest release tag: _(unavailable)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark workspace as a safe git directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify pinned helia-core-tester release tag
        id: helia-core-meta
        shell: bash
        run: |
          set -euo pipefail
          submodule_path='Tests/helia-core-tester'
          git -C "${submodule_path}" fetch --force --tags
          helia_sha="$(git rev-parse HEAD:${submodule_path})"
          helia_tag="$(git -C "${submodule_path}" describe --tags --abbrev=0 2>/dev/null || echo 'no-tag')"

          echo "helia_sha=${helia_sha}" >> "$GITHUB_OUTPUT"
          echo "helia_tag=${helia_tag}" >> "$GITHUB_OUTPUT"

          printf 'Pinned helia-core-tester: %s (%s)\n' "${helia_tag}" "${helia_sha}"
          {
            echo "### helia-core-tester version"
            echo "- tag: \`${helia_tag}\`"
            echo "- sha: \`${helia_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache helia-core-tester downloads
        uses: actions/cache@v5
        with:
          path: Tests/helia-core-tester/artifacts/downloads
          key: helia-core-tester-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tests/helia-core-tester/scripts/setup_ci.sh', 'Tests/helia-core-tester/helia_core_tester/scripts/setup_dependencies.py') }}
          restore-keys: |
            helia-core-tester-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup helia-core-tester build dependencies
        run: |
          cd Tests/helia-core-tester
          ./scripts/setup_ci.sh

      - name: Run helia-core-tester float suite with MVE float coverage
        run: |
          cd Tests/helia-core-tester
          uv run helia_core_tester full --cpu cortex-m55 --suite float --float-precision ${{ matrix.float_precision }} --coverage --coverage-mve-float --report-formats json --report-formats junit --run-jobs 0 --verbosity 1

      - name: Upload cortex-m55 MVE float full reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.profile_name }}
          path: Tests/helia-core-tester/artifacts/reports
          if-no-files-found: error

  codegen-tests-float-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: resolve-container-image
    container:
      image: ${{ needs.resolve-container-image.outputs.container_image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: cortex-m4
            float_precision: f32
            profile_name: m4-f32-fallback
          - cpu: cortex-m55
            float_precision: f32
            profile_name: m55-f32-fallback
          - cpu: cortex-m55
            float_precision: f16
            profile_name: m55-f16-fallback

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive

      - name: Log selected container image
        shell: bash
        run: |
          {
            echo "### Job container image"
            echo "- selected image: \`${{ needs.resolve-container-image.outputs.container_image }}\`"
            echo "- source: \`${{ needs.resolve-container-image.outputs.resolved_from }}\`"
            if [[ -n "${{ needs.resolve-container-image.outputs.release_tag }}" ]]; then
              echo "- latest release tag: \`${{ needs.resolve-container-image.outputs.release_tag }}\`"
            else
              echo "- latest release tag: _(unavailable)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark workspace as a safe git directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify pinned helia-core-tester release tag
        id: helia-core-meta
        shell: bash
        run: |
          set -euo pipefail
          submodule_path='Tests/helia-core-tester'
          git -C "${submodule_path}" fetch --force --tags
          helia_sha="$(git rev-parse HEAD:${submodule_path})"
          helia_tag="$(git -C "${submodule_path}" describe --tags --abbrev=0 2>/dev/null || echo 'no-tag')"

          echo "helia_sha=${helia_sha}" >> "$GITHUB_OUTPUT"
          echo "helia_tag=${helia_tag}" >> "$GITHUB_OUTPUT"

          printf 'Pinned helia-core-tester: %s (%s)\n' "${helia_tag}" "${helia_sha}"
          {
            echo "### helia-core-tester version"
            echo "- tag: \`${helia_tag}\`"
            echo "- sha: \`${helia_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache helia-core-tester downloads
        uses: actions/cache@v5
        with:
          path: Tests/helia-core-tester/artifacts/downloads
          key: helia-core-tester-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tests/helia-core-tester/scripts/setup_ci.sh', 'Tests/helia-core-tester/helia_core_tester/scripts/setup_dependencies.py') }}
          restore-keys: |
            helia-core-tester-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup helia-core-tester build dependencies
        run: |
          cd Tests/helia-core-tester
          ./scripts/setup_ci.sh

      - name: Run helia-core-tester float fallback coverage
        run: |
          cd Tests/helia-core-tester
          uv run helia_core_tester full --cpu ${{ matrix.cpu }} --suite float --float-precision ${{ matrix.float_precision }} --coverage --report-formats json --report-formats junit --run-jobs 0 --verbosity 1

      - name: Upload float fallback reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.profile_name }}
          path: Tests/helia-core-tester/artifacts/reports
          if-no-files-found: error

  coverage-merge-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: read -- checkout (+ public submodules).
    # actions: read -- the coverage gate step fetches the previous
    # successful main run's coverage-merged artifact via the GitHub API.
    # Declared explicitly so the gate keeps working if the repo's default
    # token permissions are ever tightened; both scopes are read-scoped and
    # present even in the read-only fork-PR token (when they are not, the
    # gate degrades to floor-only, loudly -- see check_coverage_gate.py).
    permissions:
      contents: read
      actions: read
    needs:
      - resolve-container-image
      - codegen-tests
      - codegen-tests-mve-float
      - codegen-tests-float-fallback
    container:
      image: ${{ needs.resolve-container-image.outputs.container_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive

      - name: Log selected container image
        shell: bash
        run: |
          {
            echo "### Job container image"
            echo "- selected image: \`${{ needs.resolve-container-image.outputs.container_image }}\`"
            echo "- source: \`${{ needs.resolve-container-image.outputs.resolved_from }}\`"
            if [[ -n "${{ needs.resolve-container-image.outputs.release_tag }}" ]]; then
              echo "- latest release tag: \`${{ needs.resolve-container-image.outputs.release_tag }}\`"
            else
              echo "- latest release tag: _(unavailable)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark workspace as a safe git directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify pinned helia-core-tester release tag
        id: helia-core-meta
        shell: bash
        run: |
          set -euo pipefail
          submodule_path='Tests/helia-core-tester'
          git -C "${submodule_path}" fetch --force --tags
          helia_sha="$(git rev-parse HEAD:${submodule_path})"
          helia_tag="$(git -C "${submodule_path}" describe --tags --abbrev=0 2>/dev/null || echo 'no-tag')"

          echo "helia_sha=${helia_sha}" >> "$GITHUB_OUTPUT"
          echo "helia_tag=${helia_tag}" >> "$GITHUB_OUTPUT"

          printf 'Pinned helia-core-tester: %s (%s)\n' "${helia_tag}" "${helia_sha}"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install and sync Python deps (helia-core-tester)
        run: |
          cd Tests/helia-core-tester
          uv sync

      - name: Download cortex-m0 reports
        uses: actions/download-artifact@v8
        with:
          name: reports-cortex-m0
          path: Tests/helia-core-tester/artifacts/reports

      - name: Download cortex-m4 reports
        uses: actions/download-artifact@v8
        with:
          name: reports-cortex-m4
          path: Tests/helia-core-tester/artifacts/reports

      - name: Download cortex-m55 reports
        uses: actions/download-artifact@v8
        with:
          name: reports-cortex-m55
          path: Tests/helia-core-tester/artifacts/reports

      - name: Download m4 f32 float fallback reports
        uses: actions/download-artifact@v8
        with:
          name: reports-m4-f32-fallback
          path: Tests/helia-core-tester/artifacts/reports-fallback/m4-f32

      - name: Download m55 f32 float fallback reports
        uses: actions/download-artifact@v8
        with:
          name: reports-m55-f32-fallback
          path: Tests/helia-core-tester/artifacts/reports-fallback/m55-f32

      - name: Download m55 f16 float fallback reports
        uses: actions/download-artifact@v8
        with:
          name: reports-m55-f16-fallback
          path: Tests/helia-core-tester/artifacts/reports-fallback/m55-f16

      - name: Download m55 f32 MVE float reports
        uses: actions/download-artifact@v8
        with:
          name: reports-m55-f32-mvef
          path: Tests/helia-core-tester/artifacts/reports-mvef/m55-f32

      - name: Download m55 f16 MVE float reports
        uses: actions/download-artifact@v8
        with:
          name: reports-m55-f16-mvef
          path: Tests/helia-core-tester/artifacts/reports-mvef/m55-f16

      - name: Stage combined float/float-mve coverage inputs for merge
        run: |
          cd Tests/helia-core-tester
          uv run python -m helia_core_tester.scripts.merge_lcov_inputs \
            --input artifacts/reports-fallback/m4-f32/coverage/float/cortex-m4/coverage.info \
            --output artifacts/reports/coverage/float/cortex-m4/coverage.info

          uv run python -m helia_core_tester.scripts.merge_lcov_inputs \
            --input artifacts/reports-fallback/m55-f32/coverage/float/cortex-m55/coverage.info \
            --input artifacts/reports-fallback/m55-f16/coverage/float/cortex-m55/coverage.info \
            --output artifacts/reports/coverage/float/cortex-m55/coverage.info

          uv run python -m helia_core_tester.scripts.merge_lcov_inputs \
            --input artifacts/reports-mvef/m55-f32/coverage/float-mve/cortex-m55/coverage.info \
            --input artifacts/reports-mvef/m55-f16/coverage/float-mve/cortex-m55/coverage.info \
            --output artifacts/reports/coverage/float-mve/cortex-m55/coverage.info

      - name: Run helia-core-tester coverage merge
        run: |
          cd Tests/helia-core-tester
          uv run helia_core_tester coverage-merge --cpu cortex-m0,cortex-m4,cortex-m55 --suite both --include-mve-float

      - name: Publish CPU coverage and test summary table
        run: |
          cd Tests/helia-core-tester
          uv run python -m helia_core_tester.scripts.publish_cpu_coverage_summary --artifacts-root artifacts --cpus cortex-m0,cortex-m4,cortex-m55 --suite int --profile "m4-f32-fallback|cortex-m4|artifacts/reports-fallback/m4-f32|float|float" --profile "m55-f32-fallback|cortex-m55|artifacts/reports-fallback/m55-f32|float|float" --profile "m55-f16-fallback|cortex-m55|artifacts/reports-fallback/m55-f16|float|float" --profile "m55-f32-mvef|cortex-m55|artifacts/reports-mvef/m55-f32|float-mve|float" --profile "m55-f16-mvef|cortex-m55|artifacts/reports-mvef/m55-f16|float-mve|float" --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload merged coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-merged
          path: Tests/helia-core-tester/artifacts/reports/coverage/merged
          if-no-files-found: error

      # Coverage gate (AmbiqAI/ns-cmsis-nn#356, AmbiqAI/helia-core-tester#73).
      # Deliberately AFTER the upload so the coverage-merged artifact exists
      # even when the gate fails -- it is both the evidence for debugging the
      # failure and the baseline for later runs. Unlike matrix-summary below,
      # which is pure reporting and must never redden `CI Passed`, this step
      # is a GATE by design: no continue-on-error, a floor breach or a real
      # regression fails the job. When the previous main baseline cannot be
      # fetched (retention, first run, API hiccup, a token without
      # actions: read on a fork) the script degrades to floor-only with a
      # loud summary warning instead of flaking -- honest degradation.
      # Stdlib-only python, floor lives in the reviewed ci/coverage-floor.json.
      - name: Gate merged line coverage (floor + no-regression)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The script is stdlib-only; `uv run python` just reuses the venv the
        # job already synced, because the container is not guaranteed to ship
        # a bare `python3` on PATH.
        run: |
          cd Tests/helia-core-tester
          uv run python "$GITHUB_WORKSPACE/scripts/ci/check_coverage_gate.py" \
            --summary-json artifacts/reports/coverage/merged/coverage_merged_summary.json \
            --floor-file "$GITHUB_WORKSPACE/ci/coverage-floor.json" \
            --repo "${{ github.repository }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  # Per-cell status grid for the test matrix (AmbiqAI/ns-cmsis-nn#356).
  # `CI Passed` is a single tick; this job renders WHICH legs ran, their
  # pass/fail counts, and the names of failing cases into the run summary.
  # Pure reporting, never a gate: ci.yml gates on this reusable workflow
  # as one unit, so a failure here would redden `CI Passed` -- which a
  # summary bug must never do. Three layers together guarantee that: the
  # renderer catches rendering and write errors into the summary/stdout,
  # the download/render steps carry continue-on-error against
  # interpreter- or action-level failures, and the job-level
  # continue-on-error below covers everything else (checkout, runner).
  # `if: always()` is load-bearing for the same reason grids exist: the
  # summary is most needed exactly when test legs fail. Columns are legs
  # (suite x build flavour), driven by the script's EXPECTED artifact map
  # plus its COLUMNS order list -- a second toolchain later (#340) is one
  # COLUMNS entry and one EXPECTED line per CPU, no restructuring. Plain
  # runner, stdlib-only python: zero new action or pip dependencies.
  matrix-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level continue-on-error is the outermost layer of the non-gating
    # guarantee: it keeps a failure ANYWHERE in this job (checkout flake,
    # runner provisioning, a future step) from failing the reusable
    # workflow, which ci.yml gates as a single unit. The step-level
    # continue-on-error lines and the renderer's own exit-0 discipline
    # remain as inner layers for tidier step UI and local runs.
    continue-on-error: true
    if: always()
    needs:
      - codegen-tests
      - shipped-flags-tests
      - codegen-tests-mve-float
      - codegen-tests-float-fallback
    steps:
      # Only scripts/ci/ is needed; no submodules (the tester source is
      # irrelevant here, and this must not disturb the submodule pin).
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      # Pattern download so a leg whose upload never happened (job died
      # before `always()` could fire, runner lost) does not fail this
      # job -- the renderer shows that leg as "missing" instead.
      - name: Download all test report artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          path: matrix-reports

      - name: Render test matrix grid into the run summary
        continue-on-error: true
        run: python3 scripts/ci/render_test_matrix_summary.py --reports-root matrix-reports --summary-file "$GITHUB_STEP_SUMMARY"
