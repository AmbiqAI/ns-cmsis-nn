name: License Headers

on:
  # Invoked from ci.yml so it reports under the single required gate
  # (AmbiqAI/ns-cmsis-nn#353); keep no push/pull_request trigger of its own.
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    name: SPDX header check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify SPDX headers under Source/ and Include/
        run: bash scripts/check_license_headers.sh Source Include
