# Simple workflow for checking PDSC
name: Verify that PDSC file is up to date

on:
  # Invoked from ci.yml so it reports under the single required gate
  # (AmbiqAI/ns-cmsis-nn#353); keep no push/pull_request trigger of its own.
  workflow_call:
  workflow_dispatch:

jobs:
  check_pdsc:
    name: Check PDSC file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check
        run: |
          sh check_pdsc.sh

  pdsc_contract:
    # Wider invariant check than check_pdsc.sh: pack/component identity,
    # version sync across release-please / arm_nn_types.h / pdsc, license
    # plumbing, and every <file> path resolves on disk. See M3 #170.
    name: PDSC contract (identity, versions, files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run contract test
        run: python3 scripts/check_pdsc.py

      # The float32 tanh LUT is generated data, and no test can catch a
      # corrupted entry: the unit suite reads the same array it checks, so it
      # pins the interpolation algorithm but not the table contents. Re-derive
      # the table and compare it against what is checked in.
      - name: Check generated f32 tanh LUT is re-derivable
        run: python3 scripts/gen_tanh_lut_f32.py --check Source/NNSupportFunctions/arm_nntables_flt.c

  stale_version_refs:
    # Complements check_pdsc.py's extra-files audit from the other side.
    # That one asks "is everything *listed* in release-please-config.json
    # annotated and in sync"; it is blind to a file that stamps the release
    # version but was never listed, which drifts a release behind forever
    # with every gate green. This one reads the previous release out of
    # CHANGELOG.md and asserts no tracked file still mentions it, outside an
    # explicit allowlist of files whose job is to discuss release history.
    # It fires on the release-please PR itself, where a silently-skipped
    # extra-file is still carrying the old version. See #347.
    name: No stale previous-version references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run stale version reference check
        run: python3 scripts/check_stale_version_refs.py

      # On most days the tree contains no previous-release mentions, so a
      # green result proves little about the scanner -- its mutation tests
      # are what keep it honest between releases.
      - name: Run stale version reference check tests
        run: python3 scripts/tests/test_check_stale_version_refs.py

  float_cmsis_components:
    # Static guard for the float unit-test wiring: the csolution pack pin
    # tracks the pdsc <release version>, component selectors are fully
    # qualified, and SSE-300-only device components stay gated on
    # +Corstone-300-FVP. Cheap stand-in for a cbuild run.
    name: Float CMSIS component wiring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pyyaml==6.0.3

      - name: Run float component check
        run: python3 scripts/check_float_cmsis_components.py

  dsp_symbol_collisions:
    # Guards against a public ns-cmsis-nn symbol colliding with a CMSIS-DSP
    # symbol -- two libraries Ambiq ships and links together, where a
    # same-named, differently-signed pair is a silent link-order bug with
    # no compiler warning. arm_abs_f16/arm_abs_f32 shipped in that state
    # for a full cycle (#240) before being caught by hand in review (#281)
    # and renamed; more of our shipped int8/int16 kernel families have an
    # "obvious" float name CMSIS-DSP already owns -- run the check with
    # --list-hazards for the current set rather than trusting a count
    # written here, which is exactly the drift --list-hazards exists to
    # prevent. See #282.
    name: CMSIS-DSP symbol collisions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run DSP symbol collision check
        run: python3 scripts/check_dsp_symbol_collisions.py

  header_placeholders:
    # Guards against an unsubstituted documentation template token -- the
    # literal `{API}_get_buffer_size()` -- surviving into a public header.
    # 17 public kernels shipped with that placeholder in their `ctx` doxygen,
    # telling callers to size ctx->buf via a function whose name the docs
    # then declined to supply. Twice (#269) someone resolved it by hand and
    # got it wrong, landing on a sizer that reads a different cmsis_nn_dims
    # field, under-sizing the allocation, and the kernel wrote past it: a
    # shipped heap overflow originating in a docs placeholder. The
    # placeholder is the defect source, so the placeholder is what gets
    # gated. See #288.
    name: Public header placeholders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run header placeholder check
        run: python3 scripts/check_header_placeholders.py

  toolchain_manifest_sync:
    # Guards against the armclang/ATfE pins in ci/tools/manifest.json (which
    # bakes the published dev container) drifting from ci/toolchains/*.json
    # (which selects the compilers the shipped static libraries are built
    # with). They had already drifted -- container armclang 6.24.0 / ATfE
    # 20.1.0 against shipped 6.23.32 / 19.1.5 -- with nothing relating the
    # two files, so developers and helia-core-tester ran a different compiler
    # than the product is built with. That is a "reproduces in neither
    # direction" defect for any codegen or ABI question, and since the two
    # files are edited by different workflows for different reasons they
    # will drift again without a gate.
    name: Toolchain manifest sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run toolchain manifest sync check
        run: python3 scripts/check_toolchain_manifest_sync.py

  api_group_classification:
    # Guards docs/_ext/api_group_index.py's GROUP_PATTERNS: every public
    # top-level kernel in Include/arm_nnfunctions*.h must match at least
    # one group, or it silently disappears from the customer-facing
    # "Browse By Kernel Family" docs page with an otherwise green docs
    # build. 26 kernels -- every float pooling, batch-norm, transpose and
    # depthwise-conv variant among them -- shipped in that state before
    # being caught by hand in review. See #283.
    name: Docs API group classification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run API group classification check
        run: python3 scripts/check_api_group_classification.py

  script_check_tests:
    # Mutation tests for the scripts/check_*.py merge gates.
    #
    # Each scripts/check_*.py gate in this workflow has at least one suite
    # in scripts/tests/ whose job is to prove the gate can still fail: a
    # check that passes when it should not is worse than no check, and their
    # logic is easy to regress in either direction. Some of what they cover
    # is visible nowhere else in CI -- pdsc check #7 (float dtype gating) is
    # green everywhere else;
    # check #8 (extra-files annotations) fails only at release time, where a
    # broken annotation is invisible until a release bumps nothing; check
    # #10 (unit-test suite buildability) was for years the only gate that
    # looked at the float unit suites at all -- no job built them, which is
    # how registered-but-uncompilable suites read as coverage and hid a
    # shipped transpose-conv bug (#253, #256) -- until #330/#341 built and
    # ran them on the host-sanitizer and legacy-tester legs.
    #
    # These ran as a step inside each check's own job, named one at a time.
    # scripts/tests/test_check_pdsc_ssot.py -- which gates the check on the
    # single-source-of-truth source list that check_pdsc.py compares the
    # pdsc against -- was added in #298 and never added to that list, so it
    # had never run here: a suite guarding a merge gate, unwatched, with
    # nothing to say so. Enumerating them is the defect, so this job globs
    # and the next suite added is covered by having been written. See #339.
    name: Script check test suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # test_check_float_cmsis_components.py runs check_float_cmsis_components.py
      # in a subprocess and that script imports yaml. Same pin as the
      # float_cmsis_components job, which runs the checker itself.
      - name: Install dependencies
        run: python -m pip install pyyaml==6.0.3

      - name: Run every scripts/tests/test_check_*.py
        run: |
          set -eu
          # An empty glob must fail the job, not pass it vacuously: this
          # whole job exists because a suite can go unrun without saying so.
          shopt -s failglob
          status=0
          for suite in scripts/tests/test_check_*.py; do
            echo "== $suite"
            python3 "$suite" || status=1
          done
          exit $status

      # Invoked rather than run through bash so a suite that lost its
      # executable bit fails here instead of on a release publish.
      - name: Run every scripts/tests/test_check_*.sh
        run: |
          set -eu
          shopt -s failglob
          status=0
          for suite in scripts/tests/test_check_*.sh; do
            echo "== $suite"
            "$suite" || status=1
          done
          exit $status
