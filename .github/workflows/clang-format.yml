name: clang-format

on:
  # Invoked from ci.yml so it reports under the single required gate
  # (AmbiqAI/ns-cmsis-nn#353); keep no push/pull_request trigger of its own.
  workflow_call:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref used for changed-file detection.
        required: false
        default: origin/main
      head_ref:
        description: Head ref used for changed-file detection.
        required: false
        default: HEAD

permissions:
  contents: read

jobs:
  changed-files:
    name: changed C/H files
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pre-commit
        run: python -m pip install pre-commit==3.8.0

      - name: Validate pre-commit config
        run: pre-commit validate-config

      - name: Check formatting for changed C/H files (PR)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: HEAD
        run: bash scripts/check_clang_format_changed.sh "${BASE_REF}" "${HEAD_REF}"

      # The || fallbacks are load-bearing: when ci.yml itself is dispatched
      # manually, this workflow runs via workflow_call with event_name
      # 'workflow_dispatch' but an EMPTY inputs context (dispatch input
      # defaults do not propagate to callees), and the script hard-fails on
      # an empty BASE_REF.
      - name: Check formatting for changed C/H files (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BASE_REF: ${{ inputs.base_ref || 'origin/main' }}
          HEAD_REF: ${{ inputs.head_ref || 'HEAD' }}
        run: bash scripts/check_clang_format_changed.sh "${BASE_REF}" "${HEAD_REF}"
