#
# s8 fully connected implementations. Schema and field rules: scripts/check_kernel_implementations.py.
# Regenerate the export with `python3 scripts/check_kernel_implementations.py export`.

family: fully_connected_s8

implementations:
  - id: fully_connected_s8
    op: fully_connected
    quantization: per_tensor
    dtypes: {input_data: int8, filter_data: int8, bias_data: int32, output_data: int8}
    layout: {input_data: NHWC, filter_data: OI, output_data: NC}
    entry: arm_fully_connected_s8
    routed_by:
      wrapper: arm_fully_connected_wrapper_s8
      route: fc_wrapper_s8:per_tensor
      requires: []
      when: quant_params->is_per_channel == 0
    requires: []
    buffers:
      - name: kernel_sums
        param: ctx
        size_query:
          symbol: arm_fully_connected_s8_get_buffer_size
          args: {filter_dims: filter_dims}
        units: bytes
        align: 4
        lifetime: prepared
        optional: true
        note: >-
          Read only on ARM_MATH_MVEI builds, where the sums carry the bias and bias_data is ignored. The sizer returns 0
          elsewhere. Never clear it between calls.
    prepare:
      - symbol: arm_vector_sum_s8
        args:
          vector_sum_buf: buffer:kernel_sums
          vector_cols: filter_dims.n
          vector_rows: output_dims.c
          vector_data: filter_data
          lhs_offset: fc_params.input_offset
          rhs_offset: fc_params.filter_offset
          bias_data: bias_data
    declines: []
    since: 7.0.0
    numerics:
      reference: hct_ref:fully_connected_s8
      claim: bit_exact
      holds_with: ['!single_rounding']

  - id: fully_connected_per_channel_s8
    op: fully_connected
    quantization: per_channel
    dtypes: {input_data: int8, filter_data: int8, bias_data: int32, output_data: int8}
    layout: {input_data: NHWC, filter_data: OI, output_data: NC}
    entry: arm_fully_connected_per_channel_s8
    routed_by:
      wrapper: arm_fully_connected_wrapper_s8
      route: fc_wrapper_s8:per_channel
      requires: []
      when: quant_params->is_per_channel != 0
    requires: []
    buffers:
      - name: kernel_sums
        param: ctx
        size_query:
          symbol: arm_fully_connected_s8_get_buffer_size
          args: {filter_dims: filter_dims}
        units: bytes
        align: 4
        lifetime: prepared
        optional: true
        note: >-
          There is no per-channel sizer: arm_fully_connected_s8_get_buffer_size() returns the size this entry needs.
          Read only on ARM_MATH_MVEI builds. Never clear it between calls.
    prepare:
      - symbol: arm_vector_sum_s8
        args:
          vector_sum_buf: buffer:kernel_sums
          vector_cols: filter_dims.n
          vector_rows: output_dims.c
          vector_data: filter_data
          lhs_offset: fc_params.input_offset
          rhs_offset: fc_params.filter_offset
          bias_data: bias_data
    declines: []
    since: 7.0.0
    numerics:
      reference: hct_ref:fully_connected_s8
      claim: bit_exact
      holds_with: ['!single_rounding']

  - id: fully_connected_per_channel_packed_s8
    op: fully_connected
    quantization: per_channel
    dtypes: {input_data: int8, filter_data: int8, bias_data: int32, output_data: int8}
    layout: {input_data: NHWC, filter_data: OI, output_data: NC}
    entry: arm_fully_connected_per_channel_packed_s8
    operands: arm_fully_connected_per_channel_s8
    routed_by: direct
    requires: [mvei, '!autovectorize', '!single_rounding']
    eligibility:
      predicate: arm_nn_fc_packed_s8_supported
      args: {fc_params: fc_params, quant_params: quant_params, filter_dims: filter_dims}
      when: >-
        filter offset 0, positive depths, a stream of at most INT32_MAX bytes and every output channel
        right-shift-only. Layers outside it run arm_fully_connected_per_channel_s8().
    buffers:
      - name: kernel_sums
        param: null
        size_query:
          symbol: arm_fully_connected_s8_get_buffer_size
          args: {filter_dims: filter_dims}
        units: bytes
        align: 4
        lifetime: prepare
        optional: false
        note: >-
          Only an input of the pack step. Under the builds this implementation requires the sizer returns
          filter_dims->c * sizeof(int32_t).
      - name: packed_weights
        param: packed_data
        size_query:
          symbol: arm_fully_connected_per_channel_packed_s8_get_packed_size
          args: {filter_dims: filter_dims}
        units: bytes
        align: 4
        lifetime: prepared
        optional: false
        format: fc_per_channel_packed_s8/1
        note: >-
          Replaces filter_data, bias_data and quant_params at call time. The stream is read once per batch, front to
          back. The sizer returns 0, not -1, for a shape it cannot size.
    prepare:
      - symbol: arm_vector_sum_s8
        args:
          vector_sum_buf: buffer:kernel_sums
          vector_cols: filter_dims.n
          vector_rows: output_dims.c
          vector_data: filter_data
          lhs_offset: fc_params.input_offset
          rhs_offset: fc_params.filter_offset
          bias_data: bias_data
      - symbol: arm_fully_connected_per_channel_packed_s8_pack
        args:
          filter_dims: filter_dims
          filter_data: filter_data
          kernel_sum: buffer:kernel_sums
          quant_params: quant_params
          packed_data: buffer:packed_weights
    declines:
      - cause: build
        when: ARM_MATH_MVEI is not defined, or ARM_MATH_AUTOVECTORIZE or CMSIS_NN_USE_SINGLE_ROUNDING is defined
      - cause: layer
        when: fc_params->filter_offset != 0
    since: 7.39.3
    numerics:
      reference: hct_ref:fully_connected_s8
      claim: bit_exact
      holds_with: []
