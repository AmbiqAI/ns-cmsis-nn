solution:
  created-for: CMSIS-Toolbox@2.0.0

  cdefault:

  packs:
    - pack: Ambiq::NS-CMSIS-NN@7.29.2 # x-release-please-version
    - pack: ARM::CMSIS@6.3.0
    - pack: ARM::Cortex_DFP@1.1.0
    - pack: ARM::V2M_MPS3_SSE_300_BSP@1.5.0
    - pack: ARM::CMSIS-Compiler

  target-types:
    - type: Cortex-M0-FVP
      device: ARM::ARMCM0
      define:
        - FVP

    - type: Cortex-M4-FVP
      device: ARM::ARMCM4
      define:
        - FVP

    - type: Corstone-300-FVP
      device: ARM::SSE-300-MPS3
      define:
        - FVP
        - USING_FVP_CORSTONE_300

  build-types:
    - type: F32
      optimize: speed
      debug: on

    - type: F16
      optimize: speed
      debug: on

  projects:
    # F32 was dropped from this project with #256 (test_arm_convolve_f32's
    # host suite was one of the 35 registered-but-unbuildable float suites
    # deleted there; the F16 suite is broken the same way but rides with
    # #236 -- see scripts/check_pdsc.py's UNBUILDABLE_SUITE_ALLOWLIST). Its
    # cproject.yml only declares an F16 setup, but without this
    # `for-context` restriction the solution-wide F32 build-type still made
    # `test_arm_convolve_flt.F32+Corstone-300-FVP` resolve to a context that
    # links only unity.c and the Corstone layer -- no `main`, a guaranteed
    # link failure for anyone who tried it. Pin the project to the context
    # it actually has.
    - project: ./test_arm_convolve_flt/test_arm_convolve_flt.cproject.yml
      for-context: [.F16]
    - project: ./test_arm_reshape_flt/test_arm_reshape_flt.cproject.yml
    - project: ./test_arm_transpose_conv_flt/test_arm_transpose_conv_flt.cproject.yml

  output-dirs:
    cprjdir: ./$Project$.$BuildType$+$TargetType$-$Compiler$
    outdir: ./$Project$.$BuildType$+$TargetType$-$Compiler$/outdir
